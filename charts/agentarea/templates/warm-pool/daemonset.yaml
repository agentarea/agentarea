{{- if and .Values.mcpManager.enabled .Values.mcpManager.warmPool.enabled }}
{{- if has "warm_pool" .Values.mcpManager.features.enabled }}
{{- $root := . }}
{{- $profiles := .Values.mcpManager.warmPool.profiles }}
{{- $profilesByName := dict }}
{{- range $profile := $profiles }}
{{- if not (has $profile.packageInstall (list "allowed" "locked")) }}
{{- fail (printf "mcpManager.warmPool.profiles packageInstall must be allowed or locked, got %q" $profile.packageInstall) }}
{{- end }}
{{- if hasKey $profilesByName $profile.packageInstall }}
{{- fail (printf "duplicate warm-pool packageInstall profile %q" $profile.packageInstall) }}
{{- end }}
{{- $_ := set $profilesByName $profile.packageInstall true }}
{{- $expectedEnvironment := ternary "mutable" "immutable" (eq $profile.packageInstall "allowed") }}
{{- if ne $profile.managedEnvironment $expectedEnvironment }}
{{- fail (printf "warm-pool profile %q must use managedEnvironment %q" $profile.packageInstall $expectedEnvironment) }}
{{- end }}
{{- end }}
{{- if or (not (hasKey $profilesByName "allowed")) (not (hasKey $profilesByName "locked")) }}
{{- fail "mcpManager.warmPool.profiles must configure both allowed and locked profiles" }}
{{- end }}
{{- range $profile := $profiles }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agentarea.fullname" $root }}-warm-pool-{{ $profile.packageInstall }}
  labels:
    {{- include "agentarea.labels" $root | nindent 4 }}
    app.kubernetes.io/component: warm-pool
    mcp.agentarea.io/package-install: {{ $profile.packageInstall | quote }}
spec:
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: warm-pool
      mcp.agentarea.io/package-install: {{ $profile.packageInstall | quote }}
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: warm-pool
        mcp.agentarea.io/status: "waiting"
        mcp.agentarea.io/package-install: {{ $profile.packageInstall | quote }}
    spec:
      {{- /*
        Sandbox pods run LLM-written shell commands — the least trusted workload
        on the platform. They take their isolation from mcpManager.runtimeClass,
        the same value that drives MCP instance pods, so one setting governs both
        and neither can silently end up weaker than the other.

        Previously this hardcoded `kata-qemu` behind the kata_runtime flag, which
        pinned the chart to one vendor's runtime and offered nothing to clusters
        without KVM. The runtime class is now declared, not chosen for you.
      */ -}}
      {{- $runtimeClass := $root.Values.mcpManager.runtimeClass }}
      {{- if and (has "kata_runtime" $root.Values.mcpManager.features.enabled) (not $runtimeClass) }}
        {{- fail "mcpManager.features.enabled includes kata_runtime but mcpManager.runtimeClass is empty. The runtime class is no longer hardcoded: set mcpManager.runtimeClass explicitly (\"kata-qemu\" to keep the previous behaviour, or \"gvisor\")." }}
      {{- end }}
      {{- if $runtimeClass }}
      runtimeClassName: {{ $runtimeClass | quote }}
      {{- end }}
      serviceAccountName: {{ include "agentarea.mcpRuntimeServiceAccountName" $root }}
      automountServiceAccountToken: false
      {{- include "agentarea.imagePullSecrets" $root | nindent 6 }}
      containers:
        - name: warm-pod
          image: "{{ $profile.image.repository }}:{{ $profile.image.tag }}"
          imagePullPolicy: {{ $profile.image.pullPolicy }}
          ports:
            - name: activation
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 3000
              protocol: TCP
          env:
            - name: ACTIVATION_PORT
              value: "8080"
            - name: MCP_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "{{ $root.Values.mcpManager.warmPool.logLevel }}"
            - name: MAX_EXECUTION_TIMEOUT_SECONDS
              value: "{{ $root.Values.mcpManager.warmPool.maxExecutionTimeoutSeconds | default 1800 }}"
            - name: EXPECTED_MANAGED_ENVIRONMENT
              value: {{ $profile.managedEnvironment | quote }}
            - name: SANDBOX_ACTIVATION_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.global.secrets.application }}
                  key: sandbox-activation-secret
          resources:
            {{- toYaml ($profile.resources | default $root.Values.mcpManager.warmPool.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN      # tar: restore file ownership from image layers
                - MKNOD      # tar: recreate device nodes from image layers
                - SYS_CHROOT # chroot into the extracted container filesystem
          volumeMounts:
            - name: image-cache
              mountPath: /var/cache/mcp-images
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: image-cache
          hostPath:
            path: /var/lib/mcp-image-cache
            type: DirectoryOrCreate
        - name: workspace
          emptyDir: {}
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - warm-pool
                topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}
{{- end }}
