name: Validate Helm Chart Docs

on:
  pull_request:
    paths:
      - 'charts/agentarea/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm-docs
        run: |
          HELM_DOCS_VERSION=1.14.2
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin helm-docs

      - name: Run helm-docs
        run: |
          helm-docs --chart-search-root charts/agentarea --sort-values-order file

      - name: Fail if README changed
        run: |
          if ! git diff --quiet charts/agentarea/README.md; then
            echo "README.md is outdated; run helm-docs and commit"
            exit 1
          fi

