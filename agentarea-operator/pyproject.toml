[project]
name = "agentarea-operator"
version = "0.1.2"
description = "K8s operator for managing AgentArea LLM provider configs via CRDs"
requires-python = ">=3.14"
dependencies = [
    "kopf>=1.37",
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "kubernetes>=29.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "idna>=3.15",
    "pyyaml>=6.0",
    "urllib3>=2.8.0",
    # Same Fernet the platform's DatabaseSecretManager uses: this writes provider
    # credentials into encrypted_secrets, which that manager reads back.
    "cryptography>=42.0",
]

[tool.uv]
required-version = ">=0.13.3"
constraint-dependencies = [
    "certifi>=2026.10.19",
    "click==8.3.3",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["handler.py"]

[tool.hatch.build.targets.sdist]
include = ["handler.py", "crds", "tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
