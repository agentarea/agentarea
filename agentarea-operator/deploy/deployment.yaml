apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentarea-operator
  namespace: agentarea-staging
  labels:
    app: agentarea-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentarea-operator
  template:
    metadata:
      labels:
        app: agentarea-operator
    spec:
      serviceAccountName: agentarea-operator
      containers:
        - name: operator
          image: "10.109.26.228:5000/agentarea/agentarea-operator:latest"
          imagePullPolicy: Always
          command: ["kopf", "run", "handler.py", "--verbose"]
          env:
            - name: AGENTAREA_DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentarea-postgresql-secret
                  key: username
            - name: AGENTAREA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentarea-postgresql-secret
                  key: password
            - name: AGENTAREA_DB_HOST
              value: "ep-crimson-bread-aii6jbt8-pooler.c-4.us-east-1.aws.neon.tech"
            - name: AGENTAREA_DB_PORT
              value: "5432"
            - name: AGENTAREA_DB_NAME
              value: "neondb"
            - name: AGENTAREA_DB_SSLMODE
              value: "require"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
