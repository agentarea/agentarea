# Code Tools Configuration
# This file defines all available code-based tools and their metadata
# Tools are identified by publisher/name format

code_tools:
  # Calculator tool
  agentarea/calculator:
    display_name: "Calculator"
    description: "Perform basic mathematical calculations like addition, subtraction, multiplication, division"
    class_path: "agentarea_agents_sdk.tools.calculate_tool.CalculateTool"
    category: "utility"
    enabled_by_default: false
    requires_user_confirmation: false

  # Math toolset with configurable methods
  agentarea/math:
    display_name: "Math Toolset"
    description: "Mathematical operations including addition, subtraction, multiplication, division, and more"
    class_path: "agentarea_agents_sdk.tools.math_toolset.MathToolset"
    category: "math"
    enabled_by_default: false
    requires_user_confirmation: false
    # Available methods that can be enabled/disabled
    available_methods:
      - name: "add"
        display_name: "Addition"
        description: "Add two numbers together"
      - name: "subtract"
        display_name: "Subtraction"
        description: "Subtract one number from another"
      - name: "multiply"
        display_name: "Multiplication"
        description: "Multiply two numbers"
      - name: "divide"
        display_name: "Division"
        description: "Divide one number by another"
      - name: "power"
        display_name: "Power/Exponentiation"
        description: "Raise a number to a power"
      - name: "sqrt"
        display_name: "Square Root"
        description: "Calculate the square root of a number"
      - name: "sin"
        display_name: "Sine"
        description: "Calculate the sine of an angle"
      - name: "cos"
        display_name: "Cosine"
        description: "Calculate the cosine of an angle"
      - name: "tan"
        display_name: "Tangent"
        description: "Calculate the tangent of an angle"
      - name: "log"
        display_name: "Logarithm"
        description: "Calculate the logarithm of a number"
      - name: "abs"
        display_name: "Absolute Value"
        description: "Calculate the absolute value of a number"
      - name: "evaluate"
        display_name: "Expression Evaluator"
        description: "Safely evaluate mathematical expressions"

  # File Operations Toolset
  agentarea/files:
    display_name: "File Operations"
    description: "Read, write, and manipulate files and directories"
    class_path: "agentarea_agents_sdk.tools.file_toolset.FileToolset"
    category: "utility"
    enabled_by_default: false
    requires_user_confirmation: true
    available_methods:
      - name: "read_file"
        display_name: "Read File"
        description: "Read contents of a file"
      - name: "write_file"
        display_name: "Write File"
        description: "Write content to a file"
      - name: "list_directory"
        display_name: "List Directory"
        description: "List files and folders in a directory"
      - name: "create_directory"
        display_name: "Create Directory"
        description: "Create a new directory"
      - name: "delete_file"
        display_name: "Delete File"
        description: "Delete a file"

  # Web Search Toolset
  agentarea/web:
    display_name: "Web Tools"
    description: "Search the web and fetch information from websites"
    class_path: "agentarea_agents_sdk.tools.web_toolset.WebToolset"
    category: "information"
    enabled_by_default: false
    requires_user_confirmation: true
    available_methods:
      - name: "search_web"
        display_name: "Web Search"
        description: "Search the web for information"
      - name: "fetch_webpage"
        display_name: "Fetch Webpage"
        description: "Fetch content from a specific webpage"
      - name: "extract_text"
        display_name: "Extract Text"
        description: "Extract text content from HTML"

  # ── Platform Tools ─────────────────────────────────────────────
  # These wrap platform services and are available both to internal
  # agents (via ToolManager) and external clients (via /mcp).

  agentarea/agents:
    display_name: "Agent Management"
    description: "Create, list, update, and delete agents in the workspace"
    class_path: "agentarea_api.tools.agents_toolset.AgentsToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: false
    available_methods:
      - name: "list"
        display_name: "List Agents"
        description: "List all agents in the workspace"
      - name: "get"
        display_name: "Get Agent"
        description: "Get agent details by ID"
      - name: "create"
        display_name: "Create Agent"
        description: "Create a new agent"
      - name: "update"
        display_name: "Update Agent"
        description: "Update an existing agent"
      - name: "delete"
        display_name: "Delete Agent"
        description: "Delete an agent"

  agentarea/runs:
    display_name: "Agent Runs"
    description: "Start, monitor, and manage agent execution runs"
    class_path: "agentarea_api.tools.runs_toolset.RunsToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: false
    available_methods:
      - name: "start"
        display_name: "Start Run"
        description: "Start a new agent run"
      - name: "list"
        display_name: "List Runs"
        description: "List recent runs"
      - name: "get"
        display_name: "Get Run"
        description: "Get run status and details"
      - name: "cancel"
        display_name: "Cancel Run"
        description: "Cancel a running execution"

  agentarea/mcp_servers:
    display_name: "MCP Server Management"
    description: "Start, stop, and manage MCP server instances"
    class_path: "agentarea_api.tools.mcp_servers_toolset.MCPServersToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: false
    available_methods:
      - name: "create"
        display_name: "Create MCP Server"
        description: "Create a new MCP server instance"
      - name: "list"
        display_name: "List MCP Servers"
        description: "List all MCP server instances"
      - name: "get"
        display_name: "Get MCP Server"
        description: "Get MCP server instance details"
      - name: "start"
        display_name: "Start MCP Server"
        description: "Start an MCP server instance"
      - name: "stop"
        display_name: "Stop MCP Server"
        description: "Stop a running MCP server"

  agentarea/providers:
    display_name: "LLM Providers"
    description: "Manage LLM provider specs and configurations"
    class_path: "agentarea_api.tools.providers_toolset.ProvidersToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: false
    available_methods:
      - name: "list_specs"
        display_name: "List Provider Specs"
        description: "List available LLM providers"
      - name: "list_configs"
        display_name: "List Provider Configs"
        description: "List configured provider connections"
      - name: "create_config"
        display_name: "Create Provider Config"
        description: "Create a new provider configuration"
      - name: "delete_config"
        display_name: "Delete Provider Config"
        description: "Delete a provider configuration"

  agentarea/models:
    display_name: "Models"
    description: "List and inspect model specifications and instances"
    class_path: "agentarea_api.tools.models_toolset.ModelsToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: false
    available_methods:
      - name: "list_specs"
        display_name: "List Model Specs"
        description: "List available model specifications"
      - name: "list_instances"
        display_name: "List Model Instances"
        description: "List configured model instances"
      - name: "get"
        display_name: "Get Model Instance"
        description: "Get model instance details"

  agentarea/secrets:
    display_name: "Secrets Management"
    description: "Manage workspace secrets (names only, values are encrypted)"
    class_path: "agentarea_api.tools.secrets_toolset.SecretsToolset"
    category: "platform"
    enabled_by_default: false
    requires_user_confirmation: true
    available_methods:
      - name: "list"
        display_name: "List Secrets"
        description: "List secret names in the workspace"
      - name: "create"
        display_name: "Create Secret"
        description: "Create or update a secret"
      - name: "delete"
        display_name: "Delete Secret"
        description: "Delete a secret"

# Categories help organize tools in the UI
categories:
  - id: "utility"
    name: "Utility Tools"
    description: "Basic utility functions"
  - id: "math"
    name: "Mathematical Tools"
    description: "Individual mathematical operations and functions"
  - id: "information"
    name: "Information Tools"
    description: "Tools for gathering information"
  - id: "communication"
    name: "Communication Tools"
    description: "Tools for external communication"
  - id: "platform"
    name: "Platform Tools"
    description: "AgentArea platform management capabilities"
