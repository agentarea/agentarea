# Ory Hydra Configuration for AgentArea

version: v2.2.0

# DSN is overridden via docker-compose environment variable
# Default for reference: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/hydra
dsn: postgres://postgres:postgres@db:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    port: 4444
    host: 0.0.0.0
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
        - http://localhost:3001
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
  admin:
    port: 4445
    host: 0.0.0.0
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
        - http://localhost:3001
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type

urls:
  self:
    issuer: http://localhost:4444
  consent: http://localhost:3000/api/hydra/consent-redirect
  login: http://localhost:3000/api/hydra/login
  logout: http://localhost:3000/auth/logout
  error: http://localhost:3000/auth/error

# Secrets are intentionally NOT defined here. Hydra reads them from the
# environment (SECRETS_SYSTEM / SECRETS_COOKIE), supplied by the compose files
# from HYDRA_SECRETS_SYSTEM / HYDRA_SECRETS_COOKIE. Leaving them unset here means
# a deployment that forgets to provide them fails to start instead of silently
# running on a published value. Rotating SECRETS_SYSTEM invalidates issued
# tokens and encrypted columns, so treat it as a one-time install value.

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      # Supplied via OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT (HYDRA_PAIRWISE_SALT
      # in .env). Unset here so a deployment cannot inherit a published salt —
      # a shared salt makes pairwise subject identifiers linkable across installs.
      salt: ""
  dynamic_client_registration:
    enabled: true

log:
  level: debug
  format: text
  leak_sensitive_values: true

ttl:
  login_consent_request: 1h
  access_token: 1h
  refresh_token: 720h
  id_token: 1h
  auth_code: 10m

strategies:
  access_token: jwt

oauth2:
  expose_internal_errors: true
  allowed_top_level_claims:
    - workspace_id