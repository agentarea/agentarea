  - filename: agentarea-operator/pyproject.toml
    search: version = "{current_version}"
    replace: version = "{new_version}"

  - filename: agentarea-platform/libs/projects/pyproject.toml
    search: version = "{current_version}"
    replace: version = "{new_version}"

  - filename: agentarea-platform/libs/governance/pyproject.toml
    search: version = "{current_version}"
    replace: version = "{new_version}"

  - filename: agentarea-webapp/package.json
    search: '"version": "{current_version}"'
    replace: '"version": "{new_version}"'

  - filename: charts/agentarea/Chart.yaml
    search: 'appVersion: "{current_version}"'
    replace: 'appVersion: "{new_version}"'

  - filename: agentarea-mcp-manager/cmd/mcp-manager/main.go
    search: 'const version = "{current_version}"'
    replace: 'const version = "{new_version}"'

  - filename: agentarea-event-service/cmd/server/main.go
    search: 'const version = "{current_version}"'
    replace: 'const version = "{new_version}"'

  - filename: VERSION
    search: "{current_version}"
    replace: "{new_version}"
