name: Secret scan

# The detect-secrets pre-commit hook was configured but could never run: it
# points at --baseline .secrets.baseline and that file did not exist, and no
# workflow invoked pre-commit at all. That is how a shared JWT signing key, a
# Fernet encryption key and the Ory cookie/cipher secrets reached main.
#
# Enforcement uses `detect-secrets-hook`, not `detect-secrets scan`. `scan`
# CREATES a baseline and exits 0 regardless of what it finds; only the hook
# exits non-zero on a secret that is not already in the baseline.
#
# The version here must match the rev pinned in .pre-commit-config.yaml — a
# baseline written by a newer detect-secrets makes an older one abort with
# "No such plugin to initialize".
#
# Scoped to detect-secrets on purpose. The repo's other pre-commit hooks
# (trailing-whitespace, end-of-file-fixer, yamllint, shellcheck) have never run
# in CI and would fail broadly on existing files; enabling them is a separate,
# deliberate cleanup.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  DETECT_SECRETS_VERSION: "1.5.0"

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==${DETECT_SECRETS_VERSION}"

      - name: Require a baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Regenerate it with:"
            echo "  detect-secrets scan --exclude-files '.*\.lock\$' --exclude-files 'node_modules/.*' > .secrets.baseline"
            exit 1
          fi

      - name: Scan tracked files against the baseline
        run: |
          set -o pipefail
          git ls-files -z \
            | tr '\0' '\n' \
            | grep -v -E '\.lock$|^node_modules/|^\.omc/|package-lock\.json$|pnpm-lock\.yaml$' \
            | tr '\n' '\0' \
            | xargs -0 detect-secrets-hook --baseline .secrets.baseline
