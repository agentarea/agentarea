version: "3.8"
services:
  app:
    image: agentarea/agentarea-api:${VERSION:-latest}
    container_name: agentarea-backend
    build:
      context: agentarea-platform
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    restart: always
    environment:
      # S3 settings
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION}
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      # Presigned URLs are followed by callers OUTSIDE the docker network
      # (frontend on host, e2e test harness). Must point at a host the
      # external caller can reach. Override in real deploys.
      - PUBLIC_S3_ENDPOINT=${PUBLIC_S3_ENDPOINT:-http://localhost:9000}
      # Database settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MCP settings
      - MCP_MANAGER_URL=http://mcp-manager:80
      - MCP_GATEWAY_URL=http://agentarea-traefik:8080
      # Serverless MCPs: a container-backed instance is started on its first
      # call and stopped again once idle (MCP_IDLE_TIMEOUT on mcp-manager),
      # instead of running from creation until someone deletes it. The instance
      # records this at creation, so the flag governs new instances only.
      - MCP_LAZY_PROVISIONING_ENABLED=${MCP_LAZY_PROVISIONING_ENABLED:-true}
      - REDIS_URL=redis://valkey:6379
      - MCP_CLIENT_TIMEOUT=30
      # Hydra OAuth2 AS
      - HYDRA_PUBLIC_URL=http://hydra:4444
      - HYDRA_ADMIN_URL=http://hydra:4445
      - HYDRA_BROWSER_URL=http://localhost:4444
      - MCP_OAUTH_SCOPES=openid offline_access
      # Public API base URL (used in OAuth AS metadata and WWW-Authenticate)
      - API_BASE_URL=http://localhost:8000
      # Kratos JWT authentication
      - KRATOS_JWKS_B64=${KRATOS_JWKS_B64}
      - KRATOS_ISSUER=${KRATOS_ISSUER:-https://agentarea.dev}
      - KRATOS_AUDIENCE=${KRATOS_AUDIENCE:-agentarea-api}
      # Access-control backend
      - ACCESS_CONTROL_BACKEND=${ACCESS_CONTROL_BACKEND:-openfga}
      - ACCESS_CONTROL_KETO_READ_URL=${ACCESS_CONTROL_KETO_READ_URL:-http://keto:4466}
      - ACCESS_CONTROL_KETO_WRITE_URL=${ACCESS_CONTROL_KETO_WRITE_URL:-http://keto:4467}
      - ACCESS_CONTROL_OPENFGA_API_URL=${ACCESS_CONTROL_OPENFGA_API_URL:-http://openfga:8080}
      - ACCESS_CONTROL_OPENFGA_STORE_ID=${ACCESS_CONTROL_OPENFGA_STORE_ID:-}
      - ACCESS_CONTROL_OPENFGA_AUTHORIZATION_MODEL_ID=${ACCESS_CONTROL_OPENFGA_AUTHORIZATION_MODEL_ID:-}
      - ACCESS_CONTROL_OPENFGA_AUTO_BOOTSTRAP=${ACCESS_CONTROL_OPENFGA_AUTO_BOOTSTRAP:-true}
      - ACCESS_CONTROL_OPENFGA_AUTO_APPLY_MODEL=${ACCESS_CONTROL_OPENFGA_AUTO_APPLY_MODEL:-true}
      - ACCESS_CONTROL_OPENFGA_STORE_NAME=${ACCESS_CONTROL_OPENFGA_STORE_NAME:-agentarea}
      - ACCESS_CONTROL_OPENFGA_MODEL_PATH=${ACCESS_CONTROL_OPENFGA_MODEL_PATH:-/app/config/auth/openfga/authorization-model.json}
      # Server settings
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-true}
      - WORKERS=${WORKERS:-1}
      - WORKFLOW__TEMPORAL_SERVER_URL=${WORKFLOW__TEMPORAL_SERVER_URL:-temporal:7233}
      - WORKFLOW__TEMPORAL_NAMESPACE=default
      - WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
      - SECRET_MANAGER_ENCRYPTION_KEY=${SECRET_MANAGER_ENCRYPTION_KEY}
    volumes:
      - ./agentarea-platform/apps/api/agentarea_api:/app/apps/api/agentarea_api
      - ./agentarea-platform/libs:/app/libs
      - ./agentarea-platform/apps/api/alembic:/app/apps/api/alembic
      - ./config/auth/openfga:/app/config/auth/openfga:ro
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      valkey:
        condition: service_started
      app_migrations:
        condition: service_completed_successfully
      # mcp-manager:
      #   condition: service_healthy
    networks:
      - default
      - mcp-network
      - temporal-network
      - auth-network
    command: ["agentarea-api", "serve", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "info"]
    working_dir: /app/apps/api

  app_migrations:
    image: agentarea/agentarea-api:${VERSION:-latest}
    build:
      context: agentarea-platform
      dockerfile: apps/api/Dockerfile
    environment:
      ## Have to add it for now
      # S3 settings
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION}
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      # Only database settings
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./agentarea-platform/apps/api/alembic:/app/apps/api/alembic
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    command: ["agentarea-api", "migrate"]
    working_dir: /app/apps/api

  # Create the main app database and auxiliary databases — idempotent.
  postgres_init:
    image: postgres:18
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for db in "${POSTGRES_DB:-agentarea}" "${TEMPORAL_DB:-temporal}" "${KRATOS_DB:-kratos}" "${HYDRA_DB:-hydra}" "${INFISICAL_DB:-infisical}" "${KETO_DB:-keto}" "${OPENFGA_DB:-openfga}"; do
          exists=$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" != "1" ]; then
            echo "Creating database $$db"
            psql -c "CREATE DATABASE \"$$db\""
          else
            echo "Database $$db already exists"
          fi
        done
    depends_on:
      db:
        condition: service_healthy

  # Frontend service - Next.js dev mode
  # Pre-requisite: run `pnpm install` in agentarea-webapp/ before starting
  # frontend:
  #   image: agentarea/agentarea-frontend:${VERSION:-latest}
  #   # image: node:22
  #   # build:
  #   #   context: agentarea-webapp
  #   #   dockerfile: Dockerfile
  #   container_name: agentarea-frontend
  #   ports:
  #     - "3000:3000"
  #   restart: unless-stopped
  #   working_dir: /app
  #   environment:
  #     # Node environment
  #     - CI=true
  #     - NODE_ENV=production
  #     - NEXT_TELEMETRY_DISABLED=1
  #     # API Configuration
  #     - API_URL=${API_URL:-http://app:8000}
  #     - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}

  #     # Ory Kratos Configuration
  #     - ORY_ADMIN_URL=${ORY_ADMIN_URL:-http://kratos:4434}
  #     - ORY_SDK_URL=${ORY_SDK_URL:-http://kratos:4433}
  #     - NEXT_PUBLIC_ORY_SDK_URL=${NEXT_PUBLIC_ORY_SDK_URL:-http://localhost:4433}
  #   volumes:
  #     # Mount entire webapp directory (includes pre-installed node_modules from host)
  #     - ./agentarea-webapp:/app
  #   networks:
  #     - default
  #     - auth-network
  #   command: sh -c "npx pnpm dev"

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    command: /data --console-enable
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:18
    # One Postgres is shared by the app, Temporal, and the Ory stack — each keeps
    # a warm idle pool, so the default max_connections=100 is exhausted. Raise it.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres  # Maintenance DB; postgres_init creates the main app DB plus aux DBs
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
      - temporal-network
      - auth-network

  valkey:
    image: valkey/valkey:8
    container_name: agentarea-valkey
    env_file: .env
    restart: always
    volumes:
      - valkey_data:/data
    networks:
      - default
      - mcp-network
    command: ["valkey-server", "--save", "", "--appendonly", "no"] # Disable persistence for dev

  traefik:
    image: traefik:v3.3
    container_name: agentarea-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=agentarea_mcp-network
      - --entrypoints.mcp.address=:8080
      - --entrypoints.traefik.address=:8888
      - --api.insecure=true
    ports:
      - "8686:8080"  # MCP traffic
      - "8687:8888"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - mcp-network

  mcp-manager:
    # Dev image is tagged :dev so `make up-dev` builds never clobber the
    # published :latest prod image (same single Dockerfile, dev target).
    image: agentarea/agentarea-mcp-manager:dev
    build:
      context: agentarea-mcp-manager
      dockerfile: Dockerfile
      target: dev
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: mcp-manager
    restart: unless-stopped
    ports:
      - "7999:80" # API server
    tmpfs:
      - /tmp
      - /run
    volumes:
      - ./agentarea-mcp-manager:/app:rw # Mount source code for live reload
      - /var/run/docker.sock:/var/run/docker.sock # Docker socket for container management
    networks:
      - mcp-network
      - default
    # Explicit command to handle both air and fallback scenarios
    command: ["sh", "-c", "if [ -f /app/.air.toml ] && command -v air >/dev/null 2>&1; then exec air -c /app/.air.toml; else exec /app/start-dev.sh; fi"]
    environment:
      LOG_LEVEL: INFO
      SERVER_PORT: 80
      MCP_NETWORK: agentarea_mcp-network
      SKIP_INSTANCE_SYNC: "true"
      REDIS_URL: redis://valkey:6379
      CORE_API_URL: http://agentarea-backend:8000
      CONTAINER_RUNTIME: docker
      # Cold start of git/uvx-based MCP servers (clone + install ~90s) needs more
      # than the 120s default before a container is declared unhealthy.
      STARTUP_TIMEOUT: 300s
      # Stop lazily-provisioned MCP instances that have gone unused this long;
      # the next call brings them back. Only instances created as lazy are
      # eligible — eager ones were asked to stay up. 0 disables reclaiming.
      MCP_IDLE_TIMEOUT: ${MCP_IDLE_TIMEOUT:-10m}
      MCP_IDLE_SWEEP_INTERVAL: ${MCP_IDLE_SWEEP_INTERVAL:-60s}
      # Run the sandbox execution consumer in-process (no standalone runner in
      # compose) and route code-execution to the sandbox-executor container.
      SANDBOX_EMBEDDED_RUNNER: "true"
      SANDBOX_EXECUTOR_URL: http://sandbox-executor:8080
      SANDBOX_ACTIVATION_AUTH_SECRET: ${SANDBOX_ACTIVATION_AUTH_SECRET:-agentarea-dev-sandbox-activation-secret-change-me}
      SANDBOX_CLEANUP_AUTH_SECRET: ${SANDBOX_CLEANUP_AUTH_SECRET:-agentarea-dev-sandbox-cleanup-secret-change-me}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_REGION: ${RUSTFS_REGION:-us-east-1}
      ARTIFACTS_BUCKET_NAME: ${ARTIFACTS_BUCKET:-artifacts}
      AWS_ENDPOINT_URL: http://rustfs:9000
      # Secret manager configuration
      SECRET_MANAGER_TYPE: ${SECRET_MANAGER_TYPE:-database}
      # Database secret manager settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_MANAGER_ENCRYPTION_KEY: ${SECRET_MANAGER_ENCRYPTION_KEY}

  # Sandbox executor — isolated script runner (simulates warm pool pod in dev).
  # Same unified runtime image as the prod warm-pool runner (Dockerfile.runner).
  sandbox-executor:
    image: agentarea/sandbox-executor:${VERSION:-latest}
    build:
      context: agentarea-mcp-manager
      dockerfile: Dockerfile.runner
      args:
        # Stamped into /etc/agentarea/runtime.json and served at
        # /runtime/manifest. Dockerfile.runner declares no default, so this must
        # be stated here — "dev" is the honest answer for a local build, and it
        # is now a claim this file makes rather than one the image invents.
        APP_VERSION: ${VERSION:-dev}
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: sandbox-executor
    restart: unless-stopped
    tmpfs:
      - /tmp:mode=1777
      - /workspace:mode=1777
    networks:
      - mcp-network
      - default
    environment:
      ACTIVATION_PORT: "8080"
      HOME: /home/sandbox
      SANDBOX_ACTIVATION_AUTH_SECRET: ${SANDBOX_ACTIVATION_AUTH_SECRET:-agentarea-dev-sandbox-activation-secret-change-me}

  # Temporal Infrastructure Services
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: agentarea-temporal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=db
      - DBNAME=${TEMPORAL_DB:-temporal}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - BIND_ON_IP=0.0.0.0
    networks:
      - temporal-network
      - default
    ports:
      - 7233:7233
    labels:
      kompose.volume.type: configMap
    volumes:
      - ./agentarea-platform/temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  temporal-admin-tools:
    image: temporalio/admin-tools:1.28
    container_name: agentarea-temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    networks:
      - temporal-network
    stdin_open: true
    tty: true

  temporal-ui:
    container_name: agentarea-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.39.0
    networks:
      - temporal-network
    ports:
      - 8082:8080

  # AgentArea Worker Service
  agentarea-worker:
    image: agentarea/agentarea-worker:${VERSION:-latest}
    build:
      context: agentarea-platform
      dockerfile: apps/worker/Dockerfile
    container_name: agentarea-worker
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
      temporal:
        condition: service_healthy
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LLM_DOCKER_HOST=host.docker.internal

      # S3 / RustFS (file tool artifacts land here, keyed by workspace+task)
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      - PUBLIC_S3_ENDPOINT=${PUBLIC_S3_ENDPOINT:-http://localhost:9000}
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}

      # Redis
      - REDIS_URL=redis://valkey:6379

      # Temporal
      - WORKFLOW__TEMPORAL_SERVER_URL=${WORKFLOW__TEMPORAL_SERVER_URL:-temporal:7233}
      - WORKFLOW__TEMPORAL_NAMESPACE=default
      - WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
      - WORKFLOW__TEMPORAL_MAX_CONCURRENT_ACTIVITIES=10
      - WORKFLOW__TEMPORAL_MAX_CONCURRENT_WORKFLOWS=5

      # MCP settings
      - MCP_MANAGER_URL=http://mcp-manager:80
      - MCP_GATEWAY_URL=http://agentarea-traefik:8080
      # Serverless MCPs: a container-backed instance is started on its first
      # call and stopped again once idle (MCP_IDLE_TIMEOUT on mcp-manager),
      # instead of running from creation until someone deletes it. The instance
      # records this at creation, so the flag governs new instances only.
      - MCP_LAZY_PROVISIONING_ENABLED=${MCP_LAZY_PROVISIONING_ENABLED:-true}
      - SANDBOX_CLEANUP_AUTH_SECRET=${SANDBOX_CLEANUP_AUTH_SECRET:-agentarea-dev-sandbox-cleanup-secret-change-me}

      # Task execution
      - TASK__ENABLE_DYNAMIC_ACTIVITY_DISCOVERY=true
      - SECRET_MANAGER_ENCRYPTION_KEY=${SECRET_MANAGER_ENCRYPTION_KEY}
      # Access-control backend
      - ACCESS_CONTROL_BACKEND=${ACCESS_CONTROL_BACKEND:-openfga}
      - ACCESS_CONTROL_KETO_READ_URL=${ACCESS_CONTROL_KETO_READ_URL:-http://keto:4466}
      - ACCESS_CONTROL_KETO_WRITE_URL=${ACCESS_CONTROL_KETO_WRITE_URL:-http://keto:4467}
      - ACCESS_CONTROL_OPENFGA_API_URL=${ACCESS_CONTROL_OPENFGA_API_URL:-http://openfga:8080}
      - ACCESS_CONTROL_OPENFGA_STORE_ID=${ACCESS_CONTROL_OPENFGA_STORE_ID:-}
      - ACCESS_CONTROL_OPENFGA_AUTHORIZATION_MODEL_ID=${ACCESS_CONTROL_OPENFGA_AUTHORIZATION_MODEL_ID:-}
      - ACCESS_CONTROL_OPENFGA_AUTO_BOOTSTRAP=${ACCESS_CONTROL_OPENFGA_AUTO_BOOTSTRAP:-true}
      - ACCESS_CONTROL_OPENFGA_AUTO_APPLY_MODEL=${ACCESS_CONTROL_OPENFGA_AUTO_APPLY_MODEL:-true}
      - ACCESS_CONTROL_OPENFGA_STORE_NAME=${ACCESS_CONTROL_OPENFGA_STORE_NAME:-agentarea}
      - ACCESS_CONTROL_OPENFGA_MODEL_PATH=${ACCESS_CONTROL_OPENFGA_MODEL_PATH:-/app/config/auth/openfga/authorization-model.json}

      # Development
      # - DEBUG=true
      - ENVIRONMENT=development
    networks:
      - temporal-network
      - default
      - mcp-network
    volumes:
      - ./agentarea-platform/apps/worker/agentarea_worker:/app/apps/worker/agentarea_worker
      - ./agentarea-platform/libs:/app/libs
      - ./config/auth/openfga:/app/config/auth/openfga:ro
    restart: unless-stopped
    command: ["agentarea-worker", "dev"]

  # Rclone bucket initialization
  rclone-init:
    image: rclone/rclone:latest
    container_name: agentarea-rclone-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - RCLONE_CONFIG_RUSTFS_TYPE=s3
      - RCLONE_CONFIG_RUSTFS_PROVIDER=Other
      - RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - RCLONE_CONFIG_RUSTFS_ENDPOINT=http://rustfs:9000
      - RCLONE_CONFIG_RUSTFS_ACL=private
    entrypoint: ["/bin/sh", "-c"]
    command: ["rclone mkdir rustfs:${DOCUMENTS_BUCKET:-documents} && rclone mkdir rustfs:${ARTIFACTS_BUCKET:-artifacts} && echo 'Buckets created successfully'"]
    networks:
      - default

  agentarea-events:
    build:
      context: agentarea-event-service
      dockerfile: Dockerfile.dev
    container_name: agentarea-events
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://valkey:6379
      - POLL_INTERVAL=30s
      - MAX_POLLERS=10
    volumes:
      - ./agentarea-event-service:/app
    networks:
      - default
    restart: unless-stopped

  # Ory Kratos Migration
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate sql -e --yes
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # Ory Kratos Identity Server
  kratos:
    image: oryd/kratos:v1.3.1
    ports:
      - "4433:4433" # public API
      - "4434:4434" # admin API
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
      LOG_LEVEL: debug
      # SMTP Configuration - Override courier settings via environment variables.
      # disable_starttls defaults to true because the bundled dev catcher (mailpit)
      # speaks plain SMTP on :1025 with no STARTTLS; set SMTP_DISABLE_STARTTLS=false
      # (and SMTP_PROTOCOL=smtps) when pointing at a real TLS-capable provider.
      COURIER_SMTP_CONNECTION_URI: "${SMTP_PROTOCOL}://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}/?skip_ssl_verify=${SMTP_SKIP_SSL_VERIFY}&disable_starttls=${SMTP_DISABLE_STARTTLS:-true}"
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_FROM_EMAIL}
      COURIER_SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID: ${OIDC_GITHUB_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET: ${OIDC_GITHUB_CLIENT_SECRET:-}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ory Keto ReBAC migration
  # Opt-in only (OpenFGA is the default backend). Enable with: --profile keto
  keto-migrate:
    image: oryd/keto:v0.12.0
    profiles: ["keto"]
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KETO_DB:-keto}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up -y -c /etc/config/keto/keto.yml
    volumes:
      - ./config/auth/keto:/etc/config/keto
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # Ory Keto ReBAC permission server
  # Opt-in only (OpenFGA is the default backend). Enable with: --profile keto
  keto:
    image: oryd/keto:v0.12.0
    profiles: ["keto"]
    ports:
      - "4466:4466" # read API
      - "4467:4467" # write API
      - "4468:4468" # metrics
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KETO_DB:-keto}?sslmode=disable&max_conns=20&max_idle_conns=4
      LOG_LEVEL: debug
    command: serve -c /etc/config/keto/keto.yml
    volumes:
      - ./config/auth/keto:/etc/config/keto
    networks:
      - auth-network
      - default
    depends_on:
      db:
        condition: service_healthy
      keto-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # OpenFGA migration (preferred ReBAC backend for agent/task authorization)
  openfga-migrate:
    image: ${OPENFGA_IMAGE:-openfga/openfga:latest}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${OPENFGA_DB:-openfga}?sslmode=disable
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # OpenFGA ReBAC permission server
  openfga:
    image: ${OPENFGA_IMAGE:-openfga/openfga:latest}
    command: run
    ports:
      - "8088:8080" # HTTP API
      - "8089:8081" # gRPC API
      - "3001:3000" # Playground
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${OPENFGA_DB:-openfga}?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    networks:
      - auth-network
      - default
    depends_on:
      db:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ory Hydra OAuth2/OIDC Server
  hydra:
    image: oryd/hydra:v2.2.0
    ports:
      - "4444:4444" # public API
      - "4445:4445" # admin API
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${HYDRA_DB:-hydra}?sslmode=disable&max_conns=20&max_idle_conns=4
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_CONSENT: http://localhost:3000/auth/consent
      URLS_LOGIN: http://localhost:3000/api/hydra/login
      URLS_LOGOUT: http://localhost:3000/auth/logout
      URLS_ERROR: http://localhost:3000/auth/error
      SECRETS_SYSTEM: this-is-the-primary-secret-replace-me-in-production
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public,pairwise
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: some-random-salt
      LOG_LEVEL: debug
      LOG_LEAK_SENSITIVE_VALUES: true
      # Enable Dynamic Client Registration
      OAUTH2_ALLOWED_TOP_LEVEL_CLAIMS: workspace_id
    command: serve all -c /etc/config/hydra/hydra.yml --dev
    volumes:
      - ./config/auth/hydra:/etc/config/hydra
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Mailpit — dev email catcher (SMTP sink + web UI + REST API).
  # Captured mail is persisted to
  # ./data/mailpit so it survives container recreation. Nothing depends_on this
  # service: Kratos' courier retries delivery, so a slow mailpit start is harmless.
  mailpit:
    image: axllent/mailpit:v1.30.2
    ports:
      - "8025:8025" # web UI + REST API (GET /api/v1/messages)
      # SMTP (1025) stays internal on auth-network; Kratos reaches it as mailpit:1025
    environment:
      MP_DATABASE: /data/mailpit.db
      # The dev courier link is plain SMTP; accept whatever creds it sends.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - ./data/mailpit:/data
    networks:
      - auth-network
    restart: unless-stopped

  # Hydra DB Migration
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${HYDRA_DB:-hydra}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate sql -e --yes
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # # Register OAuth2 client for frontend
  # hydra-client-setup:
