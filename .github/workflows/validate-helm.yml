name: Validate Helm Chart

# Single home for all static Helm chart validation:
#   - env config templates are regenerated from config.yaml and stay in sync
#   - the helm-docs README is up to date
#   - the chart lints and renders
#   - the Artifact Hub image annotations match what the charts deploy
#
# Runs on PRs/pushes that touch the chart or its generator, and is reusable
# (workflow_call) so the release pipeline gates on the exact same checks instead
# of duplicating them.

on:
  push:
    branches: ["main"]
    paths:
      - "charts/agentarea/**"
      - "charts/agentarea-dataplane/**"
      - "scripts/generate_env_tpls.py"
      - "scripts/test-dataplane-helm.sh"
      - "scripts/test-mcp-egress-label-helm.sh"
      - "scripts/test-platform-egress-helm.sh"
      - "scripts/test-artifacthub-images-helm.sh"
      - "scripts/test-external-storage-helm.sh"
      - ".github/workflows/validate-helm.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "charts/agentarea/**"
      - "charts/agentarea-dataplane/**"
      - "scripts/generate_env_tpls.py"
      - "scripts/test-dataplane-helm.sh"
      - "scripts/test-mcp-egress-label-helm.sh"
      - "scripts/test-platform-egress-helm.sh"
      - "scripts/test-artifacthub-images-helm.sh"
      - "scripts/test-external-storage-helm.sh"
      - ".github/workflows/validate-helm.yml"
  workflow_call: {}

permissions:
  contents: read

jobs:
  env-templates:
    name: Env templates in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate env templates
        run: python scripts/generate_env_tpls.py

      - name: Verify templates up to date
        run: |
          git config --global --add safe.directory "$PWD"
          if ! git diff --quiet -- charts/agentarea/templates/configs; then
            echo "Env templates are out of date. Run: python scripts/generate_env_tpls.py" >&2
            echo "Changed files (configs only):" >&2
            git status --porcelain charts/agentarea/templates/configs >&2
            exit 1
          fi

  helm-docs:
    name: README in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install helm-docs
        run: |
          HELM_DOCS_VERSION=1.14.2
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin helm-docs

      - name: Run helm-docs
        run: |
          helm-docs --chart-search-root charts/agentarea --sort-values-order file
          helm-docs --chart-search-root charts/agentarea-dataplane --sort-values-order file

      - name: Fail if README changed
        run: |
          if ! git diff --quiet charts/agentarea/README.md charts/agentarea-dataplane/README.md; then
            echo "README.md is outdated; run helm-docs and commit" >&2
            git --no-pager diff charts/agentarea/README.md charts/agentarea-dataplane/README.md >&2
            exit 1
          fi

  helm-lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The duplicate-env guard parses rendered manifests with PyYAML; the other
      # scripts in this job are stdlib-only, so this job has no Python setup yet.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1

      - name: Add chart repositories
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build charts/agentarea

      - name: Lint chart
        run: helm lint charts/agentarea

      - name: Render chart (sanity)
        run: helm template release-name charts/agentarea >/dev/null

      - name: Verify sandbox cleanup secret isolation
        run: scripts/test-sandbox-cleanup-helm.sh

      - name: Verify execution cluster kubeconfig wiring
        run: scripts/test-execution-cluster-helm.sh

      - name: Verify no container declares a duplicate env name
        run: scripts/test-no-duplicate-env-helm.sh

      - name: Verify object storage wiring, bundled and external
        run: scripts/test-external-storage-helm.sh

      - name: Lint data-plane chart
        run: helm lint charts/agentarea-dataplane --set dataPlane.id=ci --set dataPlane.auth.existingSecret=ci  # pragma: allowlist secret

      - name: Verify data-plane chart guards
        run: scripts/test-dataplane-helm.sh

      - name: Verify labelled MCP pods get exactly one egress policy
        run: scripts/test-mcp-egress-label-helm.sh

      - name: Verify the platform egress policy selects only backend, worker and event-service
        run: scripts/test-platform-egress-helm.sh

      - name: Verify artifacthub.io/images lists exactly the images each chart deploys
        run: scripts/test-artifacthub-images-helm.sh
