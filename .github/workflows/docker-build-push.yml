name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (e.g., api, worker, frontend)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      image-name:
        description: 'Docker image name (defaults to agentarea-{component})'
        required: false
        type: string
      use-private-registry:
        description: 'Whether to push to private registry'
        required: false
        type: boolean
        default: false
      push:
        description: 'Whether to push the image (false for build-only validation)'
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      DOCKER_REGISTRY_MIRROR:
        required: false
      DOCKER_REGISTRY_MIRROR_PATH:
        required: false
      DOCKER_REGISTRY_MIRROR_USERNAME:
        required: false
      DOCKER_REGISTRY_MIRROR_PASSWORD:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Private Registry
        if: ${{ inputs.use-private-registry && inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          username: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

      - name: Extract Docker metadata (Public Registry)
        if: ${{ ! inputs.use-private-registry }}
        id: meta-public
        uses: docker/metadata-action@v5
        with:
          images: |
            agentarea/${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=false

      - name: Extract Docker metadata (Public + Private Registry)
        if: ${{ inputs.use-private-registry }}
        id: meta-both
        uses: docker/metadata-action@v5
        with:
          images: |
            agentarea/${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}
            ${{ secrets.DOCKER_REGISTRY_MIRROR }}/${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}/${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=false

      - name: Set metadata output
        id: meta
        run: |
          if [ "${{ inputs.use-private-registry }}" == "true" ]; then
            echo "tags=${{ steps.meta-both.outputs.tags }}" >> $GITHUB_OUTPUT
            echo "labels=${{ steps.meta-both.outputs.labels }}" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ steps.meta-public.outputs.tags }}" >> $GITHUB_OUTPUT
            echo "labels=${{ steps.meta-public.outputs.labels }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: false

      - name: Image digest
        run: |
          if [ "${{ inputs.push }}" == "true" ]; then
            echo "Built and pushed ${{ inputs.component }} image with digest ${{ steps.meta.outputs.digest }}"
          else
            echo "Built ${{ inputs.component }} image (build-only, no push)"
          fi
