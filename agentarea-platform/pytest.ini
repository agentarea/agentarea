[pytest]
addopts = -v -s --tb=short --import-mode=importlib
# Collect by default. This used to be `testpaths = tests` with `libs` in
# norecursedirs, so a bare pytest run could not see libs/*/tests at all — about
# 168 test files across 14 libraries were unreachable, and the Makefile gate
# reinforced that with a hand-listed set of paths. Adding a library now gets it
# tested; excluding one has to be written down.
testpaths = tests libs apps
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Keep pytest's own defaults in mind: setting this key REPLACES them, which is
# why .hypothesis warned about being skipped before.
norecursedirs = .git .venv .hypothesis node_modules build dist *.egg-info
env =
    WORKFLOW__TEMPORAL_SERVER_URL=localhost:7233
    WORKFLOW__TEMPORAL_NAMESPACE=default
    WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
    KRATOS_ISSUER=http://localhost:4433
    KRATOS_AUDIENCE=agentarea
    KRATOS_JWKS_B64=eyJrZXlzIjogW119
    # A real Fernet key, not a placeholder: the database secret manager validates
    # it at construction, so without one every test that builds one fails before
    # reaching what it meant to check.
    SECRET_MANAGER_ENCRYPTION_KEY=cnRLOFFmYVhoWnR2LUpaMUdiMTNCa2dVcEd2eVBIUUE=
markers =
    integration: marks tests as integration tests (requiring real services)
    slow: marks tests as slow running
    requires_llm: needs a real LLM endpoint (Ollama/OpenRouter)
    requires_docker: needs Docker / live MCP containers
    requires_server: needs a running API server
    requires_s3: needs object storage (rustfs/S3)
    perf: performance/concurrency stress test (timing-sensitive, flaky in CI)
