[project]
name = "agentarea-api-fuzz"
version = "0.2.0"
description = "Schemathesis fuzz of the live AgentArea API"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "hypothesis==6.152.1",
    "pytest==9.0.3",
    "schemathesis==4.15.2",
]

[tool.uv]
package = false
required-version = ">=0.13.3"
# The rest of the set the backend's lock resolved, so the fuzz runs on what it ran on.
constraint-dependencies = [
    "anyio==4.15.1",
    "attrs==25.4.0",
    "certifi==2026.10.19",
    "charset-normalizer==3.4.5",
    "click==8.3.3",
    "colorama==0.4.6",
    "graphql-core==3.2.13",
    "h11==0.16.0",
    "harfile==0.4.0",
    "httpcore==1.0.9",
    "hypothesis-graphql==0.12.0",
    "hypothesis-jsonschema==0.23.1",
    "idna==3.20",
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-rs==0.46.2",
    "jsonschema-specifications==2025.9.1",
    "junit-xml==1.9",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "packaging==26.0",
    "pluggy==1.6.0",
    "pygments==2.20.0",
    "pyrate-limiter==4.1.0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "requests==2.33.1",
    "rich==14.3.3",
    "rpds-py==0.30.0",
    "six==1.17.0",
    "sortedcontainers==2.4.0",
    "starlette==1.3.1",
    "starlette-testclient==0.4.1",
    "tenacity==9.1.4",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
    "werkzeug==3.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
addopts = "-p no:cacheprovider --tb=short -rs"
markers = [
    "integration: needs the live stack (API, Kratos)",
]
