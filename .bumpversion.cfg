[[bumpversion:file:agentarea-webapp/package.json]]
search = "version": "{current_version}"
replace = "version": "{new_version}"

# VERSION file is the single source of truth for application version
[[bumpversion:file:VERSION]]
search = {current_version}
replace = {new_version}

# NOTE: Chart version is managed independently in Chart.yaml
# Only appVersion (not version) is synced from VERSION via update-appversion.py
