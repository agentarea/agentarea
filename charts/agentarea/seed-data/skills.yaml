# System skills configuration
# These skills are created during bootstrap and available to all workspaces

skills:
  - name: "Git Workflow"
    description: "Skill for Git operations and workflow management"
    source_type: "content"
    content: |
      ---
      name: Git Workflow
      description: Skill for Git operations and workflow management
      tools:
        - name: git_commit
          description: Create a git commit with a message
        - name: git_branch
          description: Manage git branches
        - name: git_merge
          description: Merge branches
      ---

      # Git Workflow Skill

      This skill helps with common Git operations.

      ## Best Practices

      - Commit early and often
      - Write meaningful commit messages
      - Use feature branches
      - Keep branches short-lived

  - name: "Docker Basics"
    description: "Skill for Docker container management"
    source_type: "content"
    content: |
      ---
      name: Docker Basics
      description: Skill for Docker container management
      tools:
        - name: docker_run
          description: Run a Docker container
        - name: docker_build
          description: Build a Docker image
        - name: docker_compose
          description: Manage Docker Compose services
      ---

      # Docker Basics Skill

      This skill helps with Docker container operations.

      ## Common Commands

      - `docker ps` - List running containers
      - `docker images` - List images
      - `docker logs` - View container logs

  - name: "Python Development"
    description: "Skill for Python development and best practices"
    source_type: "content"
    content: |
      ---
      name: Python Development
      description: Skill for Python development and best practices
      tools:
        - name: python_run
          description: Run Python scripts
        - name: python_test
          description: Run Python tests
        - name: python_lint
          description: Lint Python code
      ---

      # Python Development Skill

      This skill helps with Python development.

      ## Best Practices

      - Use virtual environments
      - Follow PEP 8 style guide
      - Write docstrings
      - Use type hints

  - name: "Shell Scripting"
    description: "Skill for bash/shell scripting"
    source_type: "content"
    content: |
      ---
      name: Shell Scripting
      description: Skill for bash/shell scripting
      tools:
        - name: shell_exec
          description: Execute shell commands
        - name: shell_script
          description: Run shell scripts
      ---

      # Shell Scripting Skill

      This skill helps with shell scripting and command execution.

      ## Best Practices

      - Quote variables
      - Check exit codes
      - Use set -e for error handling
      - Document complex commands
