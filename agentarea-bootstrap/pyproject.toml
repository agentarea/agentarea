[project]
name = "agentarea-bootstrap"
version = "0.0.8"
description = "Bootstrap module for AgentArea - sets up initial configuration, LLM providers, MinIO, and Infisical"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "sqlalchemy>=2.0.41",
    "psycopg2-binary>=2.9.9",
    "pyyaml>=6.0.1",
    "boto3>=1.35.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "agentarea-agents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]
