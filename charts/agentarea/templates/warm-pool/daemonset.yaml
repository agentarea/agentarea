{{- $provider := .Values.sandboxRuntime.provider | default "kubernetes" -}}
{{- if and .Values.mcpManager.enabled .Values.mcpManager.warmPool.enabled (or (eq $provider "kubernetes") (eq $provider "agentarea")) }}
{{- if has "warm_pool" .Values.mcpManager.features.enabled }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agentarea.fullname" . }}-warm-pool
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: warm-pool
spec:
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: warm-pool
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: warm-pool
        mcp.agentarea.io/status: "waiting"
    spec:
      {{- /*
        Sandbox pods run LLM-written shell commands — the least trusted workload
        on the platform, and a strictly different trust tier from an MCP server
        image the workspace owner picked from a catalog. They therefore have
        their own runtime class, and an empty one has to be asked for out loud.

        Previously this hardcoded `kata-qemu` behind the kata_runtime flag, which
        pinned the chart to one vendor's runtime and offered nothing to clusters
        without KVM. The runtime class is now declared, not chosen for you.
      */ -}}
      {{- $runtimeClass := .Values.sandboxRuntime.runtimeClass }}
      {{- if and (not $runtimeClass) (not .Values.sandboxRuntime.allowWeakIsolationForDevelopment) }}
        {{- fail "sandboxRuntime.runtimeClass is required: sandbox pods execute agent-authored code. Set \"gvisor\" or \"kata-qemu\", or set sandboxRuntime.allowWeakIsolationForDevelopment=true to accept the node's default runtime for local development." }}
      {{- end }}
      {{- if and (has "kata_runtime" .Values.mcpManager.features.enabled) (not $runtimeClass) }}
        {{- fail "mcpManager.features.enabled includes kata_runtime but sandboxRuntime.runtimeClass is empty. The runtime class is no longer hardcoded: set sandboxRuntime.runtimeClass explicitly (\"kata-qemu\" to keep the previous behaviour, or \"gvisor\")." }}
      {{- end }}
      {{- if $runtimeClass }}
      runtimeClassName: {{ $runtimeClass | quote }}
      {{- end }}
      serviceAccountName: {{ include "agentarea.mcpRuntimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: warm-pod
          image: "{{ required "mcpManager.warmPool.image.repository is required" .Values.mcpManager.warmPool.image.repository }}:{{ required "mcpManager.warmPool.image.tag is required" .Values.mcpManager.warmPool.image.tag }}"
          imagePullPolicy: {{ .Values.mcpManager.warmPool.image.pullPolicy }}
          ports:
            - name: activation
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 3000
              protocol: TCP
          env:
            - name: ACTIVATION_PORT
              value: "8080"
            - name: MCP_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "{{ .Values.mcpManager.warmPool.logLevel }}"
            - name: MAX_EXECUTION_TIMEOUT_SECONDS
              value: "{{ .Values.sandboxRuntime.maxExecutionTimeoutSeconds }}"
            - name: IDLE_TIMEOUT_SECONDS
              value: "{{ .Values.mcpManager.warmPool.idleTimeoutSeconds }}"
            - name: SANDBOX_WORKSPACE_MAX_FILES
              value: "{{ .Values.sandboxRuntime.workspace.maxFiles }}"
            - name: SANDBOX_WORKSPACE_MAX_FILE_BYTES
              value: "{{ .Values.sandboxRuntime.workspace.maxFileBytes }}"
            - name: SANDBOX_WORKSPACE_MAX_BYTES
              value: "{{ .Values.sandboxRuntime.workspace.maxBytes }}"
            - name: SANDBOX_ACTIVATION_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.application }}
                  key: sandbox-activation-secret
          {{- $resources := deepCopy .Values.mcpManager.warmPool.resources }}
          {{- $limits := deepCopy (get $resources "limits" | default dict) }}
          {{- $_ := set $limits "ephemeral-storage" .Values.sandboxRuntime.workspace.maxBytes }}
          {{- $_ := set $resources "limits" $limits }}
          resources:
            {{- toYaml $resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN      # tar: restore file ownership from image layers
                - MKNOD      # tar: recreate device nodes from image layers
                - SYS_CHROOT # chroot into the extracted container filesystem
          volumeMounts:
            - name: image-cache
              mountPath: /var/cache/mcp-images
            - name: workspace
              mountPath: /workspace
          livenessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: image-cache
          hostPath:
            path: /var/lib/mcp-image-cache
            type: DirectoryOrCreate
        - name: workspace
          emptyDir:
            sizeLimit: {{ .Values.sandboxRuntime.workspace.maxBytes | quote }}
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - warm-pool
                topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}
