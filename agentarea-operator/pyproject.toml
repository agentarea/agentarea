[project]
name = "agentarea-operator"
version = "0.1.0"
description = "K8s operator for managing AgentArea LLM provider configs via CRDs"
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37",
    "kubernetes>=29.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
