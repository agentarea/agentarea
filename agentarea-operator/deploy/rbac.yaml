apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentarea-operator
  namespace: agentarea-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentarea-operator
rules:
  # CRD management
  - apiGroups: ["agentarea.io"]
    resources:
      - "llmproviderconfigs"
      - "llmproviderconfigs/status"
      - "registrysyncs"
      - "registrysyncs/status"
    verbs: ["get", "list", "watch", "patch", "update"]
  # Kopf needs to watch CRD definitions
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Kopf needs events and lease for leader election
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentarea-operator
subjects:
  - kind: ServiceAccount
    name: agentarea-operator
    namespace: agentarea-staging
roleRef:
  kind: ClusterRole
  name: agentarea-operator
  apiGroup: rbac.authorization.k8s.io
---
# Secrets are read one at a time, by name, via apiKeySecretRef — never listed
# or watched. This ClusterRole exists only to be reused by namespaced
# RoleBindings below; it must never be bound via a ClusterRoleBinding, which
# would hand the operator every Secret in the cluster regardless of whether
# the CR author who names it can read it themselves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentarea-operator-secrets-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
# apiKeySecretRef resolves only in the LLMProviderConfig's own namespace
# (handler.py), so this grant is scoped the same way: one RoleBinding per
# namespace the operator actually watches. Add another RoleBinding to
# agentarea-operator-secrets-reader, in that namespace, for each additional
# namespace WATCH_NAMESPACE covers.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentarea-operator-secrets-reader
  namespace: agentarea-staging
subjects:
  - kind: ServiceAccount
    name: agentarea-operator
    namespace: agentarea-staging
roleRef:
  kind: ClusterRole
  name: agentarea-operator-secrets-reader
  apiGroup: rbac.authorization.k8s.io
