name: Staging Synthetic Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: staging-synthetics
  cancel-in-progress: false

jobs:
  staging-synthetics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run staged synthetic checks against staging API
        shell: bash
        env:
          # Required secret:
          # - STAGING_API_BASE_URL: Base URL for staging API (e.g. https://staging-api.example.com)
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          # Optional secrets:
          # - STAGING_SYNTHETIC_BEARER_TOKEN: Bearer token for authenticated checks
          # - STAGING_WORKSPACE_ID: Workspace header for scoped reads (if required by your auth model)
          STAGING_SYNTHETIC_BEARER_TOKEN: ${{ secrets.STAGING_SYNTHETIC_BEARER_TOKEN }}
          STAGING_WORKSPACE_ID: ${{ secrets.STAGING_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_API_BASE_URL:-}" ]]; then
            echo "::error::Missing required secret STAGING_API_BASE_URL."
            exit 1
          fi

          base_url="${STAGING_API_BASE_URL%/}"
          health_url="${base_url}/health"

          echo "Checking health endpoint: ${health_url}"
          health_body="$(curl -fsSL --retry 2 --retry-delay 2 "${health_url}")" || {
            echo "::error::Health endpoint request failed."
            exit 1
          }

          echo "${health_body}" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          status = payload.get("status")
          if status != "healthy":
              raise SystemExit(f"Health check failed: expected status=healthy, got {status!r}")
          '
          echo "Health endpoint passed."

          if [[ -z "${STAGING_SYNTHETIC_BEARER_TOKEN:-}" ]]; then
            echo "::notice::STAGING_SYNTHETIC_BEARER_TOKEN not configured; skipping authenticated critical read check."
            exit 0
          fi

          auth_url="${base_url}/v1/projects?limit=1&offset=0"
          echo "Checking authenticated critical read endpoint: ${auth_url}"

          curl_args=(
            -sS
            -w '\n%{http_code}'
            -H "Authorization: Bearer ${STAGING_SYNTHETIC_BEARER_TOKEN}"
          )

          if [[ -n "${STAGING_WORKSPACE_ID:-}" ]]; then
            curl_args+=(-H "X-Workspace-ID: ${STAGING_WORKSPACE_ID}")
          fi

          auth_response="$(curl "${curl_args[@]}" "${auth_url}")" || {
            echo "::error::Authenticated request failed."
            exit 1
          }

          auth_status="${auth_response##*$'\n'}"
          auth_body="${auth_response%$'\n'*}"

          if [[ "${auth_status}" != "200" ]]; then
            echo "::error::Authenticated critical read failed with HTTP ${auth_status}."
            echo "Response: ${auth_body}"
            exit 1
          fi

          echo "${auth_body}" | python3 -c '
          import json, sys
          json.load(sys.stdin)
          '
          echo "Authenticated critical read endpoint passed."
