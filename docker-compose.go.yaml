# The dev stack on the Go backend: app, agentarea-worker, agentarea-events,
# mcp-manager, app_migrations and bucket-init run `agentarea <role>` from
# agentarea-go (agentarea-go/Dockerfile) under the same service names and
# ports, so the webapp on :3000 keeps working.
#
#   docker compose -f docker-compose.dev.yaml -f docker-compose.go.yaml up -d
#
# Not replaced yet: app_catalog (Go has no reconcile until the operator role),
# sandbox-executor (no sandbox role yet, so no sandbox secrets are set below).

x-go: &go
  image: agentarea/agentarea-go:dev
  build: !override
    context: agentarea-go
    dockerfile: Dockerfile
  working_dir: !reset null
  volumes: !reset []

x-go-env: &go-env
  AGENTAREA_ENV: development
  AGENTAREA_LOG_LEVEL: INFO
  AGENTAREA_DB_HOST: db
  AGENTAREA_DB_PORT: "5432"
  AGENTAREA_DB_USER: ${AGENTAREA_DB_USER}
  AGENTAREA_DB_PASSWORD: ${AGENTAREA_DB_PASSWORD}
  AGENTAREA_DB_NAME: ${AGENTAREA_DB_NAME}
  AGENTAREA_DB_SSLMODE: disable
  AGENTAREA_REDIS_URL: redis://valkey:6379
  AGENTAREA_EVENT_NAMESPACE: agentarea
  AGENTAREA_S3_ENDPOINT: http://rustfs:9000
  AGENTAREA_S3_PUBLIC_ENDPOINT: ${AGENTAREA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  AGENTAREA_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
  AGENTAREA_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
  AGENTAREA_S3_REGION: ${RUSTFS_REGION:-us-east-1}
  AGENTAREA_S3_BUCKET: ${DOCUMENTS_BUCKET}
  AGENTAREA_S3_ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
  AGENTAREA_SECRET_BACKEND: ${AGENTAREA_SECRET_BACKEND:-database}
  AGENTAREA_SECRET_ENCRYPTION_KEY: ${AGENTAREA_SECRET_ENCRYPTION_KEY}
  AGENTAREA_AUTH_JWKS_B64: ${AGENTAREA_AUTH_JWKS_B64}
  AGENTAREA_AUTH_ISSUER: ${AGENTAREA_AUTH_ISSUER:-http://localhost:4433}
  AGENTAREA_AUTH_AUDIENCE: ${AGENTAREA_AUTH_AUDIENCE:-agentarea-api}
  AGENTAREA_AUTH_KRATOS_ADMIN_URL: http://kratos:4434
  AGENTAREA_AUTH_HYDRA_URL: http://hydra:4444
  AGENTAREA_AUTH_HYDRA_ADMIN_URL: http://hydra:4445
  AGENTAREA_AUTH_HYDRA_BROWSER_URL: http://localhost:4444
  AGENTAREA_AUTH_HYDRA_AUDIENCE: http://localhost:8000
  AGENTAREA_MCP_OAUTH_SCOPES: openid offline_access offline
  AGENTAREA_MCP_OAUTH_APPS: ${AGENTAREA_MCP_OAUTH_APPS:-[]}
  AGENTAREA_AUTHZ_BACKEND: ${AGENTAREA_AUTHZ_BACKEND:-openfga}
  AGENTAREA_AUTHZ_FGA_URL: ${AGENTAREA_AUTHZ_FGA_URL:-http://openfga:8080}
  AGENTAREA_AUTHZ_FGA_STORE_ID: ${AGENTAREA_AUTHZ_FGA_STORE_ID:-}
  AGENTAREA_AUTHZ_FGA_MODEL_ID: ${AGENTAREA_AUTHZ_FGA_MODEL_ID:-}
  AGENTAREA_AUTHZ_FGA_BOOTSTRAP: ${AGENTAREA_AUTHZ_FGA_BOOTSTRAP:-true}
  AGENTAREA_AUTHZ_FGA_APPLY_MODEL: ${AGENTAREA_AUTHZ_FGA_APPLY_MODEL:-true}
  AGENTAREA_AUTHZ_FGA_STORE_NAME: ${AGENTAREA_AUTHZ_FGA_STORE_NAME:-agentarea}
  AGENTAREA_AUTHZ_FGA_API_TOKEN: ${OPENFGA_AUTHN_PRESHARED_KEY:?OPENFGA_AUTHN_PRESHARED_KEY is required; run scripts/gen-dev-secrets.sh}
  AGENTAREA_API_URL: http://localhost:8000
  AGENTAREA_APP_URL: ${AGENTAREA_APP_URL:-http://localhost:3000}
  TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
  TEMPORAL_NAMESPACE: default
  AGENTAREA_TEMPORAL_QUEUE: agent-tasks
  AGENTAREA_MCP_MANAGER_URL: http://mcp-manager:80
  AGENTAREA_MCP_GATEWAY_SECRET: ${AGENTAREA_MCP_GATEWAY_SECRET:?AGENTAREA_MCP_GATEWAY_SECRET is required; run scripts/gen-dev-secrets.sh}
  AGENTAREA_MCP_BACKEND: ${AGENTAREA_MCP_BACKEND:-docker}
  AGENTAREA_MCP_NETWORK: agentarea_mcp-network
  AGENTAREA_MCP_ISOLATION: ${AGENTAREA_MCP_ISOLATION:-standard}
  AGENTAREA_MCP_BASE_IMAGE: agentarea/agentarea-mcp-base:dev
  AGENTAREA_MCP_PACKAGE_REPO: ${AGENTAREA_MCP_PACKAGE_REPO:-}
  AGENTAREA_MCP_LEASE_TTL: ${AGENTAREA_MCP_LEASE_TTL:-90s}
  AGENTAREA_MCP_STARTUP_TIMEOUT: ${AGENTAREA_MCP_STARTUP_TIMEOUT:-5m}
  AGENTAREA_MCP_IDLE_TIMEOUT: ${AGENTAREA_MCP_IDLE_TIMEOUT:-10m}
  AGENTAREA_MCP_SWEEP_INTERVAL: ${AGENTAREA_MCP_SWEEP_INTERVAL:-60s}
  AGENTAREA_HTTP_PRIVATE_ALLOWLIST: ${AGENTAREA_HTTP_PRIVATE_ALLOWLIST:-localhost,host.docker.internal}
  AGENTAREA_LOCAL_HOST: host.docker.internal
  AGENTAREA_HTTP_EXTRA_CA_CERTS: ${AGENTAREA_HTTP_EXTRA_CA_CERTS:-}
  AGENTAREA_SPEND_CURRENCY: ${AGENTAREA_SPEND_CURRENCY:-USD}
  AGENTAREA_ANALYTICS_ENABLED: ${AGENTAREA_ANALYTICS_ENABLED:-false}

services:
  app_migrations:
    <<: *go
    command: ["migrate"]
    environment: !override
      <<: *go-env
    networks:
      - default
      - auth-network

  bucket-init:
    <<: *go
    entrypoint: !reset null
    command: ["init-buckets"]
    environment: !override
      <<: *go-env
      AGENTAREA_S3_BUCKETS: ${DOCUMENTS_BUCKET:-documents},${ARTIFACTS_BUCKET:-artifacts}
      AGENTAREA_S3_CORS_ORIGINS: ${AGENTAREA_S3_CORS_ORIGINS:-http://localhost:3000}

  app:
    <<: *go
    command: ["serve"]
    # Root for the mounted docker socket: serve runs the MCP runtime in process.
    user: "0"
    environment: !override
      <<: *go-env
      PORT: "8000"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: !override
      - default
      - temporal-network
      - auth-network
      - mcp-network

  agentarea-worker:
    <<: *go
    command: ["worker"]
    user: "0"
    environment: !override
      <<: *go-env
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      app_migrations:
        condition: service_completed_successfully
    networks: !override
      - default
      - temporal-network
      - auth-network
      - mcp-network

  agentarea-events:
    <<: *go
    command: ["events"]
    environment: !override
      <<: *go-env
      AGENTAREA_EVENT_POLL_INTERVAL: 30s
      AGENTAREA_EVENT_MAX_POLLERS: "10"
    depends_on:
      app_migrations:
        condition: service_completed_successfully
    networks: !override
      - default
      - temporal-network
      - auth-network

  mcp-manager:
    <<: *go
    command: ["mcp"]
    user: "0"
    tmpfs: !reset []
    environment: !override
      <<: *go-env
      PORT: "80"
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on: !override
      db:
        condition: service_healthy
      app_migrations:
        condition: service_completed_successfully
