  docker-api:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.platform_libs == 'true')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, platform-lint, platform-test, platform-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: api
      context: agentarea-platform
      dockerfile: agentarea-platform/apps/api/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  performance:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.platform == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install uv (act fallback)
        run: |
          curl -Ls https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --group dev

      - name: Benchmark build performance
        working-directory: agentarea-platform
        run: |
          echo "## Build Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Build Time |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          for component in api worker; do
            start_time=$(date +%s.%N)
            uv build apps/$component
            end_time=$(date +%s.%N)
            build_time=$(echo "$end_time - $start_time" | bc)
            echo "| $component | ${build_time}s |" >> $GITHUB_STEP_SUMMARY
          done
  docker-worker:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && (needs.changes.outputs.worker == 'true' || needs.changes.outputs.platform_libs == 'true')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, platform-lint, platform-test, platform-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: worker
      context: agentarea-platform
      dockerfile: agentarea-platform/apps/worker/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-frontend:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.webapp == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, webapp-lint, webapp-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: frontend
      context: agentarea-webapp
      dockerfile: agentarea-webapp/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-operator:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.operator == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: operator
      context: agentarea-operator
      dockerfile: agentarea-operator/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-agentarea-mcp-manager:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_manager == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, mcp-manager-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-manager
      context: agentarea-mcp-manager
      dockerfile: agentarea-mcp-manager/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-runner:
    # Build activation service for warm pool
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_manager == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, mcp-manager-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-runner
      context: agentarea-mcp-manager
      dockerfile: agentarea-mcp-manager/Dockerfile.runner
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  webapp-lint:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: agentarea-webapp
        run: pnpm run lint

  webapp-build:
    runs-on: ubuntu-latest
    needs: [changes, webapp-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && needs.webapp-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Build application
        working-directory: agentarea-webapp
        run: pnpm run build

  cli-test:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if cli changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.cli == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-cli/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-cli
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: agentarea-cli
        run: pnpm run test

  mcp-manager-lint-test:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if mcp_manager changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.mcp_manager == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        working-directory: agentarea-mcp-manager
        run: go test ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agentarea-mcp-manager

  events-lint-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.events == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        working-directory: agentarea-event-service
        run: go test ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: agentarea-event-service

  docker-events:
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.events == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, events-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: events
      context: agentarea-event-service
      dockerfile: agentarea-event-service/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  # Migration safety gate: a broken or conflicting migration is a top cause of
  # prod incidents. Prove migrations apply cleanly on a fresh DB, that there is
  # exactly one head (no unmerged branches), and that a downgrade roundtrips.
  migrations-gate:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentarea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agentarea_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --group dev

      - name: Assert exactly one migration head
        working-directory: agentarea-platform/apps/api
        run: |
          set -euo pipefail
          heads=$(uv run alembic heads | grep -c '(head)' || true)
          echo "Migration heads found: $heads"
          uv run alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 migration head, found $heads. Conflicting branches — add a merge migration."
            exit 1
          fi

      - name: Apply migrations to a fresh database
        working-directory: agentarea-platform/apps/api
        run: uv run alembic upgrade head

      - name: Downgrade/upgrade roundtrip (last revision)
        working-directory: agentarea-platform/apps/api
        run: |
          set -euo pipefail
          uv run alembic downgrade -1
          uv run alembic upgrade head

  # Single required status check for branch protection. Monorepo path filters
  # skip irrelevant jobs (they report "skipped", not "failure"), so a per-job
  # required check is unworkable; this aggregator is the one check to require.
  ci-required:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - version-check
      - platform-lint
      - platform-test
      - platform-build
      - migrations-gate
      - webapp-lint
      - webapp-build
      - cli-test
      - mcp-manager-lint-test
      - events-lint-test
      - docker-api
      - docker-worker
      - docker-frontend
      - docker-operator
      - docker-agentarea-mcp-manager
      - docker-agentarea-mcp-runner
      - docker-events
    steps:
      - name: Verify no required job failed
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required CI job did not pass (result: $r). See the job graph above."
              exit 1
            fi
          done
          echo "All required jobs passed or were legitimately skipped."