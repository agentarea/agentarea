{{- if .Values.operator.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmproviderconfigs.agentarea.io
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
spec:
  group: agentarea.io
  names:
    kind: LLMProviderConfig
    listKind: LLMProviderConfigList
    plural: llmproviderconfigs
    singular: llmproviderconfig
    shortNames: [llm, llmpc]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [providerKey, name]
              properties:
                providerKey: {type: string}
                name: {type: string}
                endpointUrl: {type: string}
                apiKeySecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: {type: string}
                    key: {type: string}
                discoverModels: {type: boolean, default: false}
                isPublic: {type: boolean, default: true}
                workspaceId: {type: string, default: "system"}
                models:
                  type: array
                  items:
                    type: object
                    required: [modelName]
                    properties:
                      modelName: {type: string}
                      displayName: {type: string}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Synced, Error, Discovering]
                message: {type: string}
                providerConfigId: {type: string}
                discoveredModels: {type: integer}
                lastSyncedAt: {type: string, format: date-time}
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Provider, type: string, jsonPath: .spec.providerKey}
        - {name: Status, type: string, jsonPath: .status.phase}
        - {name: Models, type: integer, jsonPath: .status.discoveredModels}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: registrysyncs.agentarea.io
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
spec:
  group: agentarea.io
  names:
    kind: RegistrySync
    listKind: RegistrySyncList
    plural: registrysyncs
    singular: registrysync
    shortNames: [regsync, rsync]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [type, source]
              properties:
                type:
                  type: string
                  enum: [mcp_servers, skills, llm_providers, llm_models, default_agents]
                source:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [url, file, configMap]
                    url: {type: string}
                    configMapRef:
                      type: object
                      required: [name, key]
                      properties:
                        name: {type: string}
                        key: {type: string}
                syncIntervalSeconds: {type: integer, default: 21600, minimum: 60}
                workspaceId: {type: string, default: "system"}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Syncing, Synced, Error]
                message: {type: string}
                lastSyncedAt: {type: string, format: date-time}
                itemCount: {type: integer}
                newItems: {type: integer}
                updatedItems: {type: integer}
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Type, type: string, jsonPath: .spec.type}
        - {name: Status, type: string, jsonPath: .status.phase}
        - {name: Items, type: integer, jsonPath: .status.itemCount}
        - {name: LastSync, type: string, jsonPath: .status.lastSyncedAt}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
{{- end }}
