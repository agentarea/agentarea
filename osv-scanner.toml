# Reviewed exceptions for the osv-scanner SCA scan (.github/workflows/sca-scan.yml,
# issue #502). Every entry needs a reason and an ignoreUntil review date; when
# that date passes, the finding reports again and must be re-triaged rather
# than silently re-added.
#
# Findings with an in-line fix were bumped directly instead of
# being listed here (click, google.golang.org/grpc, brace-expansion,
# @ai-sdk/provider-utils, protobufjs, qs, golang.org/x/crypto). Everything
# below has no fix yet, so it is deferred rather than done as a drive-by.

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-12-24
reason = "golang.org/x/crypto/openpgp is flagged unmaintained and unsafe-by-design with no version fix. Indirect dependency of agentarea-mcp-manager (pulled in transitively; openpgp is not imported directly). Re-check at review for an upstream fix or for whatever pulls it in dropping the dependency."


[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-06
reason = "braces <=3.0.3 stack exhaustion on deeply nested brace patterns; no fixed release exists. Build/dev tooling only: in agentarea-webapp via tailwindcss 3 (chokidar, fast-glob/micromatch) expanding the repo's own content globs, in agentarea-cli via ava/xo. No runtime path feeds it untrusted patterns. Re-check for a fixed braces release or tailwind 4 migration dropping it."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
ignoreUntil = 2027-01-06
reason = "sprintf-js <=1.1.3 DoS via unbounded precision specifiers; no fixed release exists. agentarea-cli dev dependency only (argparse@1 -> js-yaml@3 -> supertap, pulled by ava); never shipped in the CLI bundle and never formats untrusted strings. Re-check for a fixed release or ava dropping js-yaml@3."

[[IgnoredVulns]]
id = "GHSA-685w-q87j-wqw3"
ignoreUntil = 2027-01-19
reason = "github.com/docker/distribution <=2.8.3: the registry client's manifests.Get() does not verify returned content against the requested digest; the fix is only in the v3 module (github.com/distribution/distribution/v3). Indirect dependency of agentarea-mcp-manager via google/go-containerregistry, which imports only registry/client/auth/challenge (auth challenge parsing), never the manifest client. Re-check when go-containerregistry moves to distribution v3."
