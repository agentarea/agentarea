name: Secret scan

# The detect-secrets pre-commit hook was configured but could never run: it
# points at --baseline .secrets.baseline and that file did not exist, and no
# workflow invoked pre-commit at all. That is how a shared JWT signing key, a
# Fernet encryption key and the Ory cookie/cipher secrets reached main.
#
# Enforcement uses `detect-secrets-hook`, not `detect-secrets scan`. `scan`
# CREATES a baseline and exits 0 regardless of what it finds; only the hook
# exits non-zero on a secret that is not already in the baseline.
#
# The version here must match the rev pinned in .pre-commit-config.yaml — a
# baseline written by a newer detect-secrets makes an older one abort with
# "No such plugin to initialize".
#
# Scoped to detect-secrets on purpose. The repo's other pre-commit hooks
# (trailing-whitespace, end-of-file-fixer, yamllint, shellcheck) have never run
# in CI and would fail broadly on existing files; enabling them is a separate,
# deliberate cleanup.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  DETECT_SECRETS_VERSION: "1.5.0"

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install "detect-secrets==${DETECT_SECRETS_VERSION}"

      - name: Require a baseline
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Regenerate it with:"
            echo "  detect-secrets scan --exclude-files '.*\.lock\$' --exclude-files 'node_modules/.*' > .secrets.baseline"
            exit 1
          fi

      - name: Scan tracked files against the baseline
        run: |
          # The hook's exit code alone is not a usable signal: it also exits
          # non-zero after rewriting the baseline just to refresh line numbers,
          # which happens on any edit above a known finding. Fail on a reported
          # secret, and separately on the baseline's secret SET growing — the
          # second check does not depend on the tool's message text.
          python - <<'PY' > /tmp/before.json
          import json
          b = json.load(open(".secrets.baseline"))
          print(json.dumps(sorted(
              [f, i["type"], i.get("hashed_secret", "")]
              for f, v in b["results"].items() for i in v
          )))
          PY

          set +e
          out=$(git ls-files -z \
            | tr '\0' '\n' \
            | grep -v -E '\.lock$|^node_modules/|^\.omc/|package-lock\.json$|pnpm-lock\.yaml$' \
            | tr '\n' '\0' \
            | xargs -0 detect-secrets-hook --baseline .secrets.baseline 2>&1)
          set -e
          echo "$out"

          python - <<'PY' > /tmp/after.json
          import json
          b = json.load(open(".secrets.baseline"))
          print(json.dumps(sorted(
              [f, i["type"], i.get("hashed_secret", "")]
              for f, v in b["results"].items() for i in v
          )))
          PY

          if echo "$out" | grep -q "Potential secrets about to be committed"; then
            echo "::error::A secret not present in .secrets.baseline was found (see above)."
            echo "Remove it, or if it is a false positive mark it with an inline"
            echo "\`pragma: allowlist secret\` comment, or re-run:"
            echo "  detect-secrets scan --exclude-files '.*\.lock\$' --exclude-files 'node_modules/.*' > .secrets.baseline"
            exit 1
          fi

          if ! diff -q /tmp/before.json /tmp/after.json >/dev/null; then
            echo "::error::The set of known secrets changed; review and commit .secrets.baseline."
            diff /tmp/before.json /tmp/after.json || true
            exit 1
          fi
