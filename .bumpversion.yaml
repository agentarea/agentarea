# Modern YAML format for bumpversion configuration
# Managed by scripts/bump-version.py (custom Python script)
# See docs/VERSIONING.md for details

current_version: 0.2.0
commit: false
tag: false
parse: (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize:
  - "{major}.{minor}.{patch}"

files:
  - filename: agentarea-platform/test/fuzz/pyproject.toml
    search: version = "{current_version}"
    replace: version = "{new_version}"

  - filename: agentarea-webapp/package.json
    search: '"version": "{current_version}"'
    replace: '"version": "{new_version}"'

  - filename: charts/agentarea/Chart.yaml
    search: 'appVersion: "{current_version}"'
    replace: 'appVersion: "{new_version}"'

  - filename: charts/agentarea-dataplane/Chart.yaml
    search: 'appVersion: "{current_version}"'
    replace: 'appVersion: "{new_version}"'

  - filename: VERSION
    search: "{current_version}"
    replace: "{new_version}"
