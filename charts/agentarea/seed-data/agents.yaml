# System agents configuration
# These agents are created during bootstrap and available to all workspaces
agents:
  - id: "00000000-0000-0000-0000-000000000001"
    name: "Default Agent"
    description: "System default agent with standard tools and capabilities"
    instruction: |
      You are a helpful AI assistant with access to various tools.
      You can help with calculations, file operations, and web searches.
      Always ask for clarification when needed and explain your reasoning.
    tools:
      - type: code
        name: agentarea/calculator
      - type: code
        name: agentarea/math
    planning: false
