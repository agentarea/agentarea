{{- if .Values.rustfs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: rustfs
          image: "{{ default "rustfs/rustfs" .Values.rustfs.image.repository }}:{{ default "latest" .Values.rustfs.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["/data", "--console-enable"]
          ports:
            - name: rustfs
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-user
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-password
          {{- with .Values.rustfs.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rustfs.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.rustfs.resources .Values.global.workloads.resources.mainContainer }}
          resources:
            {{- if .Values.rustfs.resources }}
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.limit }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.limit }}
            requests:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.request }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.request }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        {{- if .Values.rustfs.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rustfs-pvc
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: rustfs
      protocol: TCP
      name: rustfs
    - port: 9001
      targetPort: console
      protocol: TCP
      name: console
  selector:
    {{- include "agentarea.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
---
{{- if .Values.rustfs.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-rustfs-pvc
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rustfs.persistence.size }}
{{- end }}
---
{{- $defaultBucket := default .Values.global.storage.bucket .Values.rustfs.defaultBuckets }}
{{- if $defaultBucket }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentarea.fullname" . }}-rustfs-bucket-init
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs-bucket-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-bucket-init
    spec:
      restartPolicy: Never
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: s3-client
          image: "amazon/aws-cli:2.17.51"
          command:
            - sh
            - -c
            - |
              aws configure set default.s3.addressing_style path
              aws s3 mb s3://{{ $defaultBucket }} --endpoint-url http://{{ .Release.Name }}-rustfs:9000 || true
              {{- if .Values.global.storage.cors.allowedOrigins }}
              aws s3api put-bucket-cors --bucket {{ $defaultBucket }} --endpoint-url http://{{ .Release.Name }}-rustfs:9000 --cors-configuration '{"CORSRules":[{"AllowedOrigins":[{{ range $i, $o := .Values.global.storage.cors.allowedOrigins }}{{ if $i }},{{ end }}"{{ $o }}"{{ end }}],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}'
              {{- end }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-password
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
{{- end }}
{{- end }}
