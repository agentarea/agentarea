{{/*
  Lookup existing secrets to preserve them across upgrades.
  Only generate new secrets if they don't exist.

  TODO: Implement external database/valkey/storage support.
  See: charts/agentarea/docs/TODO-external-services.md
*/}}

{{/* PostgreSQL password - only lookup/generate if postgresql is enabled */}}
{{- $postgresPassword := "" -}}
{{- if .Values.postgresql.enabled -}}
  {{- $postgresSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.secrets.postgresql -}}
  {{- if $postgresSecret -}}
    {{- $postgresPassword = index $postgresSecret.data "password" | b64dec -}}
  {{- else -}}
    {{- $postgresPassword = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}

{{/* Redis password - only lookup/generate if redis is enabled */}}
{{- $redisPassword := "" -}}
{{- if .Values.redis.enabled -}}
  {{- $redisSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.secrets.redis -}}
  {{- if $redisSecret -}}
    {{- $redisPassword = index $redisSecret.data "redis-password" | b64dec -}}
  {{- else -}}
    {{- $redisPassword = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}

{{/* RustFS credentials - only lookup/generate if rustfs is enabled */}}
{{- $rustfsAccessKey := "" -}}
{{- $rustfsSecretKey := "" -}}
{{- if .Values.rustfs.enabled -}}
  {{- $rustfsSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.secrets.rustfs -}}
  {{- if $rustfsSecret -}}
    {{- $rustfsAccessKey = index $rustfsSecret.data "root-user" | b64dec -}}
    {{- $rustfsSecretKey = index $rustfsSecret.data "root-password" | b64dec -}}
  {{- else -}}
    {{- $rustfsAccessKey = randAlphaNum 20 -}}
    {{- $rustfsSecretKey = randAlphaNum 40 -}}
  {{- end -}}
{{- end -}}

{{/* Application secrets - always needed, reuse if exists */}}
{{- $appSecret := lookup "v1" "Secret" .Release.Namespace .Values.global.secrets.application -}}
{{- $authSecretB64 := "" -}}
{{- $encryptionKeyB64 := "" -}}
{{- $sandboxActivationSecretB64 := "" -}}
{{- $sandboxControlSecretB64 := "" -}}
{{- if $appSecret -}}
  {{- $authSecretB64 = index $appSecret.data "auth-secret" -}}
  {{- $encryptionKeyB64 = index $appSecret.data "encryption-key" -}}
  {{- if hasKey $appSecret.data "sandbox-activation-secret" -}}
    {{- $sandboxActivationSecretB64 = index $appSecret.data "sandbox-activation-secret" -}}
  {{- else -}}
    {{- $sandboxActivationSecretB64 = randAlphaNum 48 | b64enc -}}
  {{- end -}}
  {{- if hasKey $appSecret.data "sandbox-control-secret" -}}
    {{- $sandboxControlSecretB64 = index $appSecret.data "sandbox-control-secret" -}}
  {{- else -}}
    {{- $sandboxControlSecretB64 = randAlphaNum 48 | b64enc -}}
  {{- end -}}
{{- else -}}
  {{- $authSecretB64 = randAlphaNum 44 | b64enc -}}
  {{- $fernetKey := randAlphaNum 32 | b64enc -}}
  {{- $encryptionKeyB64 = $fernetKey | b64enc -}}
  {{- $sandboxActivationSecretB64 = randAlphaNum 48 | b64enc -}}
  {{- $sandboxControlSecretB64 = randAlphaNum 48 | b64enc -}}
{{- end -}}

{{- if .Values.postgresql.enabled }}
---
# PostgreSQL Secret (only created when postgresql.enabled=true)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.postgresql }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  postgres-password: {{ $postgresPassword | b64enc | quote }}
  password: {{ $postgresPassword | b64enc | quote }}
  username: {{ "postgres" | b64enc | quote }}
{{- end }}

{{- if .Values.redis.enabled }}
---
# Redis Secret (only created when redis.enabled=true)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.redis }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  redis-password: {{ $redisPassword | b64enc | quote }}
{{- end }}

{{- if .Values.rustfs.enabled }}
---
# RustFS Secret (only created when rustfs.enabled=true)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.rustfs }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  root-user: {{ $rustfsAccessKey | b64enc | quote }}
  root-password: {{ $rustfsSecretKey | b64enc | quote }}
{{- end }}

{{- if not .Values.global.secrets.applicationExistingSecret }}
---
# Application Secrets (JWT, Encryption)
#
# Generated here only when nothing else provides them. That is a convenience for
# development and a hazard in production: `lookup` returns nothing under
# `helm template`, which is how ArgoCD renders, so these values are re-invented
# on every render and the deployment is held together by ignoreDifferences. A
# rebuilt cluster gets new ones, and encryption-key decrypts every row of
# encrypted_secrets -- when the RU cluster was rebuilt on 2026-08-31 the
# databases were restored and every stored credential was lost with the key.
#
# Set global.secrets.applicationExistingSecret and pre-provision the Secret from
# a manager that outlives the cluster, as global.secrets.runtimeCredentials
# already requires.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secrets.application }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": "keep"
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
data:
  # JWT secret for authentication
  auth-secret: {{ $authSecretB64 | quote }}
  # Encryption key for platform encryption/decryption
  encryption-key: {{ $encryptionKeyB64 | quote }}
  # API auth header value for backend authentication
  api-auth-header-value: {{ $authSecretB64 | quote }}
  # HMAC key for runner-to-activation requests; never injected into task commands.
  sandbox-activation-secret: {{ $sandboxActivationSecretB64 | quote }}
  # Workspace/task/body-scoped HMAC key for worker-to-manager execution control.
  sandbox-control-secret: {{ $sandboxControlSecretB64 | quote }}
{{- end }}
