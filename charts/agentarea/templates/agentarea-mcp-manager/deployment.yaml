{{- if .Values.mcpManager.enabled }}
{{- $admission := .Values.mcpManager.admission }}
{{- if and (empty $admission.allowedImageRepositories) (empty $admission.allowedCommandPackages) }}
  {{- fail "mcpManager.admission declares nothing runnable: set allowedImageRepositories (registry/repository, no tag) and/or allowedCommandPackages. MCP instance pods run third-party code on the node's container runtime, so the set of admissible code is declared, never inferred." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentarea.fullname" . }}-mcp-manager
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-manager
spec:
  replicas: {{ .Values.mcpManager.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-manager
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-manager
    spec:
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-manager
          image: "{{ .Values.global.image.registry }}{{ if .Values.global.image.registry }}/{{ end }}{{ .Values.mcpManager.image.repository }}:{{ default .Chart.AppVersion .Values.mcpManager.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.mcpManager.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- include "agentarea.database.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.database.envs" . | nindent 12 }}
            {{- include "agentarea.redis.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.redis.envs" . | nindent 12 }}
            {{- include "agentarea.redis.urlEnv" . | nindent 12 }}
            {{- include "agentarea.storage.envs" . | nindent 12 }}
            {{- include "agentarea.storage.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.application.secrets.envs" . | nindent 12 }}
            - name: SANDBOX_ACTIVATION_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.application }}
                  key: sandbox-activation-secret
            - name: SANDBOX_CONTROL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.application }}
                  key: sandbox-control-secret
            - name: SANDBOX_CLEANUP_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxCleanupSecretName" . }}
                  key: {{ include "agentarea.sandboxCleanupSecretKey" . }}
            - name: SANDBOX_INSPECTION_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxInspectionSecretName" . }}
                  key: {{ include "agentarea.sandboxInspectionSecretKey" . }}
            - name: SANDBOX_FILE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxFileSecretName" . }}
                  key: {{ include "agentarea.sandboxFileSecretKey" . }}
            - name: MCP_GATEWAY_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.mcpGatewaySecretName" . }}
                  key: {{ include "agentarea.mcpGatewaySecretKey" . }}
            {{- include "agentarea.sandboxRuntime.envs" . | nindent 12 }}
            {{- include "agentarea.mcpManager.envs" . | nindent 12 }}
            {{- $ip := .Values.mcpManager.instancePod }}
            {{- if and $ip (or $ip.labels $ip.annotations $ip.nodeSelector $ip.tolerations $ip.affinity $ip.imagePullSecrets $ip.priorityClassName) }}
            # Operator customization for spawned MCP instance pods (one JSON blob;
            # parsed by the manager into the instance pod spec).
            - name: KUBERNETES_INSTANCE_POD
              value: {{ $ip | toJson | quote }}
            {{- end }}
            {{- if or .Values.mcpManager.envVars .Values.global.envVars }}
            {{- $mcpEnv := default dict .Values.mcpManager.envVars -}}
            {{- $globalEnv := default dict .Values.global.envVars -}}
            {{- range $k, $v := mergeOverwrite $mcpEnv $globalEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mcpManager.secrets }}
            {{- $secretName := ( .Values.mcpManager.secretsName | default (printf "%s-mcp-manager-secrets" .Release.Name) ) }}
            {{- range $k, $v := .Values.mcpManager.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $k }}
            {{- end }}
            {{- end }}
            {{- if .Values.mcpManager.extraEnv }}
            {{- toYaml .Values.mcpManager.extraEnv | nindent 12 }}
            {{- end }}
          {{- with .Values.mcpManager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          {{- if eq (default "kubernetes" .Values.mcpManager.backend) "docker" }}
          # Docker backend: drive containers through the host Docker socket.
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
      {{- else }}
          # Kubernetes backend - no special volumes needed
      {{- end }}
{{- end }}
