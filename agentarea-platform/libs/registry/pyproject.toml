[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-registry"
version = "0.0.13"
description = "Registry catalog sync (mcp_servers, skills, llm_providers, llm_models, default_agents)"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "agentarea-mcp",
    "pydantic>=2.4.2",
    "pyyaml>=6.0",
]

[tool.uv.sources]
agentarea-common = { workspace = true }
agentarea-mcp = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agentarea_registry"]
