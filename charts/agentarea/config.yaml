groups:
  database:
    configVars:
      AGENTAREA_DB_HOST: '{{ include "agentarea.database.host" . }}'
      AGENTAREA_DB_PORT: '{{ .Values.global.database.port }}'
      AGENTAREA_DB_NAME: '{{ .Values.global.database.name }}'
      AGENTAREA_DB_SSLMODE: '{{ .Values.global.database.sslMode }}'
    secrets:
      - name: AGENTAREA_DB_USER
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "username"
      - name: AGENTAREA_DB_PASSWORD
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "password"
    envExtras:
      - name: AGENTAREA_DB_URL
        value: "postgresql://$(AGENTAREA_DB_USER):$(AGENTAREA_DB_PASSWORD)@$(AGENTAREA_DB_HOST):$(AGENTAREA_DB_PORT)/$(AGENTAREA_DB_NAME)?sslmode={{ .Values.global.database.sslMode }}"

  redis:
    # AGENTAREA_REDIS_URL is emitted by the agentarea.redis.urlEnv helper
    # (templates/_redis-url.tpl) so it can support external providers via
    # global.redis.url or global.redis.existingSecret. Do NOT add AGENTAREA_REDIS_URL
    # back to envExtras here.
    configVars:
      AGENTAREA_REDIS_HOST: '{{ include "agentarea.redis.host" . }}'
      AGENTAREA_REDIS_PORT: '{{ .Values.global.redis.port }}'
    secrets:
      - name: AGENTAREA_REDIS_PASSWORD
        secretName: "{{ .Values.global.secrets.redis }}"
        key: "redis-password"

  storage:
    # Only include storage config when RustFS is enabled
    conditional: '{{ .Values.rustfs.enabled }}'
    configVars:
      AGENTAREA_S3_REGION: '{{ .Values.global.storage.region }}'
      AGENTAREA_S3_BUCKET: '{{ .Values.global.storage.bucket }}'
      AGENTAREA_S3_ARTIFACTS_BUCKET: '{{ .Values.global.storage.bucket }}'
      AGENTAREA_S3_ENDPOINT: 'http://{{ include "agentarea.rustfs.host" . }}:9000'
    secrets:
      - name: AGENTAREA_S3_ACCESS_KEY
        secretName: "{{ .Values.global.secrets.rustfs }}"
        key: "root-user"
      - name: AGENTAREA_S3_SECRET_KEY
        secretName: "{{ .Values.global.secrets.rustfs }}"
        key: "root-password"

  temporal:
    configVars:
      AGENTAREA_WF_TEMPORAL_URL: '{{ include "agentarea.temporal.host" . }}:{{ .Values.global.temporal.port }}'
      AGENTAREA_WF_NAMESPACE: '{{ .Values.global.temporal.namespace }}'
      AGENTAREA_WF_QUEUE: '{{ .Values.global.temporal.taskQueue }}'

  temporalServer:
    configVars:
      DB: 'postgres12'
      DB_PORT: '5432'
      POSTGRES_SEEDS: '{{ include "agentarea.database.host" . }}'
      DBNAME: '{{ .Values.temporal.database.name | default "temporal" | quote }}'
      BIND_ON_IP: '0.0.0.0'
    secrets:
      - name: AGENTAREA_DB_USER
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "username"
      - name: POSTGRES_PWD
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "password"

  frontend:
    configVars:
      PORT: '3000'
      NODE_ENV: 'production'
      AGENTAREA_API_URL: '{{ include "agentarea.backend.url" . }}'
      AGENTAREA_AUTH_KRATOS_ADMIN_URL: '{{ include "agentarea.kratosAdminUrl" . }}'
      ORY_SDK_URL: '{{ include "agentarea.kratosPublicUrl" . }}'
      NEXT_PUBLIC_ORY_SDK_URL: '{{ include "agentarea.kratosPublicBrowserUrl" . }}'
      METRICS_ENABLED: '{{ .Values.global.monitoring.prometheus.enabled }}'
      HEALTH_CHECK_ENABLED: '{{ .Values.global.monitoring.health.enabled }}'

  backend:
    configVars:
      PORT: '8000'
      AGENTAREA_LOG_LEVEL: 'info'
      AGENTAREA_MCP_MANAGER_URL: 'http://{{ include "agentarea.fullname" . }}-mcp-manager:{{ .Values.mcpManager.service.port }}'
      AGENTAREA_MCP_TIMEOUT: '30'
      API_HOST: '{{ .Values.global.api.host }}'
      API_PORT: '{{ .Values.global.api.port }}'
      AGENTAREA_API_URL: '{{ include "agentarea.backend.apiUrl" . }}'
      API_AUTH_ENABLED: '{{ .Values.global.api.auth.enabled }}'
      AGENTAREA_S3_PUBLIC_ENDPOINT: '{{ .Values.global.storage.publicEndpoint }}'
      METRICS_ENABLED: '{{ .Values.global.monitoring.prometheus.enabled }}'
      METRICS_PORT: '{{ .Values.global.monitoring.prometheus.port }}'
      HEALTH_CHECK_ENABLED: '{{ .Values.global.monitoring.health.enabled }}'
      HEALTH_CHECK_PORT: '{{ .Values.global.monitoring.health.port }}'
      AGENTAREA_AUTH_ISSUER: '{{ .Values.kratos.jwt.issuer }}'
      AGENTAREA_AUTH_AUDIENCE: '{{ .Values.kratos.jwt.audience }}'
    secrets:
      - name: API_AUTH_HEADER_NAME
        value: "{{ .Values.global.api.auth.headerName }}"
      - name: API_AUTH_HEADER_VALUE
        secretName: "{{ .Values.global.secrets.application }}"
        key: "api-auth-header-value"
      - name: AGENTAREA_AUTH_JWKS_B64
        conditional: '{{ .Values.kratos.enabled }}'
        secretName: '{{ default (printf "%s-kratos-jwks" .Release.Name) .Values.kratos.secretName | quote }}'
        key: jwks_b64

  mcpManager:
    configVars:
      AGENTAREA_LOG_LEVEL: 'INFO'
      AGENTAREA_API_URL: 'http://{{ include "agentarea.fullname" . }}-backend:8000'
      HOST: '0.0.0.0'
      PORT: '80'
      # Derived from whether mcpManager.dataPlane names a host, so the backend
      # and the address it is given cannot disagree. Half-configuration stops
      # the render — see the helper.
      AGENTAREA_MCP_BACKEND: '{{ include "agentarea.mcpManager.backendType" . }}'
      # Where MCP containers run when AGENTAREA_MCP_BACKEND is dataplane. Empty otherwise,
      # which the manager reads as "no data plane declared".
      AGENTAREA_MCP_DATAPLANE_URL: '{{ .Values.mcpManager.dataPlane.url | default "" }}'
      AGENTAREA_MCP_DATAPLANE_INSECURE: '{{ .Values.mcpManager.dataPlane.allowInsecure | default false }}'
      AGENTAREA_K8S_ENABLED: 'true'
      AGENTAREA_K8S_NAMESPACE: '{{ .Release.Namespace }}'
      AGENTAREA_K8S_DOMAIN: '{{ .Values.mcpManager.domain | default "mcp.local" }}'
      AGENTAREA_K8S_GATEWAY: '{{ .Values.mcpManager.gateway.name | default "envoy-gateway" }}'
      AGENTAREA_K8S_GATEWAY_NS: '{{ .Values.mcpManager.gateway.namespace | default "envoy-gateway-system" }}'
      AGENTAREA_K8S_RUNTIME_CLASS: '{{ .Values.mcpManager.runtimeClass }}'
      AGENTAREA_MCP_ISOLATION: '{{ required "mcpManager.isolationTier is required" .Values.mcpManager.isolationTier }}'
      AGENTAREA_MCP_ALLOWED_IMAGES: '{{ join "," .Values.mcpManager.admission.allowedImageRepositories }}'
      AGENTAREA_MCP_ALLOWED_PACKAGES: '{{ join "," .Values.mcpManager.admission.allowedCommandPackages }}'
      # Names the cluster workloads are created in and WINS over the manager's
      # in-cluster credentials. Empty unless mcpManager.executionCluster names a
      # Secret, which the deployment projects at this path.
      AGENTAREA_K8S_KUBECONFIG: '{{ include "agentarea.mcpManager.executionKubeconfigPath" . }}'
      AGENTAREA_K8S_SERVICE_ACCOUNT: '{{ include "agentarea.mcpRuntimeServiceAccountName" . }}'
      AGENTAREA_SBX_STORAGE: 's3'
      AGENTAREA_SBX_MAX_FILES: '{{ .Values.sandboxRuntime.workspace.maxFiles }}'
      AGENTAREA_SBX_MAX_FILE_SIZE: '{{ .Values.sandboxRuntime.workspace.maxFileBytes }}'
      AGENTAREA_SBX_MAX_TOTAL_SIZE: '{{ .Values.sandboxRuntime.workspace.maxBytes }}'
      # SANDBOX_{MAX,DEFAULT}_EXECUTION_TIMEOUT_SECONDS,
      # AGENTAREA_SBX_QUEUE_TIMEOUT and AGENTAREA_SBX_COMPLETION_GRACE
      # are deliberately absent here. agentarea.sandboxRuntime.envs emits them
      # from the same sandboxRuntime values to both mcp-manager and
      # sandbox-runner; declaring them again produced two env entries with one
      # name, which makes server-side apply reject the Deployment.
      AGENTAREA_SBX_S3_URL_TTL: '{{ .Values.sandboxRuntime.workspace.signedUrlTTL }}'
      AGENTAREA_SBX_S3_PATH_STYLE: '{{ .Values.sandboxRuntime.workspace.forcePathStyle }}'
      AGENTAREA_K8S_NON_ROOT: 'true'
      AGENTAREA_K8S_READONLY_ROOT: 'true'
      AGENTAREA_K8S_CPU_REQUEST: '100m'
      AGENTAREA_K8S_CPU_LIMIT: '500m'
      AGENTAREA_K8S_MEMORY_REQUEST: '128Mi'
      AGENTAREA_K8S_MEMORY_LIMIT: '512Mi'
      AGENTAREA_MCP_FEATURES: '{{ join "," .Values.mcpManager.features.enabled }}'
      # The manager is always the demand boundary for container-backed MCP.
      # serverless.enabled controls only whether idle workloads are reclaimed;
      # 0 keeps an on-demand workload running after its first successful start.
      AGENTAREA_MCP_IDLE_TIMEOUT: '{{ if .Values.mcpManager.serverless.enabled }}{{ .Values.mcpManager.serverless.idleTimeout }}{{ else }}0{{ end }}'
      AGENTAREA_MCP_SWEEP_INTERVAL: '{{ .Values.mcpManager.serverless.sweepInterval }}'
      AGENTAREA_MCP_LEASE_TTL: '{{ .Values.mcpManager.serverless.requestLeaseTTL }}'
      AGENTAREA_MCP_STARTUP_TIMEOUT: '{{ .Values.mcpManager.serverless.startupTimeout }}'
    secrets:
      # The shared token the data plane checks on every call. Carried from a
      # Secret rather than the ConfigMap because it grants container creation on
      # that host. Absent unless a data plane is configured.
      - name: AGENTAREA_MCP_DATAPLANE_TOKEN
        conditional: '{{ .Values.mcpManager.dataPlane.url }}'
        secretName: "{{ .Values.mcpManager.dataPlane.tokenSecret }}"
        key: "{{ .Values.mcpManager.dataPlane.tokenKey }}"

  temporalUi:
    configVars:
      TEMPORAL_ADDRESS: '{{ include "agentarea.fullname" . }}-temporal:7233'
      TEMPORAL_CORS_ORIGINS: 'http://localhost:3000'

  worker:
    configVars:
      AGENTAREA_WF_MAX_ACTIVITIES: '10'
      AGENTAREA_WF_MAX_WORKFLOWS: '5'
      AGENTAREA_TASK_DISCOVERY_ENABLED: 'true'
      AGENTAREA_DEBUG: 'false'
      AGENTAREA_ENV: 'production'
      AGENTAREA_MCP_MANAGER_URL: 'http://{{ include "agentarea.fullname" . }}-mcp-manager:{{ .Values.mcpManager.service.port }}'

  application:
    secrets:
      - name: AGENTAREA_SECRET_ENCRYPTION_KEY
        secretName: '{{ .Values.global.secrets.application }}'
        key: 'encryption-key'

  databaseJobs:
    configVars:
      AGENTAREA_DB_HOST: '{{ include "agentarea.database.host" . }}'
      AGENTAREA_DB_PORT: '{{ .Values.global.database.port }}'
      AGENTAREA_DB_NAME: '{{ .Values.global.database.name }}'
      AGENTAREA_DB_SSLMODE: '{{ .Values.global.database.sslMode }}'
    secrets:
      - name: AGENTAREA_DB_USER
        secretName: '{{ .Values.global.secrets.postgresql }}'
        key: 'username'
      - name: AGENTAREA_DB_PASSWORD
        secretName: '{{ .Values.global.secrets.postgresql }}'
        key: 'password'
    envExtras:
      - name: AGENTAREA_DB_URL
        value: "postgresql+psycopg2://$(AGENTAREA_DB_USER):$(AGENTAREA_DB_PASSWORD)@$(AGENTAREA_DB_HOST):$(AGENTAREA_DB_PORT)/$(AGENTAREA_DB_NAME)?sslmode={{ .Values.global.database.sslMode }}"
