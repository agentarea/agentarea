{{- if .Values.workloads.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.workloads.namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ .Values.workloads.podSecurity.enforce }}
    pod-security.kubernetes.io/warn: {{ .Values.workloads.podSecurity.warn }}
{{- end }}
---
# MCP servers are third-party code: the namespace's default account keeps no API
# token in their filesystem. They have no business with the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Values.workloads.namespace }}
automountServiceAccountToken: false
