name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  changes:
    runs-on: ubuntu-latest
    # Skip path filtering when called as reusable workflow (run everything)
    if: github.event_name != 'workflow_call'
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      platform_libs: ${{ steps.filter.outputs.platform_libs }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      webapp: ${{ steps.filter.outputs.webapp }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp_manager: ${{ steps.filter.outputs.mcp_manager }}
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            platform:
              - 'agentarea-platform/**'
            platform_libs:
              - 'agentarea-platform/libs/**'
            api:
              - 'agentarea-platform/apps/api/**'
            worker:
              - 'agentarea-platform/apps/worker/**'
            webapp:
              - 'agentarea-webapp/**'
            cli:
              - 'agentarea-cli/**'
            mcp_manager:
              - 'agentarea-mcp-manager/**'
            bootstrap:
              - 'agentarea-bootstrap/**'

  platform-lint:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --all-extras --group dev --group lint

      - name: Run ruff check
        working-directory: agentarea-platform
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: agentarea-platform
        run: uv run ruff format --check .

  platform-test:
    runs-on: ubuntu-latest
    needs: [changes, platform-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && needs.platform-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: |
          uv sync --group dev

      - name: Run tests
        working-directory: agentarea-platform
        run: |
          uv run python -m pytest tests/unit tests/functional -m "not integration"

  platform-build:
    runs-on: ubuntu-latest
    needs: [changes, platform-test]
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && needs.platform-test.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        working-directory: agentarea-platform
        run: uv build apps/${{ matrix.component }}

