apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agentarea.fullname" . }}-mcp-manager-clusterrole
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-manager
rules:
  # Namespace access
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  
  # Core resources for MCP instance management
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Deployment management
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # No Ingress or Gateway API permissions: MCP instances are reachable only
  # through the demand gateway, so the manager never creates a route and must
  # not be able to.

  # Events for logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create"]
  
  # ServiceAccount for pod identity
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agentarea.fullname" . }}-mcp-manager-crb
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agentarea.fullname" . }}-mcp-manager-clusterrole
subjects:
  - kind: ServiceAccount
    name: {{ include "agentarea.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Pod metrics are namespaced. No node metrics, proxy or exec access is needed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agentarea.fullname" . }}-runtime-metrics
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agentarea.fullname" . }}-runtime-metrics
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agentarea.fullname" . }}-runtime-metrics
subjects:
  - kind: ServiceAccount
    name: {{ include "agentarea.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}