name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (e.g., api, worker, frontend)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      image-name:
        description: 'Docker image name (defaults to agentarea-{component})'
        required: false
        type: string
      use-private-registry:
        description: 'Whether to push to private registry'
        required: false
        type: boolean
        default: false
      push:
        description: 'Whether to push the image (false for build-only validation)'
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      DOCKER_REGISTRY_MIRROR:
        required: false
      DOCKER_REGISTRY_MIRROR_PATH:
        required: false
      DOCKER_REGISTRY_MIRROR_USERNAME:
        required: false
      DOCKER_REGISTRY_MIRROR_PASSWORD:
        required: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Private Registry
        if: ${{ inputs.use-private-registry && inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          username: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

      - name: Extract Docker metadata (Public Registry)
        if: ${{ ! inputs.use-private-registry }}
        id: meta-public
        uses: docker/metadata-action@v5
        with:
          images: |
            agentarea/${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=false

      - name: Build private registry image path
        if: ${{ inputs.use-private-registry }}
        id: private-image
        run: |
          REGISTRY="${{ secrets.DOCKER_REGISTRY_MIRROR }}"
          PATH="${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}"
          IMAGE="${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}"

          # Remove trailing slash from registry
          REGISTRY="${REGISTRY%/}"

          # Remove leading and trailing slashes from path
          PATH="${PATH#/}"
          PATH="${PATH%/}"

          # Construct full image path
          if [ -n "$PATH" ]; then
            FULL_IMAGE="${REGISTRY}/${PATH}/${IMAGE}"
          else
            FULL_IMAGE="${REGISTRY}/${IMAGE}"
          fi

          echo "path=$FULL_IMAGE" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata (Public + Private Registry)
        if: ${{ inputs.use-private-registry }}
        id: meta-both
        uses: docker/metadata-action@v5
        with:
          images: |
            agentarea/${{ inputs.image-name || format('agentarea-{0}', inputs.component) }}
            ${{ steps.private-image.outputs.path }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
            type=raw,value=${{ steps.version.outputs.version }}
          flavor: |
            latest=false

      - name: Set metadata output
        id: meta
        run: |
          if [ "${{ inputs.use-private-registry }}" == "true" ]; then
            TAGS='${{ steps.meta-both.outputs.tags }}'
            LABELS='${{ steps.meta-both.outputs.labels }}'
            ANNOTATIONS='${{ steps.meta-both.outputs.annotations }}'
          else
            TAGS='${{ steps.meta-public.outputs.tags }}'
            LABELS='${{ steps.meta-public.outputs.labels }}'
            ANNOTATIONS='${{ steps.meta-public.outputs.annotations }}'
          fi

          {
            printf 'tags<<EOF\n%s\nEOF\n' "$TAGS"
            printf 'labels<<EOF\n%s\nEOF\n' "$LABELS"
            printf 'annotations<<EOF\n%s\nEOF\n' "$ANNOTATIONS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          provenance: false

      - name: Image digest
        run: |
          if [ "${{ inputs.push }}" == "true" ]; then
            echo "Built and pushed ${{ inputs.component }} image with digest ${{ steps.build.outputs.digest }}"
          else
            echo "Built ${{ inputs.component }} image (build-only, no push)"
          fi
