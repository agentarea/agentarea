name: Integration Tests

on:
  workflow_dispatch:  # Always available manually
  pull_request:
    # The heavy jobs stay gated per-job by the `run-integration-tests` label
    # (see each job's `if:`). Listing pull_request here is what lets a labelled
    # PR trigger them; `labeled` re-runs the workflow the moment the label lands.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The app's DatabaseSettings builds the URL from POSTGRES_* (default host "db"),
  # NOT from DATABASE_URL -- so these must be set explicitly or migrations resolve
  # host "db" and fail. Likewise the workflow client reads WORKFLOW__TEMPORAL_SERVER_URL.
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: agentarea_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentarea_test
  REDIS_URL: redis://localhost:6379/0
  WORKFLOW__TEMPORAL_SERVER_URL: localhost:7233
  TEMPORAL_HOST: localhost:7233

jobs:
  # Quick smoke test - validates core services can start
  smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentarea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        working-directory: ./agentarea-platform
        run: uv sync --all-extras --group dev

      - name: Run database migrations
        working-directory: ./agentarea-platform
        run: |
          cd apps/api
          uv run --package agentarea-api agentarea-api migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Smoke test - Repository layer
        working-directory: ./agentarea-platform
        run: |
          uv run pytest tests/integration/repositories/ -v --tb=short -x
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

      - name: Start Temporal dev server (SQLite)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          nohup "$HOME/.temporalio/bin/temporal" server start-dev \
            --ip 0.0.0.0 --headless \
            --db-filename /tmp/temporal-ci.db \
            --log-level error > /tmp/temporal-dev.log 2>&1 &
          for _ in $(seq 1 30); do
            if "$HOME/.temporalio/bin/temporal" operator cluster health \
                --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal dev server is healthy"; exit 0
            fi
            sleep 1
          done
          echo "Temporal dev server failed to start:" >&2; cat /tmp/temporal-dev.log >&2; exit 1

      - name: Smoke test - Temporal workflows
        working-directory: ./agentarea-platform
        run: |
          uv run pytest tests/integration/test_temporal_workflow.py -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          TEMPORAL_HOST: ${{ env.TEMPORAL_HOST }}

  # Full integration tests with all services
  integration-tests:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentarea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        working-directory: ./agentarea-platform
        run: uv sync --all-extras --group dev

      - name: Run database migrations
        working-directory: ./agentarea-platform
        run: |
          cd apps/api
          uv run --package agentarea-api agentarea-api migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start Temporal dev server (SQLite)
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          nohup "$HOME/.temporalio/bin/temporal" server start-dev \
            --ip 0.0.0.0 --headless \
            --db-filename /tmp/temporal-ci.db \
            --log-level error > /tmp/temporal-dev.log 2>&1 &
          for _ in $(seq 1 30); do
            if "$HOME/.temporalio/bin/temporal" operator cluster health \
                --address localhost:7233 >/dev/null 2>&1; then
              echo "Temporal dev server is healthy"; exit 0
            fi
            sleep 1
          done
          echo "Temporal dev server failed to start:" >&2; cat /tmp/temporal-dev.log >&2; exit 1

      - name: Run integration tests
        working-directory: ./agentarea-platform
        run: |
          uv run pytest tests/integration/ -v --tb=short \
            --ignore=tests/integration/test_full_workflow_with_real_llm.py \
            --ignore=tests/integration/test_real_llm_with_mocked_db.py \
            --ignore=tests/integration/test_mcp_real_integration.py \
            -m "not slow"
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          TEMPORAL_HOST: ${{ env.TEMPORAL_HOST }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: agentarea-platform/test-results.xml

  # Module-specific integration tests (run when specific modules change)
  module-tests:
    runs-on: ubuntu-latest
    needs: smoke-test
    strategy:
      matrix:
        module:
          - name: tasks
            path: agentarea-platform/libs/agentarea-tasks
            test_path: tests/integration/test_task_event_integration.py
          - name: agents
            path: agentarea-platform/libs/agentarea-agents
            test_path: tests/integration/test_a2a_real_integration.py
    steps:
      - uses: actions/checkout@v4

      - name: Check if module changed
        id: changed
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            module:
              - '${{ matrix.module.path }}/**'
              - '${{ matrix.module.test_path }}'

      - name: Set up Python
        if: steps.changed.outputs.module == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.changed.outputs.module == 'true'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Run module integration tests
        if: steps.changed.outputs.module == 'true'
        working-directory: ./agentarea-platform
        run: |
          uv sync --all-extras --group dev
          uv run pytest ${{ matrix.module.test_path }} -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}

  # OpenAPI contract + stateful CRUD fuzz against the FULL live stack (the PR's
  # API image + Kratos + Postgres + Temporal, via docker compose). This is the
  # only layer that catches persistence/constraint 5xx on real create paths
  # (e.g. the MCP slug NOT NULL 500 that mocked/hermetic suites missed).
  api-fuzz:
    name: OpenAPI fuzz (live stack)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        # .env.example is a complete, ready-to-run config (signing JWKS +
        # encryption key filled). The compose stack reads it via the default
        # `.env` lookup.
        run: cp .env.example .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image from PR source
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./agentarea-platform
          file: ./agentarea-platform/apps/api/Dockerfile
          # Tag exactly what compose expects so `pull_policy: never` (set in the
          # CI overlay) resolves to this freshly built image.
          tags: agentarea/agentarea-api:latest
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start stack (db, kratos, temporal, api)
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml \
            up -d app kratos temporal

      - name: Wait for API + Kratos to be ready
        run: |
          ok=""
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health >/dev/null \
               && curl -sf http://localhost:4434/admin/health/ready >/dev/null \
               && curl -sf http://localhost:4433/health/ready >/dev/null; then
              echo "stack healthy"; ok=1; break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::stack did not become healthy in time"
            docker compose -f docker-compose.yaml -f docker-compose.ci.yaml ps
            docker compose -f docker-compose.yaml -f docker-compose.ci.yaml \
              logs --tail=150 app app_migrations kratos db
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"

      - name: Cache uv
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}

      - name: Install test deps
        working-directory: ./agentarea-platform
        run: uv sync --all-extras --group dev

      - name: Run OpenAPI + stateful fuzz
        working-directory: ./agentarea-platform
        env:
          API_URL: http://localhost:8000
          KRATOS_ADMIN_URL: http://localhost:4434
          KRATOS_PUBLIC_URL: http://localhost:4433
        run: |
          uv run python -m pytest \
            tests/e2e/api/test_openapi_fuzz.py \
            tests/e2e/api/test_stateful_fuzz.py \
            -m "" -p no:cacheprovider -o addopts="" --tb=short

      - name: Stack logs (always)
        if: always()
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml \
            logs --tail=300 app || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml \
            down -v || true
