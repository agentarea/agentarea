[pytest]
addopts = -v -s --tb=short --import-mode=importlib
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
norecursedirs = libs .git .venv
env =
    WORKFLOW__TEMPORAL_SERVER_URL=localhost:7233
    WORKFLOW__TEMPORAL_NAMESPACE=default
    WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
    KRATOS_ISSUER=http://localhost:4433
    KRATOS_AUDIENCE=agentarea
    KRATOS_JWKS_B64=eyJrZXlzIjogW119
markers =
    integration: marks tests as integration tests (requiring real services)
    slow: marks tests as slow running
    requires_llm: needs a real LLM endpoint (Ollama/OpenRouter)
    requires_docker: needs Docker / live MCP containers
    requires_server: needs a running API server
    requires_s3: needs object storage (rustfs/S3)
    perf: performance/concurrency stress test (timing-sensitive, flaky in CI)
