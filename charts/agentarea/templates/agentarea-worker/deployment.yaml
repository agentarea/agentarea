{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentarea.fullname" . }}-worker
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    {{- with .Values.global.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.global.extraSelectorLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/env-configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      {{- with .Values.global.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.worker.extraInitContainers }}
      initContainers:
      {{- toYaml .Values.server.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.global.image.registry }}{{ if .Values.global.image.registry }}/{{ end }}{{ .Values.worker.image.repository }}:{{ default .Chart.AppVersion .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.global.security.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "agentarea.database.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.database.envs" . | nindent 12 }}
            {{- include "agentarea.redis.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.redis.envs" . | nindent 12 }}
            {{- include "agentarea.redis.urlEnv" . | nindent 12 }}
            {{- include "agentarea.storage.envs" . | nindent 12 }}
            {{- include "agentarea.storage.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.application.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.temporal.envs" . | nindent 12 }}
            {{- include "agentarea.worker.envs" . | nindent 12 }}
            {{- if .Values.keto.enabled }}
            - name: ACCESS_CONTROL_BACKEND
              value: "keto"
            - name: ACCESS_CONTROL_KETO_READ_URL
              value: "http://{{ include "agentarea.fullname" . }}-keto-read:4466"
            - name: ACCESS_CONTROL_KETO_WRITE_URL
              value: "http://{{ include "agentarea.fullname" . }}-keto-write:4467"
            {{- end }}
            {{- if .Values.openfga.enabled }}
            - name: ACCESS_CONTROL_BACKEND
              value: "openfga"
            - name: ACCESS_CONTROL_OPENFGA_API_URL
              value: "http://{{ include "agentarea.fullname" . }}-openfga:{{ .Values.openfga.service.httpPort | default 8080 }}"
            - name: ACCESS_CONTROL_OPENFGA_STORE_ID
              value: {{ .Values.openfga.accessControl.storeId | quote }}
            - name: ACCESS_CONTROL_OPENFGA_AUTHORIZATION_MODEL_ID
              value: {{ .Values.openfga.accessControl.authorizationModelId | quote }}
            - name: ACCESS_CONTROL_OPENFGA_AUTO_BOOTSTRAP
              value: {{ .Values.openfga.accessControl.autoBootstrap | quote }}
            - name: ACCESS_CONTROL_OPENFGA_AUTO_APPLY_MODEL
              value: {{ .Values.openfga.accessControl.autoApplyModel | quote }}
            - name: ACCESS_CONTROL_OPENFGA_STORE_NAME
              value: {{ .Values.openfga.accessControl.storeName | default "agentarea" | quote }}
            - name: ACCESS_CONTROL_OPENFGA_MODEL_PATH
              value: "/etc/agentarea/openfga/authorization-model.json"
            {{- end }}
            {{- if or .Values.worker.envVars .Values.global.envVars }}
            {{- $workerEnv := default dict .Values.worker.envVars -}}
            {{- $globalEnv := default dict .Values.global.envVars -}}
            {{- range $k, $v := mergeOverwrite $workerEnv $globalEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.worker.secrets }}
            {{- $secretName := ( .Values.worker.secretsName | default (printf "%s-worker-secrets" .Release.Name) ) }}
            {{- range $k, $v := .Values.worker.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $k }}
            {{- end }}
            {{- end }}
            {{- if .Values.worker.extraEnv }}
            {{- toYaml .Values.worker.extraEnv | nindent 12 }}
            {{- end }}
          {{- if or .Values.worker.resources .Values.global.workloads.resources.mainContainer }}
          resources:
            {{- if .Values.worker.resources }}
            {{- toYaml .Values.worker.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.limit }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.limit }}
            requests:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.request }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.request }}
            {{- end }}
          {{- end }}
          {{- if or .Values.openfga.enabled .Values.worker.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.openfga.enabled }}
            - name: openfga-authorization-model
              mountPath: /etc/agentarea/openfga
              readOnly: true
            {{- end }}
            {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.openfga.enabled .Values.worker.extraVolumes }}
      volumes:
        {{- if .Values.openfga.enabled }}
        - name: openfga-authorization-model
          configMap:
            name: {{ include "agentarea.fullname" . }}-openfga-authorization-model
        {{- end }}
        {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.worker.extraContainers }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
