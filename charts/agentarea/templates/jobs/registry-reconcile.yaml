{{- if .Values.registryReconcile.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentarea.fullname" . }}-registry-reconcile
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry-reconcile
    {{- with .Values.global.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    # Standard resource (not a Helm hook) that waits for the database, mirroring
    # the db-migration Job. ttlSecondsAfterFinished clears it so a later upgrade
    # recreates and re-runs it (reconcile is idempotent). Once the schema reaches
    # the migration head it also grants graph ownership of rows a migration
    # inserted by SQL. A deployment that disables it runs `agentarea-api
    # reconcile` its own way.
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: registry-reconcile
        {{- with .Values.global.extraSelectorLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      restartPolicy: Never
      {{- with .Values.global.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      initContainers:
        # Wait for the database (registries/items live in the platform DB).
        - name: wait-for-db
          image: {{ .Values.global.jobs.kube.images.busybox }}
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "agentarea.database.host" . }} {{ .Values.global.database.port }}; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: reconcile
          image: "{{ .Values.global.image.registry }}{{ if .Values.global.image.registry }}/{{ end }}{{ .Values.backend.image.repository }}:{{ default .Chart.AppVersion .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- with .Values.global.security.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          workingDir: /app/apps/api
          command:
            - agentarea-api
            - reconcile
            - --wait-for-schema
            - {{ .Values.global.database.migrations.initializationTimeout | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "agentarea.fullname" . }}-env-databasejobs
          env:
            # Database credentials
            - name: AGENTAREA_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.postgresql }}
                  key: username
            - name: AGENTAREA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.postgresql }}
                  key: password
            # Registry definitions consumed by `agentarea-api reconcile`
            # (JSON array; bound to the --registries-config option via envvar).
            - name: REGISTRIES_CONFIG
              value: {{ .Values.registryReconcile.registries | toJson | quote }}
            {{- /* The model is the API's to apply and its file is not mounted here, so
                   these two are set once, last, and dropped from every other source. */}}
            {{- $forced := list "AGENTAREA_AUTHZ_FGA_APPLY_MODEL" "AGENTAREA_AUTHZ_FGA_MODEL_PATH" }}
            {{- if .Values.openfga.enabled }}
            # The authorization graph, as the backend reaches it.
            - name: AGENTAREA_AUTHZ_BACKEND
              value: "openfga"
            - name: AGENTAREA_AUTHZ_FGA_URL
              value: "http://{{ include "agentarea.fullname" . }}-openfga:{{ .Values.openfga.service.httpPort | default 8080 }}"
            - name: AGENTAREA_AUTHZ_FGA_STORE_ID
              value: {{ .Values.openfga.accessControl.storeId | quote }}
            - name: AGENTAREA_AUTHZ_FGA_MODEL_ID
              value: {{ .Values.openfga.accessControl.authorizationModelId | quote }}
            - name: AGENTAREA_AUTHZ_FGA_BOOTSTRAP
              value: {{ .Values.openfga.accessControl.autoBootstrap | quote }}
            - name: AGENTAREA_AUTHZ_FGA_STORE_NAME
              value: {{ .Values.openfga.accessControl.storeName | default "agentarea" | quote }}
            {{- end }}
            {{- if or .Values.backend.envVars .Values.global.envVars }}
            {{- $backendEnv := deepCopy (default dict .Values.backend.envVars) -}}
            {{- $globalEnv := default dict .Values.global.envVars -}}
            {{- range $k, $v := mergeOverwrite $backendEnv $globalEnv }}
            {{- if not (has $k $forced) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.backend.secrets }}
            {{- $secretName := ( .Values.backend.secretsName | default (printf "%s-backend-secrets" .Release.Name) ) }}
            {{- range $k, $v := .Values.backend.secrets }}
            {{- if not (has $k $forced) }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $k }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $extraEnv := list }}
            {{- range .Values.backend.extraEnv }}
            {{- if not (has .name $forced) }}
            {{- $extraEnv = append $extraEnv . }}
            {{- end }}
            {{- end }}
            {{- if $extraEnv }}
            {{- toYaml $extraEnv | nindent 12 }}
            {{- end }}
            - name: AGENTAREA_AUTHZ_FGA_APPLY_MODEL
              value: "false"
          {{- if or .Values.global.jobs.kube.resources .Values.backend.resources }}
          resources:
            {{- if .Values.global.jobs.kube.resources }}
            {{- toYaml .Values.global.jobs.kube.resources | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.backend.resources | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  backoffLimit: 3
{{- end }}
