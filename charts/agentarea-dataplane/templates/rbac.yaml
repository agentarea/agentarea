apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dataplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
---
# What the Kubernetes backend does to an instance: a Deployment, its Service,
# ConfigMap and Secret, and pod reads for status, logs and usage. Only in the
# workloads namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dataplane.fullname" . }}
  namespace: {{ .Values.workloads.namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets, services, pods]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dataplane.fullname" . }}
  namespace: {{ .Values.workloads.namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dataplane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dataplane.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# The backend checks at start that its namespace exists. Read only: it never
# creates one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dataplane.fullname" . }}-namespaces
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dataplane.fullname" . }}-namespaces
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dataplane.fullname" . }}-namespaces
subjects:
  - kind: ServiceAccount
    name: {{ include "dataplane.fullname" . }}
    namespace: {{ .Release.Namespace }}
