---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart sandbox-egress
  ansible.builtin.systemd:
    name: sandbox-egress
    state: restarted

- name: Restart sandbox-executor
  ansible.builtin.systemd:
    name: "{{ sandbox_executor_name }}"
    state: restarted
  when: sandbox_executor_enabled | bool

- name: Restart opensandbox-input-firewall
  ansible.builtin.systemd:
    name: opensandbox-input-firewall
    state: restarted
  when: not ansible_check_mode

- name: Restart opensandbox
  ansible.builtin.systemd:
    name: opensandbox
    state: restarted
    daemon_reload: true
  when:
    - opensandbox_enabled | bool
    - not ansible_check_mode

- name: Restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted

- name: Restart mcp-dataplane
  ansible.builtin.systemd:
    name: mcp-dataplane
    state: restarted
    daemon_reload: true
  when:
    - sandbox_mcp_dataplane_enabled | bool
    - not ansible_check_mode

# Restarts the proxy container, not the compose stack it belongs to: this leaves
# opensandbox-server up, and this host serves production sandboxes.
#
# A `caddy reload` is not enough and is actively misleading here. The Caddyfile
# is bind-mounted as a single FILE, so the container is pinned to the inode it
# started with; Ansible writes atomically by rename, which gives the host a new
# inode and orphans the container's view. Caddy then reloads the file it can
# still see, reports "config is unchanged", and exits zero while the change has
# not landed. Only re-creating the mount picks it up.
- name: Restart caddy
  ansible.builtin.command: docker restart opensandbox-caddy
  changed_when: true
  when: not ansible_check_mode

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted

- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
