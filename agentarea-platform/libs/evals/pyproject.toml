[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-evals"
version = "0.1.0"
description = "Run outcomes, feedback, evaluation suites and traffic experiments for AgentArea agents"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "agentarea-agents",
    "agentarea-tasks",
    "pydantic>=2.4.2",
]

[tool.uv.sources]
agentarea-common = { workspace = true }
agentarea-agents = { workspace = true }
agentarea-tasks = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agentarea_evals"]
