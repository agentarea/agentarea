# Local reconcile manifest — points at the generated catalog files on disk
# instead of the S3 URLs, so the agents + bundles catalog can be reconciled into
# a local stack before anything is published. Paths are container-side (the
# files are copied to /tmp/catalog before reconcile). Type auto-detected.
#
#   docker cp data/catalog agentarea-backend:/tmp/catalog
#   docker cp data/registry-sources.local.yaml agentarea-backend:/tmp/rs.local.yaml
#   docker exec agentarea-backend /app/.venv/bin/agentarea-api reconcile \
#       --config-file /tmp/rs.local.yaml

- name: agents-catalog
  source_url: /tmp/catalog/agents.json
  description: Built-in agent catalog (local)

- name: bundles-catalog
  source_url: /tmp/catalog/bundles.json
  description: Built-in bundle catalog (local)
