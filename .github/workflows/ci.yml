name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-docker:
        description: 'Skip Docker build jobs (for validation-only runs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Supersede in-flight runs for the same ref on PRs; never cancel main/tag/release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_CACHE_DIR: ~/.cache/uv

jobs:
  changes:
    runs-on: ubuntu-latest
    # Skip path filtering when called as reusable workflow (run everything)
    if: github.event_name != 'workflow_call'
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      platform_libs: ${{ steps.filter.outputs.platform_libs }}
      api: ${{ steps.filter.outputs.api }}
      worker: ${{ steps.filter.outputs.worker }}
      webapp: ${{ steps.filter.outputs.webapp }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp_manager: ${{ steps.filter.outputs.mcp_manager }}
      operator: ${{ steps.filter.outputs.operator }}
      events: ${{ steps.filter.outputs.events }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
          filters: |
            platform:
              - 'agentarea-platform/**'
            platform_libs:
              - 'agentarea-platform/libs/**'
            api:
              - 'agentarea-platform/apps/api/**'
            worker:
              - 'agentarea-platform/apps/worker/**'
            webapp:
              - 'agentarea-webapp/**'
            cli:
              - 'agentarea-cli/**'
            mcp_manager:
              - 'agentarea-mcp-manager/**'
            mcp_runner:
              - 'agentarea-mcp-manager/Dockerfile.runner'
              - 'agentarea-mcp-manager/cmd/activation-service/**'
            operator:
              - 'agentarea-operator/**'
            events:
              - 'agentarea-event-service/**'

  version-check:
    runs-on: ubuntu-latest
    # Only run when Docker builds would run: on main, release PRs, or when called as reusable workflow
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      github.event_name == 'workflow_call'
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify version synchronization
        run: bash scripts/verify-version-sync.sh

  platform-lint:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --all-extras --group dev --group lint

      - name: Run ruff check
        working-directory: agentarea-platform
        run: uv run ruff check .

      - name: Run ruff format check
        working-directory: agentarea-platform
        run: uv run ruff format --check .

      - name: Run pyright
        working-directory: agentarea-platform
        run: uv run pyright

  platform-test:
    runs-on: ubuntu-latest
    needs: [changes, platform-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && needs.platform-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: |
          uv sync --group dev

      # Single source of truth: `make test` == what developers run locally.
      # Covers unit + functional + apps/api + libs/common (OSS/Enterprise
      # extension contract) + libs/tasks + hermetic agent-workflow smoke
      # (agent created -> runs -> completes). No infra required.
      - name: Run tests
        working-directory: agentarea-platform
        run: make test

  platform-build:
    runs-on: ubuntu-latest
    needs: [changes, platform-test]
    # Always run when: called as reusable workflow, on main, on release PRs, or if platform changes detected
    if: |
      always() && !cancelled() && needs.platform-test.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true'
      )
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        working-directory: agentarea-platform
        run: uv build apps/${{ matrix.component }}

  # test:
