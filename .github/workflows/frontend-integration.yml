name: Frontend Integration

on:
  push:
    branches: [main]
    paths:
      - "agentarea-webapp/**"
      - ".github/workflows/frontend-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "agentarea-webapp/**"
      - ".github/workflows/frontend-integration.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('agentarea-webapp/pnpm-lock.yaml') }}

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      # Generated client matches openapi.json, elements-react builds, types
      # check, and the production build has no invalid-element errors.
      - name: Client drift, packages, type check, build
        run: pnpm -C agentarea-webapp run check:integration

  # Optional: Visual regression with Playwright
  visual-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: contains(github.event.pull_request.labels.*.name, 'visual-test')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build and start
        working-directory: agentarea-webapp
        run: |
          pnpm run build
          pnpm start &
          sleep 5

      - name: Run smoke test
        run: |
          curl -f http://localhost:3000 || exit 1
