groups:
  database:
    configVars:
      POSTGRES_HOST: '{{ include "agentarea.database.host" . }}'
      POSTGRES_PORT: '{{ .Values.global.database.port }}'
      POSTGRES_DB: '{{ .Values.global.database.name }}'
      POSTGRES_SSLMODE: '{{ .Values.global.database.sslMode }}'
    secrets:
      - name: POSTGRES_USER
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "username"
      - name: POSTGRES_PASSWORD
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "password"
    envExtras:
      - name: DATABASE_URL
        value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode={{ .Values.global.database.sslMode }}"

  redis:
    # REDIS_URL is emitted by the agentarea.redis.urlEnv helper
    # (templates/_redis-url.tpl) so it can support external providers via
    # global.redis.url or global.redis.existingSecret. Do NOT add REDIS_URL
    # back to envExtras here.
    configVars:
      REDIS_HOST: '{{ include "agentarea.redis.host" . }}'
      REDIS_PORT: '{{ .Values.global.redis.port }}'
    secrets:
      - name: REDIS_PASSWORD
        secretName: "{{ .Values.global.secrets.redis }}"
        key: "redis-password"

  storage:
    # Only include storage config when RustFS is enabled
    conditional: '{{ .Values.rustfs.enabled }}'
    configVars:
      AWS_REGION: '{{ .Values.global.storage.region }}'
      S3_BUCKET_NAME: '{{ .Values.global.storage.bucket }}'
      ARTIFACTS_BUCKET_NAME: '{{ .Values.global.storage.bucket }}'
      AWS_ENDPOINT_URL: 'http://{{ include "agentarea.rustfs.host" . }}:9000'
    secrets:
      - name: AWS_ACCESS_KEY_ID
        secretName: "{{ .Values.global.secrets.rustfs }}"
        key: "root-user"
      - name: AWS_SECRET_ACCESS_KEY
        secretName: "{{ .Values.global.secrets.rustfs }}"
        key: "root-password"

  temporal:
    configVars:
      WORKFLOW__TEMPORAL_SERVER_URL: '{{ include "agentarea.temporal.host" . }}:{{ .Values.global.temporal.port }}'
      WORKFLOW__TEMPORAL_NAMESPACE: '{{ .Values.global.temporal.namespace }}'
      WORKFLOW__TEMPORAL_TASK_QUEUE: '{{ .Values.global.temporal.taskQueue }}'

  temporalServer:
    configVars:
      DB: 'postgres12'
      DB_PORT: '5432'
      POSTGRES_SEEDS: '{{ include "agentarea.database.host" . }}'
      DBNAME: '{{ .Values.temporal.database.name | default "temporal" | quote }}'
      BIND_ON_IP: '0.0.0.0'
    secrets:
      - name: POSTGRES_USER
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "username"
      - name: POSTGRES_PWD
        secretName: "{{ .Values.global.secrets.postgresql }}"
        key: "password"

  frontend:
    configVars:
      PORT: '3000'
      NODE_ENV: 'production'
      API_URL: '{{ include "agentarea.backend.url" . }}'
      ORY_ADMIN_URL: '{{ include "agentarea.kratosAdminUrl" . }}'
      ORY_SDK_URL: '{{ include "agentarea.kratosPublicUrl" . }}'
      ORY_BROWSER_URL: '{{ include "agentarea.kratosPublicBrowserUrl" . }}'
      METRICS_ENABLED: '{{ .Values.global.monitoring.prometheus.enabled }}'
      HEALTH_CHECK_ENABLED: '{{ .Values.global.monitoring.health.enabled }}'

  backend:
    configVars:
      PORT: '8000'
      LOG_LEVEL: 'info'
      MCP_MANAGER_URL: 'http://{{ include "agentarea.fullname" . }}-mcp-manager:{{ .Values.mcpManager.service.port }}'
      MCP_CLIENT_TIMEOUT: '30'
      API_HOST: '{{ .Values.global.api.host }}'
      API_PORT: '{{ .Values.global.api.port }}'
      API_BASE_URL: '{{ include "agentarea.backend.apiUrl" . }}'
      API_AUTH_ENABLED: '{{ .Values.global.api.auth.enabled }}'
      PUBLIC_S3_ENDPOINT: '{{ .Values.global.storage.publicEndpoint }}'
      METRICS_ENABLED: '{{ .Values.global.monitoring.prometheus.enabled }}'
      METRICS_PORT: '{{ .Values.global.monitoring.prometheus.port }}'
      HEALTH_CHECK_ENABLED: '{{ .Values.global.monitoring.health.enabled }}'
      HEALTH_CHECK_PORT: '{{ .Values.global.monitoring.health.port }}'
      KRATOS_ISSUER: '{{ .Values.kratos.jwt.issuer }}'
      KRATOS_AUDIENCE: '{{ .Values.kratos.jwt.audience }}'
    secrets:
      - name: API_AUTH_HEADER_NAME
        value: "{{ .Values.global.api.auth.headerName }}"
      - name: API_AUTH_HEADER_VALUE
        secretName: "{{ .Values.global.secrets.application }}"
        key: "api-auth-header-value"
      - name: KRATOS_JWKS_B64
        conditional: '{{ .Values.kratos.enabled }}'
        secretName: '{{ default (printf "%s-kratos-jwks" .Release.Name) .Values.kratos.secretName | quote }}'
        key: jwks_b64

  mcpManager:
    configVars:
      LOG_LEVEL: 'INFO'
      CORE_API_URL: 'http://{{ include "agentarea.fullname" . }}-backend:8000'
      SERVER_HOST: '0.0.0.0'
      SERVER_PORT: '80'
      BACKEND_TYPE: 'kubernetes'
      KUBERNETES_ENABLED: 'true'
      KUBERNETES_NAMESPACE: '{{ .Release.Namespace }}'
      KUBERNETES_DOMAIN: '{{ .Values.mcpManager.domain | default "mcp.local" }}'
      KUBERNETES_GATEWAY_NAME: '{{ .Values.mcpManager.gateway.name | default "envoy-gateway" }}'
      KUBERNETES_GATEWAY_NAMESPACE: '{{ .Values.mcpManager.gateway.namespace | default "envoy-gateway-system" }}'
      KUBERNETES_RUNTIME_CLASS: '{{ .Values.mcpManager.runtimeClass | default "" }}'
      KUBERNETES_POD_SERVICE_ACCOUNT_NAME: '{{ include "agentarea.mcpRuntimeServiceAccountName" . }}'
      KUBERNETES_SECURITY_RUN_AS_NON_ROOT: 'true'
      KUBERNETES_SECURITY_READ_ONLY_ROOT_FS: 'true'
      KUBERNETES_DEFAULT_CPU_REQUEST: '100m'
      KUBERNETES_DEFAULT_CPU_LIMIT: '500m'
      KUBERNETES_DEFAULT_MEMORY_REQUEST: '128Mi'
      KUBERNETES_DEFAULT_MEMORY_LIMIT: '512Mi'
      MCP_FEATURES_ENABLED: '{{ join "," .Values.mcpManager.features.enabled }}'

  temporalUi:
    configVars:
      TEMPORAL_ADDRESS: '{{ include "agentarea.fullname" . }}-temporal:7233'
      TEMPORAL_CORS_ORIGINS: 'http://localhost:3000'

  worker:
    configVars:
      WORKFLOW__USE_WORKFLOW_EXECUTION: 'true'
      WORKFLOW__WORKFLOW_ENGINE: 'temporal'
      WORKFLOW__TEMPORAL_MAX_CONCURRENT_ACTIVITIES: '10'
      WORKFLOW__TEMPORAL_MAX_CONCURRENT_WORKFLOWS: '5'
      TASK__ENABLE_DYNAMIC_ACTIVITY_DISCOVERY: 'true'
      DEBUG: 'false'
      ENVIRONMENT: 'production'
      MCP_MANAGER_URL: 'http://{{ include "agentarea.fullname" . }}-mcp-manager:{{ .Values.mcpManager.service.port }}'

  application:
    secrets:
      - name: SECRET_MANAGER_ENCRYPTION_KEY
        secretName: '{{ .Values.global.secrets.application }}'
        key: 'encryption-key'

  databaseJobs:
    configVars:
      POSTGRES_HOST: '{{ include "agentarea.database.host" . }}'
      POSTGRES_PORT: '{{ .Values.global.database.port }}'
      POSTGRES_DB: '{{ .Values.global.database.name }}'
      POSTGRES_SSLMODE: '{{ .Values.global.database.sslMode }}'
    secrets:
      - name: POSTGRES_USER
        secretName: '{{ .Values.global.secrets.postgresql }}'
        key: 'username'
      - name: POSTGRES_PASSWORD
        secretName: '{{ .Values.global.secrets.postgresql }}'
        key: 'password'
    envExtras:
      - name: DATABASE_URL
        value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)?sslmode={{ .Values.global.database.sslMode }}"
