{{- if and .Values.kratos.enabled (not .Values.kratos.generateJwks) }}
{{- $privateJwks := required "kratos.jwt.jwks_b64 is required when kratos.generateJwks=false" .Values.kratos.jwt.jwks_b64 -}}
{{- $publicJwks := required "kratos.jwt.jwks_public_b64 is required when kratos.generateJwks=false" .Values.kratos.jwt.jwks_public_b64 -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-kratos-jwks" .Release.Name) .Values.kratos.secretName }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: kratos
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  jwks.json: {{ $privateJwks }}
  jwks_public.json: {{ $publicJwks }}
  jwks_b64: {{ $publicJwks }}
{{- end }}
