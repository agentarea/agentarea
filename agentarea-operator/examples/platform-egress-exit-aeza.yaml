# Example: an exit every workspace may bind, leaving through the egress proxy's
# "aeza" hop (an ssh -D tunnel to a host abroad).
# kubectl apply -f platform-egress-exit-aeza.yaml
apiVersion: agentarea.io/v1alpha1
kind: PlatformEgressExit
metadata:
  name: aeza-se
  namespace: agentarea
spec:
  name: "aeza-se"
  description: "Sweden, through the Aeza tunnel"
  via: aeza
  remoteDns: true
