[project]
name = "agentarea-operator"
version = "0.0.12"
description = "K8s operator for managing AgentArea LLM provider configs via CRDs"
requires-python = ">=3.12"
dependencies = [
    "kopf>=1.37",
    "kubernetes>=29.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "httpx>=0.27",
    "idna>=3.15",
    "pyyaml>=6.0",
    "urllib3>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["handler.py", "registry_sync.py"]

[tool.hatch.build.targets.sdist]
include = ["handler.py", "registry_sync.py", "crds", "tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
