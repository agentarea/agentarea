name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      chart_bump_type:
        description: 'Chart version bump type'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.2

      - name: Bump chart version
        id: version
        run: |
          # Determine bump type: manual dispatch uses input, tag push always bumps patch
          BUMP_TYPE="${{ github.event.inputs.chart_bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi

          python3 scripts/bump-chart-version.py "$BUMP_TYPE"

          CHART_VERSION=$(grep "^version:" charts/agentarea/Chart.yaml | awk '{print $2}')
          APP_VERSION=$(cat VERSION | tr -d '[:space:]')

          # Verify appVersion in Chart.yaml matches VERSION file
          CHART_APP_VERSION=$(grep "^appVersion:" charts/agentarea/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "$CHART_APP_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Chart appVersion ($CHART_APP_VERSION) does not match VERSION file ($APP_VERSION)"
            echo "Please run 'python3 scripts/update-appversion.py' to sync"
            exit 1
          fi

          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Release: chart v${CHART_VERSION}, app v${APP_VERSION}"

      - name: Commit bumped chart version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/agentarea/Chart.yaml
          git commit -m "chore(helm): bump chart version to ${{ steps.version.outputs.chart_version }}"
          git push origin HEAD:main

      - name: Add repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Build chart dependencies
        run: |
          helm dependency build charts/agentarea

      - name: Lint chart
        run: |
          helm lint charts/agentarea

      - name: Generate chart documentation
        run: |
          HELM_DOCS_VERSION=1.14.2
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin helm-docs
          helm-docs --chart-search-root charts/agentarea --sort-values-order file

      - name: Verify chart documentation up-to-date
        run: |
          if ! git diff --quiet charts/agentarea/README.md; then
            echo "README.md is not up-to-date; run helm-docs and commit"
            exit 1
          fi

      - name: Package chart
        run: |
          mkdir -p dist
          helm package charts/agentarea --destination dist

          ls -la dist

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HELM_GH_APP_ID }}
          private-key: ${{ secrets.HELM_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: helm-charts

      - name: Checkout Helm Charts Repo
        uses: actions/checkout@v4
        with:
          repository: agentarea/helm-charts
          path: helm-charts-repo
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update Helm Repo
        run: |
          cd helm-charts-repo

          # Copy new chart package
          cp ../dist/*.tgz .

          if [ -f index.yaml ]; then
            helm repo index . --url https://agentarea.github.io/helm-charts --merge index.yaml
          else
            helm repo index . --url https://agentarea.github.io/helm-charts
          fi

          # Configure git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Commit and push
          git add .
          git commit -m "Release chart agentarea-${{ steps.version.outputs.chart_version }}"
          git push
