name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip-docker:
        description: 'Skip Docker build jobs (for validation-only runs)'
        required: false
        type: boolean
        default: false
  # A push whose event GitHub never delivered builds nothing, and the next push builds
  # only what that one changed (the paths filter compares against the previous commit).
  # Dispatch on main with rebuild-images to build and push every image for its HEAD;
  # on any other ref it builds every image without pushing (Dockerfile changes on a PR).
  workflow_dispatch:
    inputs:
      rebuild-images:
        description: 'Build every image for this ref (pushed only on main)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Supersede in-flight runs for the same ref on PRs; never cancel main/tag/release runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # Skip path filtering when called as reusable workflow (run everything)
    if: github.event_name != 'workflow_call'
    outputs:
      go: ${{ steps.filter.outputs.go }}
      webapp: ${{ steps.filter.outputs.webapp }}
      cli: ${{ steps.filter.outputs.cli }}
      mcp_runner: ${{ steps.filter.outputs.mcp_runner }}
      mcp_base: ${{ steps.filter.outputs.mcp_base }}
      mcp_apps: ${{ steps.filter.outputs.mcp_apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
          # 'VERSION' changes only in a release commit. It is in every filter that gates an
          # image, so that commit builds each component release-publish.yaml retags; a
          # component whose own files the bump does not touch (mcp-base) was skipped and
          # the retag found no X.Y.Z-<sha> source image (v0.0.16).
          filters: |
            go:
              - 'agentarea-go/**'
              # openapi-fresh checks the generated handlers against this spec.
              - 'agentarea-webapp/src/api/openapi.json'
              - 'VERSION'
            webapp:
              - 'agentarea-webapp/**'
              - 'VERSION'
            cli:
              - 'agentarea-cli/**'
            mcp_runner:
              - 'agentarea-go/Dockerfile.runner'
              - 'agentarea-go/sandbox-runtime/**'
              - 'agentarea-go/cmd/activation-service/**'
              - 'agentarea-go/cmd/exec-supervisor/**'
              - 'agentarea-go/internal/modules/sandbox/backends/{activationauth,publishedsecrets,sandboxruntime,workspace}/**'
              - 'agentarea-go/internal/modules/sandbox/supervisor/**'
              - 'agentarea-go/go.mod'
              - 'agentarea-go/go.sum'
              - 'VERSION'
            mcp_base:
              - 'mcp-servers/mcp-base/**'
              - 'VERSION'
            mcp_apps:
              - 'mcp-servers/mcp-apps-kit/**'
              - 'mcp-servers/mcp-apps-tasks/**'
              - 'mcp-servers/mcp-apps-crm/**'
              - 'VERSION'

  version-check:
    runs-on: ubuntu-latest
    # Only run when Docker builds would run: on main, release PRs, a dispatch (rebuild-images
    # off main builds without pushing), or when called as reusable workflow
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    steps:
      - uses: actions/checkout@v7
      
      - name: Verify version synchronization
        run: bash scripts/verify-version-sync.sh

  # Regression check for #481: scripts/lib/secrets.sh must keep the JWKS file
  # container-readable and its config/auth ancestor host-private.
  jwks-perms-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JWKS/config/auth permissions
        run: make check-jwks-perms

  env-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PyYAML
        run: pip install pyyaml

      # Cross-cutting (Python, Go, TypeScript, the chart), so it is not gated on
      # the per-language change filters.
      - name: Check environment variable naming
        run: python scripts/check_env_naming.py

  go-check:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if Go changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.go == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agentarea-go/go.mod
          cache-dependency-path: agentarea-go/go.sum

      # Must match GOLANGCI_LINT_VERSION in agentarea-go/Makefile.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true

      - name: Build, vet, test, lint, architecture checks
        run: make -C agentarea-go check

  docker-platform:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.go == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check, go-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: platform
      context: agentarea-go
      dockerfile: agentarea-go/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-frontend:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.webapp == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check, webapp-lint, webapp-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: frontend
      context: agentarea-webapp
      dockerfile: agentarea-webapp/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-agentarea-mcp-runner:
    # Build the mutable runner used by package-install=allowed pools.
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_runner == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check, go-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-runner
      image-name: agentarea/agentarea-mcp-runner
      context: agentarea-go
      dockerfile: agentarea-go/Dockerfile.runner
      build-args: |
        AGENTAREA_SANDBOX_MANAGED_ENV=mutable
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-runner-locked:
    # Build the immutable runner used by package-install=locked pools.
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_runner == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check, go-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-runner-locked
      image-name: agentarea/agentarea-mcp-runner-locked
      context: agentarea-go
      dockerfile: agentarea-go/Dockerfile.runner
      build-args: |
        AGENTAREA_SANDBOX_MANAGED_ENV=immutable
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-base:
    # The runtime image the manager runs `command` connections on (AGENTAREA_MCP_BASE_IMAGE).
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_base == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-base
      image-name: agentarea/agentarea-mcp-base
      context: mcp-servers/mcp-base
      dockerfile: mcp-servers/mcp-base/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-apps:
    # MCP App images AgentArea runs as docker-type connections with instance storage.
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_apps == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker ||
      inputs.rebuild-images
    needs: [changes, version-check]
    strategy:
      fail-fast: false
      matrix:
        app: [tasks, crm]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-apps-${{ matrix.app }}
      image-name: agentarea/agentarea-mcp-apps-${{ matrix.app }}
      context: mcp-servers
      dockerfile: mcp-servers/mcp-apps-${{ matrix.app }}/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  webapp-lint:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm -C agentarea-webapp run lint

  webapp-build:
    runs-on: ubuntu-latest
    needs: [changes, webapp-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && needs.webapp-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm -C agentarea-webapp run check:build

  webapp-test:
    runs-on: ubuntu-latest
    needs: [changes, webapp-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && needs.webapp-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      # vitest.config.ts scopes `include` to src/**, which already excludes the
      # vendored packages/elements-react and packages/nextjs (upstream Ory code).
      - name: Run unit tests
        run: pnpm -C agentarea-webapp run test

  cli-test:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if cli changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.cli == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-cli/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-cli
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm -C agentarea-cli run check

  # The pack mode that builds package images lives in the mcp-base image, so
  # its tests run against the image's own pinned requirements.
  mcp-base-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.mcp_base == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"

      - name: Run tests
        working-directory: mcp-servers/mcp-base
        run: uv run --no-project --python 3.14 --with-requirements requirements.txt --with pytest python -m pytest -q tests

  # Migration safety gate: the migration sets apply to a fresh database, and every
  # suite whose rules only SQL enforces (unique constraints, RESTRICT foreign
  # keys, triggers, partial indexes) runs against the migrated schema. Without
  # AGENTAREA_DB_TEST_URL those suites skip, so go-check alone never runs them.
  go-db:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.go == 'true'
      )
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentarea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      AGENTAREA_DB_TEST_URL: postgres://postgres:postgres@localhost:5432/agentarea_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agentarea-go/go.mod
          cache-dependency-path: agentarea-go/go.sum

      - name: Migrations + schema-backed suites
        run: make -C agentarea-go check-db

  # Tells agentarea-enterprise which images this run published. It pins them in its
  # oss-base.json and builds the enterprise overlay from exactly these tags.
  notify-enterprise:
    runs-on: ubuntu-latest
    needs: [docker-platform]
    if: |
      always() && github.ref == 'refs/heads/main' && !inputs.skip-docker &&
      contains(needs.*.result, 'success')
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Generate GitHub App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.HELM_GH_APP_ID }}
          private-key: ${{ secrets.HELM_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agentarea-enterprise

      - name: Dispatch oss-images-published
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PLATFORM: ${{ needs.docker-platform.result }}
        run: |
          set -euo pipefail
          components=""
          [ "$PLATFORM" != "success" ] || components="$components platform"
          version="$(tr -d '\n' < VERSION)"
          echo "dispatching ${version}-${GITHUB_SHA:0:7}:${components}"
          gh api "repos/${{ github.repository_owner }}/agentarea-enterprise/dispatches" \
            -f event_type=oss-images-published \
            -f "client_payload[version]=${version}" \
            -f "client_payload[sha]=${GITHUB_SHA:0:7}" \
            -f "client_payload[components]=${components# }"

  # Single required status check for branch protection. Monorepo path filters
  # skip irrelevant jobs (they report "skipped", not "failure"), so a per-job
  # required check is unworkable; this aggregator is the one check to require.
  ci-required:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - version-check
      - jwks-perms-check
      - env-naming
      - go-check
      - go-db
      - webapp-lint
      - webapp-build
      - webapp-test
      - cli-test
      - mcp-base-test
      - docker-platform
      - docker-frontend
      - docker-agentarea-mcp-runner
      - docker-agentarea-mcp-runner-locked
      - docker-agentarea-mcp-base
      - docker-agentarea-mcp-apps
    steps:
      - name: Verify no required job failed
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required CI job did not pass (result: $r). See the job graph above."
              exit 1
            fi
          done
          echo "All required jobs passed or were legitimately skipped."
