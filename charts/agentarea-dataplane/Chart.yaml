apiVersion: v2
name: agentarea-dataplane
description: >-
  AgentArea data plane for an execution cluster: the mcp-manager data-plane API
  for MCP servers, optionally an OpenSandbox server for agent sandboxes, and the
  namespaces, admission and network policy the untrusted workloads of both are
  confined to.
type: application
version: 0.2.9
# The mcp-manager release this chart runs. Keep it equal to the control plane's:
# both halves of the data-plane API are one build.
appVersion: "0.1.1"
kubeVersion: ">=1.30.0-0"
home: https://github.com/agentarea/agentarea
icon: https://raw.githubusercontent.com/agentarea/agentarea/main/agentarea-webapp/public/Icon.png
sources:
  - https://github.com/agentarea/agentarea/tree/main/agentarea-mcp-manager
maintainers:
  - name: AgentArea
    url: https://github.com/agentarea
keywords:
  - mcp
  - gvisor
  - sandbox
  - opensandbox
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/images: |
    - name: agentarea/agentarea-mcp-base
      image: agentarea/agentarea-mcp-base:0.1.1
    - name: agentarea/agentarea-mcp-manager
      image: agentarea/agentarea-mcp-manager:0.1.1
    - name: opensandbox/controller
      image: opensandbox/controller:release-1.1.1@sha256:aca5cda09a0fbc5867e6028f8b6aaa60fdcd78ebee634f71a263d45d5f6c2bab
    - name: opensandbox/execd
      image: opensandbox/execd:release-1.1.1@sha256:cda2bc35409bbf57561599b316cafb899598f7dce671332e7ceda14eb1cfeded
    - name: opensandbox/server
      image: opensandbox/server:release-1.1.1@sha256:bcd5f264101262cebfa7e1ff9cd0424403e42f31a6596e4364cf90d8cb5c936b
    - name: pause
      image: registry.k8s.io/pause:3.10.2
dependencies:
  # Vendored from manifests/charts/{base,controller} at the OpenSandbox
  # release-1.1.1 tag (Apache-2.0), which publishes no chart repository. base
  # brings the BatchSandbox CRDs, controller the controller that turns them
  # into pods; one switch installs both.
  - name: base
    alias: opensandbox-base
    version: 1.1.1
    condition: opensandbox-controller.enabled
  - name: opensandbox-controller
    version: 1.1.1
    condition: opensandbox-controller.enabled
