{{/*
Centralized ConfigMap for all AgentArea services
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-database
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.database.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-databasejobs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.databaseJobs.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-redis
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.redis.configVars" . | nindent 2 }}
---
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-storage
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.storage.configVars" . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-temporal
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.temporal.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-temporalserver
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.temporalServer.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-backend
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.backend.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-worker
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.worker.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-frontend
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.frontend.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-temporalui
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.temporalUi.configVars" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-env-mcpmanager
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  {{- include "agentarea.mcpManager.configVars" . | nindent 2 }}
