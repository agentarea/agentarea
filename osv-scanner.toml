# Reviewed exceptions for the osv-scanner SCA scan (.github/workflows/sca-scan.yml,
# issue #502). Every entry needs a reason and an ignoreUntil review date; when
# that date passes, the finding reports again and must be re-triaged rather
# than silently re-added.
#
# Findings with an in-line fix were bumped directly instead of
# being listed here (click, google.golang.org/grpc, brace-expansion,
# @ai-sdk/provider-utils, protobufjs, qs, golang.org/x/crypto, joserfc,
# pyasn1, follow-redirects). Everything below has no fix yet, or none its
# consumers can take, so it is deferred rather than done as a drive-by.

[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2026-12-24
reason = "golang.org/x/crypto/openpgp is flagged unmaintained and unsafe-by-design with no version fix. Indirect dependency of agentarea-mcp-manager (pulled in transitively; openpgp is not imported directly). Re-check at review for an upstream fix or for whatever pulls it in dropping the dependency."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-28
reason = "deepmerge <=4.3.1 prototype poisoning in mergeObject(); no fixed release. In agentarea-webapp only through @svgr/plugin-svgo, a build-time SVG-to-component step that merges the repo's own svgo config; no runtime path merges untrusted objects with it. Re-check for a fixed deepmerge or an svgr release that drops it."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch <11.0.1 DoS through globparts amplification of a crafted pattern; fixed only in 11.0.1, a major its consumers do not accept (eslint, @eslint/*, eslint-plugin-* and eslint-config-next need 3.x; @typescript-eslint, typedoc, glob 10/13 need 9.x/10.x). Lint, docs and build tooling only, in agentarea-webapp and agentarea-cli, matching the repo's own config globs; no runtime path compiles an untrusted pattern. Re-check for 3.x/9.x/10.x backports or the consumers moving to 11."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-01-31
reason = "glob 9.0.0-<14.0.2 keeps traversing after an AbortSignal cancels the walk; fixed only in 14.0.2, a major its consumers do not accept. In agentarea-webapp through sucrase (tailwindcss 3, build-time) and @sentry/bundler-plugins (source-map upload at build); neither passes a signal nor walks a path a user supplies. Re-check for a backport, tailwind 4 dropping sucrase, or Sentry moving to glob 14."
