{{- if .Values.global.http.extraCaCerts }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentarea.fullname" . }}-extra-ca-certs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
data:
  ca-certificates.pem: |
    {{- .Values.global.http.extraCaCerts | nindent 4 }}
{{- end }}
