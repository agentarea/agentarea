# Default values for agentarea.
# This is a YAML-formatted file.
# Helm chart default values

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: &service-account-name "agentarea"  # YAML anchor for reuse

# Name overrides
nameOverride: ""
fullnameOverride: ""

# Global configuration shared across all components
global:
  # Edition and deployment info
  edition: "community"
  version: "0.0.3"
  
  # Cluster configuration
  cluster:
    type: "kubernetes"
    name: "agentarea"
  
  # Deployment environment
  deploymentEnv: "production"
  
  # Image configuration
  image:
    pullPolicy: IfNotPresent
    registry: ""  # Optional: Set custom registry (e.g., "myregistry.com", "ghcr.io")
    pullSecrets: []  # Optional: List of image pull secret names
    # - name: regcred

  # Service account (uses YAML anchor)
  serviceAccountName: *service-account-name

  # Secret references - users can create these secrets before installation
  # If secrets don't exist, they will be auto-generated
  secrets:
    # Main PostgreSQL database credentials
    postgresql: "agentarea-postgresql-secret"
    # Redis credentials
    redis: "agentarea-redis-secret"
    # RustFS/S3 credentials
    rustfs: "agentarea-rustfs-secret"
    # Application secrets (JWT, encryption keys)
    application: "agentarea-app-secrets"

  # Database configuration
  database:
    # Secret name where database credentials are stored
    secretName: "agentarea-postgresql-secret"
    # Database connection details
    host: ""  # Auto-set from postgresql.fullnameOverride if empty
    port: 5432
    name: "agentarea"  # Changed from 'database' to 'name' per v2.0
    # SSL configuration
    ssl: false
    sslMode: "prefer"
    # Connection pool settings
    maxConnections: 100
    connectionTimeout: 30s
    # Migration settings
    migrations:
      runAtStartup: true
      initializationTimeout: 300s

  # Redis client configuration consumed by AgentArea services.
  #
  # This block is AgentArea's OWN client config. It is NOT passed through to
  # the bundled Valkey subchart. Subchart values live under the top-level
  # `valkey:` key (see bottom of this file). The only cross-link is
  # `Chart.yaml` dependency `condition: redis.enabled`, which toggles the
  # bundled Valkey subchart on/off.
  #
  # Precedence for REDIS_URL injection (see templates/_redis-url.tpl):
  #   1. existingSecret set -> REDIS_URL from secretKeyRef (recommended for
  #      production: managed Redis URLs carry credentials).
  #   2. url set            -> REDIS_URL literal value (quick-start / dev).
  #   3. neither set        -> derived redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)
  #      using the in-cluster Valkey subchart (default behavior).
  redis:
    host: ""  # auto-derived from bundled Valkey service when empty
    port: 6379
    # External Redis URL (full connection string, e.g. rediss://user:pass@host:6379).
    # Takes precedence over host/port when set.
    url: ""
    # Pre-existing Secret containing the full REDIS_URL (takes precedence over url).
    existingSecret: ""
    existingSecretKey: "url"
    database: 0
    ssl: false
    maxConnections: 50
    connectionTimeout: 5s

  # Storage configuration - S3/RustFS compatible
  storage:
    # Storage type (s3, rustfs, gcs)
    type: "rustfs"
    endpoint: ""  # Auto-set from rustfs service if empty
    bucket: "agentarea-documents"
    region: "us-east-1"
    # S3 settings
    s3:
      accessKeyId: ""
      secretAccessKey: ""
      sessionToken: ""
    # GCS settings
    gcs:
      projectId: ""
      credentials: ""
    # RustFS settings
    rustfs:
      accessKey: ""
      secretKey: ""

  # Temporal configuration - Workflow engine
  temporal:
    host: ""  # Auto-set from temporal service if empty
    port: 7233
    namespace: "default"
    taskQueue: "agent-tasks"
    # Temporal client settings
    client:
      connectionTimeout: 10s
      rpcTimeout: 10s
      longPollTimeout: 60s
    # Worker settings
    worker:
      maxConcurrentActivityExecutions: 10
      maxConcurrentWorkflowTaskExecutions: 5
      maxConcurrentSessionExecutions: 1000

  # API configuration
  api:
    # API server settings
    host: "0.0.0.0"
    port: 8000
    # Public base URL of the backend API (e.g. https://api.example.com).
    # Advertised in OAuth protected-resource metadata and the MCP
    # WWW-Authenticate header. If empty, derived from
    # ingress.hosts.backend.host when ingress is enabled, otherwise falls
    # back to the internal ClusterIP service URL.
    publicUrl: ""
    # Authentication
    auth:
      enabled: false
      headerName: ""
      headerValue: ""
    # Rate limiting
    rateLimit:
      enabled: true
      requestsPerMinute: 1000

  # Web application configuration
  webapp:
    url: ""  # Public URL of the frontend (e.g. https://app.example.com). If empty, defaults to internal service URL.
    
  # Jobs configuration - Background task processing
  jobs:
    kube:
      # Kubernetes job settings
      namespace: ""  # Use release namespace if empty
      serviceAccount: ""  # Use global service account if empty
      # Job scheduling
      scheduling:
        # Node selectors for different job types
        spec:
          nodeSelectors: {}
        check:
          nodeSelectors: {}
        discover:
          nodeSelectors: {}
      # Job resources
      resources:
        limits:
          cpu: 1000m
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
      # Job timeouts
      timeouts:
        spec: 300s
        check: 600s
        discover: 900s
      # Image pull settings
      mainContainerImagePullPolicy: IfNotPresent
      sidecarContainerImagePullPolicy: IfNotPresent
      # Container images
      images:
        socat: "alpine/socat:latest"
        busybox: "busybox:latest"
        curl: "curlimages/curl:latest"

  # Workload configuration - Main application workloads
  workloads:
    resources:
      mainContainer:
        cpu:
          request: 50m
          limit: 1000m
        memory:
          request: 128Mi
          limit: 1Gi
      sidecarContainer:
        cpu:
          request: 10m
          limit: 200m
        memory:
          request: 64Mi
          limit: 256Mi

  # Service mesh configuration
  serviceMesh:
    enabled: false
    type: "istio"  # istio, linkerd

  # Monitoring configuration
  monitoring:
    # Prometheus metrics
    prometheus:
      enabled: true
      port: 9090
      path: "/metrics"
    # Health checks
    health:
      enabled: true
      port: 8001
      path: "/health"

  # Security configuration
  security:
    # Pod security context
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
    # Container security context
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL

  # Extra labels to add to all resources
  extraLabels: {}
  # team: platform
  # environment: production

  # Extra selector labels for pods
  extraSelectorLabels: {}

# Ingress configuration
ingress:
  enabled: false
  # Ingress class name (nginx, traefik, etc.)
  className: ""
  # Annotations for ingress controller
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  # Host configuration for each service
  hosts:
    frontend:
      host: ""  # e.g., app.example.com
      paths:
        - path: /
          pathType: Prefix
    backend:
      host: ""  # e.g., api.example.com
      paths:
        - path: /
          pathType: Prefix
    kratos:
      host: ""  # e.g., auth.example.com
      paths:
        - path: /
          pathType: Prefix
  # TLS configuration
  tls: []
    # - secretName: agentarea-tls
    #   hosts:
    #     - app.example.com
    #     - api.example.com
    #     - auth.example.com

# Backend API Service
backend:
  enabled: true
  replicaCount: 1

  image:
    repository: agentarea/agentarea-api
    tag: "latest"
    pullPolicy: ""  # Overrides global.image.pullPolicy if set

  service:
    type: ClusterIP
    port: 8000
    annotations: {}
    labels: {}

  # Resource limits and requests
  resources: {}
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi
  #   requests:
  #     cpu: 500m
  #     memory: 512Mi

  # Enhanced health check configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Pod annotations and labels
  podAnnotations: {}
  podLabels: {}

  # Additional configuration
  extraEnvFrom: []
  # - configMapRef:
  #     name: custom-config

  extraInitContainers: []
  # - name: init
  #   image: busybox:latest
  #   command: ['sh', '-c', 'echo initializing']

  # Security context
  podSecurityContext: {}
  #   fsGroup: 1000
  #   runAsUser: 1000
  #   runAsNonRoot: true

  containerSecurityContext: {}
  #   allowPrivilegeEscalation: false
  #   readOnlyRootFilesystem: true
  #   runAsNonRoot: true
  #   capabilities:
  #     drop:
  #       - ALL

  # Extension points
  extraEnv: []

  # Dependency wait initContainers (disable for production)
  waitForDependencies: false
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Frontend Service
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: agentarea/agentarea-frontend
    tag: "latest"
    pullPolicy: ""  # Overrides global.image.pullPolicy if set
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
    labels: {}
  # Enhanced health checks
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # Resource management
  resources: {}
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 250m
  #     memory: 256Mi
  # Pod configuration
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional configuration
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

# Worker Service (Temporal worker)
worker:
  enabled: true
  replicaCount: 1
  image:
    repository: agentarea/agentarea-worker
    tag: "latest"
    pullPolicy: ""  # Overrides global.image.pullPolicy if set
  # Resource management
  resources: {}
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi
  #   requests:
  #     cpu: 500m
  #     memory: 512Mi
  # Pod configuration
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Additional configuration
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraContainers: []

  # Dependency wait initContainers (disable for production)
  waitForDependencies: false

eventService:
  enabled: true
  replicaCount: 1
  image:
    repository: agentarea/agentarea-events
    tag: "latest"
    pullPolicy: ""  # Overrides global.image.pullPolicy if set
  # Service port
  port: 8002
  # Polling configuration
  pollInterval: "30s"
  maxPollers: 10
  inboundStream: "agentarea.channel.inbound"
  telegramPolling:
    # Dev-only fallback for Telegram getUpdates. Production Telegram ingress
    # should use webhooks.
    enabled: false
  # Resource limits and requests
  resources: {}
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  # Pod configuration
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Health check configuration
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  # Additional configuration
  extraEnv: []

# MCP Manager Service
mcpManager:
  enabled: true
  replicaCount: 1
  image:
    repository: agentarea/agentarea-mcp-manager
    tag: "latest"
  service:
    type: ClusterIP
    port: 80
  
  # Backend type: "docker" or "kubernetes"
  # "docker" requires privileged mode for container management
  # "kubernetes" uses native K8s resources (Deployments, Services, HTTPRoutes)
  backend: "kubernetes"
  
  # Domain for MCP instances (e.g., "mcp.example.com")
  # MCP instances will be available at: https://mcp.example.com/mcp/{instance-name}
  domain: "mcp.local"
  
  # Gateway API configuration for Envoy Gateway
  # Used when backend is "kubernetes" to create HTTPRoutes
  gateway:
    name: "envoy-gateway"              # Name of the Gateway resource
    namespace: "envoy-gateway-system"  # Namespace where Gateway is deployed
  
  # Runtime configuration for VM isolation (optional)
  # Set to "kata-qemu" for Kata Containers (requires Kata runtime)
  # Leave empty "" for standard container runtime
  runtimeClass: ""

  # Runtime MCP server pods use a separate ServiceAccount so their registry
  # access can point at the managed MCP runtime registry, not platform images.
  runtime:
    serviceAccount:
      create: true
      name: ""
    imagePullSecrets: []
    # - name: agentarea-mcp-runtime-regcred
  
  # Security context - only used when backend is "docker"
  # For "kubernetes" backend, leave empty: {}
  securityContext: {}
  # For Docker backend, use:
  # securityContext:
  #   privileged: true
  #   capabilities:
  #     add:
  #       - SYS_ADMIN
  
  # Feature flags - enable/disable advanced features
  features:
    # List of enabled features
    enabled:
      - gateway_api        # HTTPRoute creation for Envoy Gateway
      - state_reconciler   # Background state reconciliation
      # - warm_pool        # Fast cold start pool (requires extra memory)
      # - kata_runtime     # VM isolation (requires Kata installed)
      # - advanced_scaling # KEDA autoscaling
    
    # Feature-specific configuration
    variants: {}
  
  # Warm pool configuration for fast cold starts
  warmPool:
    enabled: false  # Enable for fast activation (200-500ms vs 5-15s)
    image:
      repository: agentarea/mcp-runner
      tag: "latest"
      pullPolicy: IfNotPresent

    # Maximum duration of a single sandbox command. Workflow pod lifetime is
    # controlled separately by MCP Manager workflow lease/idle TTL settings.
    maxExecutionTimeoutSeconds: 1800
    
    # Number of warm pods per node
    size: 10
    
    # Logging level
    logLevel: "info"
    
    # Resource limits for warm pods
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  
  resources: {}
  extraEnv: []

# Sandbox runner data plane. This process consumes sandbox execution requests
# from Redis Streams and executes them in the selected sandbox backend.
mcpSandboxRunner:
  enabled: true
  replicaCount: 1
  image:
    repository: "" # Defaults to mcpManager.image.repository
    tag: ""        # Defaults to mcpManager.image.tag
  consumerGroup: agentarea-sandbox-runners
  batchSize: 1
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv: []

# Temporal Workflow Engine
temporal:
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/auto-setup
    tag: "1.29.1"
  
  # Database configuration
  database:
    name: "temporal"
    createJob:
      enabled: true
  
  service:
    type: ClusterIP
    port: 7233
  resources: {}
  extraEnv: []

# Temporal UI
temporalUi:
  enabled: true
  replicaCount: 1
  image:
    repository: temporalio/ui
    tag: "2.39.0"
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  extraEnv: []

# Built-in PostgreSQL (simple StatefulSet, not for production)
# For production, disable and point global.database.host to your managed DB (RDS, Cloud SQL, etc.)
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

# `redis.enabled` is the Chart.yaml dependency condition that toggles the
# bundled Valkey subchart. No other keys here reach the subchart.
redis:
  enabled: true

# Valkey subchart passthrough — forwarded verbatim to valkey-io/valkey-helm.
valkey:
  auth:
    enabled: true
    usersExistingSecret: "agentarea-redis-secret"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: "redis-password"
  replica:
    enabled: false  # Standalone mode
  dataStorage:
    enabled: false  # Disable for development, enable for production
    requestedSize: "1Gi"
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# RustFS - S3-compatible object storage
rustfs:
  enabled: true
  image:
    repository: "rustfs/rustfs"
    tag: "latest"
  auth:
    existingSecret: "agentarea-rustfs-secret"
  defaultBuckets: "agentarea-documents"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    size: 10Gi
  # Probes are overridable. The rustfs image doesn't expose an HTTP health path
  # by default (returns 403), so defaults use TCP probes.
  # Override to httpGet if your image version exposes a working health path.
  readinessProbe:
    tcpSocket:
      port: rustfs
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    tcpSocket:
      port: rustfs
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6

# Job toggles
jobs:
  dbMigration:
    enabled: true

# Ory Kratos Identity Server
# Ory Keto (ReBAC) — powers Govern -> Policies -> Access (the relationship graph).
# Disabled by default; enable to turn on real relationship-based access checks.
keto:
  enabled: false
  replicaCount: 1
  image:
    repository: oryd/keto
    tag: "v0.12.0"
  database:
    name: "keto"
    createJob:
      enabled: true
  configMapOverrideName: ""
  # Keto server config (DSN injected from the postgres secret via $DSN).
  config: |
    version: v0.12.0
    dsn: ${DSN}
    namespaces:
      location: file:///etc/config/keto/namespaces.keto.ts
    serve:
      read:
        host: 0.0.0.0
        port: 4466
      write:
        host: 0.0.0.0
        port: 4467
      metrics:
        host: 0.0.0.0
        port: 4468
    log:
      level: info
      format: json
  # Ory Permission Language model. Keep in sync with
  # config/auth/keto/namespaces.keto.ts (used by docker-compose dev).
  namespaces: |
    import { Namespace, Context, SubjectSet } from "@ory/keto-namespace-types"

    class User implements Namespace {}

    class Workspace implements Namespace {
      related: {
        members: (User | Agent)[]
      }
    }

    class SkillCollection implements Namespace {
      related: {
        parents: Workspace[]
        viewers: (User | Agent | SubjectSet<Workspace, "members">)[]
        editors: (User | Agent | SubjectSet<Workspace, "members">)[]
        owners: (User | Agent)[]
      }
      permits = {
        use: (ctx: Context): boolean =>
          this.related.viewers.includes(ctx.subject) ||
          this.related.editors.includes(ctx.subject) ||
          this.related.owners.includes(ctx.subject),
        configure: (ctx: Context): boolean =>
          this.related.editors.includes(ctx.subject) ||
          this.related.owners.includes(ctx.subject),
        manage: (ctx: Context): boolean =>
          this.related.owners.includes(ctx.subject),
      }
    }

    class Skill implements Namespace {
      related: {
        collections: SkillCollection[]
        viewers: (User | Agent)[]
        editors: (User | Agent)[]
        owners: (User | Agent)[]
      }
      permits = {
        use: (ctx: Context): boolean =>
          this.related.viewers.includes(ctx.subject) ||
          this.related.editors.includes(ctx.subject) ||
          this.related.owners.includes(ctx.subject) ||
          this.related.collections.traverse((c) => c.permits.use(ctx)),
        configure: (ctx: Context): boolean =>
          this.related.editors.includes(ctx.subject) ||
          this.related.owners.includes(ctx.subject) ||
          this.related.collections.traverse((c) => c.permits.configure(ctx)),
        manage: (ctx: Context): boolean =>
          this.related.owners.includes(ctx.subject) ||
          this.related.collections.traverse((c) => c.permits.manage(ctx)),
      }
    }

    class MCPServer implements Namespace {
      related: {
        connectors: (User | Agent | SubjectSet<Workspace, "members">)[]
        operators: (User | Agent)[]
      }
      permits = {
        connect: (ctx: Context): boolean =>
          this.related.connectors.includes(ctx.subject) ||
          this.related.operators.includes(ctx.subject),
        manage: (ctx: Context): boolean =>
          this.related.operators.includes(ctx.subject),
      }
    }

    class Agent implements Namespace {
      related: {
        operators: (User | Agent | SubjectSet<Workspace, "members">)[]
        owners: User[]
      }
      permits = {
        operate: (ctx: Context): boolean =>
          this.related.operators.includes(ctx.subject) ||
          this.related.owners.includes(ctx.subject),
        own: (ctx: Context): boolean => this.related.owners.includes(ctx.subject),
      }
    }

kratos:
  enabled: true
  replicaCount: 1
  image:
    repository: oryd/kratos
    tag: "v1.3.1"
  
  # URL configuration
  # If not set, these default to internal Kubernetes service DNS names
  urls:
    public: "" # e.g. https://auth.example.com
    publicBrowser: "" # Browser-facing URL, defaults to public. Set when pods can't resolve the public domain (e.g. Tailscale)
    admin: ""  # e.g. http://kratos-admin.internal
  
  database:
    name: "kratos"
    createJob:
      enabled: true

  configMapOverrideName: ""
  files: {}

  secretName: ""
  generateJwks: false
  smtp:
    connection_uri: ""
    from_address: "noreply@example.com"
    from_name: "AgentArea"
  session:
    cookieDomain: "localhost"
  jwt:
    kid: "agentarea-jwt-key-1"
    jwks_b64: ""
    claims_mapper_b64: ""
    issuer: "https://agentarea.dev"
    audience: "agentarea-api"

  # Kratos Identity Schema
  identitySchema: |
    {
      "$id": "https://schemas.ory.sh/presets/kratos/quickstart/email-password/identity.schema.json",
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "Person",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "Email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                },
                "recovery": {
                  "via": "email"
                }
              }
            },
            "name": {
              "type": "object",
              "properties": {
                "first": {
                  "title": "First Name",
                  "type": "string"
                },
                "last": {
                  "title": "Last Name",
                  "type": "string"
                }
              }
            },
            "username": {
              "type": "string",
              "title": "Username"
            }
          },
          "required": [
            "email"
          ],
          "additionalProperties": false
        }
      }
    }

  # Kratos Configuration (kratos.yml)
  # Provide a pure YAML map here (no Helm templating). Dynamic fields (URLs, SMTP, cookie domain,
  # whoami tokenizer) are injected by the chart at render time.
  config:
    version: v1.3.1
    serve:
      public:
        cors:
          enabled: true
          allowed_origins:
            - https://staging-0.agentarea.ai
            - https://*.staging-0.agentarea.ai
          allowed_methods:
            - POST
            - GET
            - PUT
            - PATCH
            - DELETE
          allowed_headers:
            - Authorization
            - Cookie
            - Content-Type
            - X-Session-Token
          exposed_headers:
            - Content-Type
            - Set-Cookie
    dsn: ${DSN}
    secrets:
      cookie:
        - PLEASE-CHANGE-ME-I-AM-VERY-INSECURE-dev-only
      cipher:
        - SECRET-KEY-FOR-DEV-32-CHARACTERS
    ciphers:
      algorithm: xchacha20-poly1305
    hashers:
      algorithm: bcrypt
      bcrypt:
        cost: 8
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/kratos/identity.schema.json
