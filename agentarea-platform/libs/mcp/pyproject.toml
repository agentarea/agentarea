[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-mcp"
version = "0.0.15"
description = "MCP functionality for AgentArea"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "agentarea-agents-sdk",
    "pydantic>=2.4.2",
    "httpx>=0.25.0",
    "httpx2>=2.5.0",
    "mcp>=2.2.0,<3",
]

[tool.uv.sources]
agentarea-common = { workspace = true }
agentarea-agents-sdk = { workspace = true }
[tool.hatch.build.targets.wheel]
packages = ["agentarea_mcp"] 