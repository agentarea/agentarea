apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llmproviderconfigs.agentarea.io
spec:
  group: agentarea.io
  names:
    kind: LLMProviderConfig
    listKind: LLMProviderConfigList
    plural: llmproviderconfigs
    singular: llmproviderconfig
    shortNames:
      - llm
      - llmpc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - providerKey
                - name
              properties:
                providerKey:
                  type: string
                  description: "Provider key matching provider_specs.provider_key (e.g. openrouter, openai)"
                name:
                  type: string
                  description: "Human-readable name for this config (e.g. 'OpenRouter Production')"
                endpointUrl:
                  type: string
                  description: "Custom API endpoint URL (optional for most providers)"
                apiKeySecretRef:
                  type: object
                  description: "Reference to a Kubernetes Secret containing the API key. Always resolved in this resource's own namespace."
                  required:
                    - name
                    - key
                  properties:
                    name:
                      type: string
                      description: "Name of the Secret"
                    key:
                      type: string
                      description: "Key within the Secret"
                    namespace:
                      type: string
                      description: "Must equal this resource's own namespace if set. A different value is rejected: the operator never reads a Secret across namespaces on a CR author's behalf."
                discoverModels:
                  type: boolean
                  default: false
                  description: "Auto-discover models from the provider's /v1/models endpoint"
                isPublic:
                  type: boolean
                  default: true
                  description: "Make this config available to all workspace users"
                workspaceId:
                  type: string
                  default: "platform"
                  description: "Target workspace ID"
                models:
                  type: array
                  description: "Explicit list of model instances to activate (skipped if discoverModels is true)"
                  items:
                    type: object
                    required:
                      - modelName
                    properties:
                      modelName:
                        type: string
                        description: "Model name matching model_specs.model_name"
                      displayName:
                        type: string
                        description: "Override display name"
                      description:
                        type: string
                      contextWindow:
                        type: integer
                        description: "Maximum context in tokens"
                      # The PROVIDER's price to us, per token, and the reason these
                      # are here rather than left to the catalog: the runtime refuses
                      # to run a model whose cost per token is unset, and anything we
                      # decide to sell is typically newer than the catalog that would
                      # otherwise carry it.
                      #
                      # Not what the customer pays — that is a markup applied over
                      # this in the billing service, and it is declared there.
                      inputCostPerToken:
                        type: number
                        description: "Provider cost per input token, e.g. 6e-7"
                      outputCostPerToken:
                        type: number
                        description: "Provider cost per output token"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Synced, Error, Discovering]
                message:
                  type: string
                providerConfigId:
                  type: string
                  description: "UUID of the synced ProviderConfig in the database"
                discoveredModels:
                  type: integer
                  description: "Number of models discovered"
                lastSyncedAt:
                  type: string
                  format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.providerKey
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Models
          type: integer
          jsonPath: .status.discoveredModels
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
