name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (e.g., api, worker, frontend)'
        required: true
        type: string
      context:
        description: 'Build context directory'
        required: true
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: true
        type: string
      image-name:
        description: 'Docker image name (defaults to agentarea-{component})'
        required: false
        type: string
      use-private-registry:
        description: 'Whether to push to private registry'
        required: false
        type: boolean
        default: false
      push:
        description: 'Whether to push the image (false for build-only validation)'
        required: false
        type: boolean
        default: true
      build-args:
        description: 'Additional newline-delimited Docker build arguments'
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_PASSWORD:
        required: true
      DOCKER_REGISTRY_MIRROR:
        required: false
      DOCKER_REGISTRY_MIRROR_PATH:
        required: false
      DOCKER_REGISTRY_MIRROR_USERNAME:
        required: false
      DOCKER_REGISTRY_MIRROR_PASSWORD:
        required: false

jobs:
  # Build each platform on its NATIVE runner (no QEMU emulation). When pushing,
  # each platform is pushed by digest (untagged); the merge job stitches them
  # into the final multi-arch manifest. amd64 -> ubuntu-latest, arm64 ->
  # ubuntu-24.04-arm (free GitHub-hosted ARM runner for public repos).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Private Registry
        if: ${{ inputs.use-private-registry && inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          username: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

      - name: Compute image paths
        id: image
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_USE_PRIVATE_REGISTRY: ${{ inputs.use-private-registry }}
          SECRET_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          SECRET_REGISTRY_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
        run: |
          IMAGE="$INPUT_IMAGE_NAME"
          if [ -z "$IMAGE" ]; then
            IMAGE="agentarea-$INPUT_COMPONENT"
          fi

          if [[ "$IMAGE" == *:* ]]; then
            echo "Error: image-name must not include a tag"
            exit 1
          fi

          if [[ "$IMAGE" == */* ]]; then
            PUBLIC_IMAGE="$IMAGE"
          else
            PUBLIC_IMAGE="agentarea/$IMAGE"
          fi

          if [ "$INPUT_USE_PRIVATE_REGISTRY" = "true" ]; then
            REGISTRY="$SECRET_REGISTRY_MIRROR"
            REGISTRY="${REGISTRY%/}"

            REGISTRY_PATH="$SECRET_REGISTRY_PATH"
            REGISTRY_PATH="${REGISTRY_PATH#/}"
            REGISTRY_PATH="${REGISTRY_PATH%/}"

            if [ -n "$REGISTRY_PATH" ]; then
              PRIVATE_IMAGE="$REGISTRY/$REGISTRY_PATH/$IMAGE"
            else
              PRIVATE_IMAGE="$REGISTRY/$IMAGE"
            fi

            {
              echo "images<<EOF"
              echo "$PUBLIC_IMAGE"
              echo "$PRIVATE_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "images<<EOF"
              echo "$PUBLIC_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          # Per-arch images are pushed by digest to the primary (public) repo.
          # The merge step then tags every target repo (incl. private mirror)
          # from that source, so we only need the primary here.
          echo "primary=$PUBLIC_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
          flavor: |
            latest=false

      # When pushing: build the single platform and push it by digest (untagged).
      - name: Build and push by digest
        id: build
        if: ${{ inputs.push }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.primary }},push-by-digest=true,name-canonical=true,push=true
          provenance: false

      # When not pushing (PR / build-only validation): just build natively to
      # validate the image compiles on each architecture. No registry needed.
      - name: Build only (validation)
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            ${{ inputs.build-args }}
          cache-from: type=gha,scope=${{ inputs.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ matrix.arch }}
          provenance: false

      - name: Export digest
        if: ${{ inputs.push }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@v4
        with:
          # `.` separates the component from the arch, NOT `-`. The merge job
          # globs these by component name, and one component name is a prefix of
          # another (mcp-runner / mcp-runner-locked), so a `-` separator lets
          # `digests-mcp-runner-*` swallow the locked image's digests and the
          # manifest step then asks for them under the wrong repository.
          name: digests-${{ inputs.component }}.${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-architecture digests into a single multi-arch manifest with
  # the real tags. Only runs when images were actually pushed.
  merge:
    if: ${{ inputs.push }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.component }}.*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to Private Registry
        if: ${{ inputs.use-private-registry }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          username: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

      - name: Compute image paths
        id: image
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_COMPONENT: ${{ inputs.component }}
          INPUT_USE_PRIVATE_REGISTRY: ${{ inputs.use-private-registry }}
          SECRET_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
          SECRET_REGISTRY_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
        run: |
          IMAGE="$INPUT_IMAGE_NAME"
          if [ -z "$IMAGE" ]; then
            IMAGE="agentarea-$INPUT_COMPONENT"
          fi

          if [[ "$IMAGE" == *:* ]]; then
            echo "Error: image-name must not include a tag"
            exit 1
          fi

          if [[ "$IMAGE" == */* ]]; then
            PUBLIC_IMAGE="$IMAGE"
          else
            PUBLIC_IMAGE="agentarea/$IMAGE"
          fi

          if [ "$INPUT_USE_PRIVATE_REGISTRY" = "true" ]; then
            REGISTRY="$SECRET_REGISTRY_MIRROR"
            REGISTRY="${REGISTRY%/}"

            REGISTRY_PATH="$SECRET_REGISTRY_PATH"
            REGISTRY_PATH="${REGISTRY_PATH#/}"
            REGISTRY_PATH="${REGISTRY_PATH%/}"

            if [ -n "$REGISTRY_PATH" ]; then
              PRIVATE_IMAGE="$REGISTRY/$REGISTRY_PATH/$IMAGE"
            else
              PRIVATE_IMAGE="$REGISTRY/$IMAGE"
            fi

            {
              echo "images<<EOF"
              echo "$PUBLIC_IMAGE"
              echo "$PRIVATE_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "images<<EOF"
              echo "$PUBLIC_IMAGE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          echo "primary=$PUBLIC_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-{{sha}}
          flavor: |
            latest=false

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          PRIMARY_IMAGE: ${{ steps.image.outputs.primary }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${PRIMARY_IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        env:
          PRIMARY_IMAGE: ${{ steps.image.outputs.primary }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          MANIFEST_TAG="$(
            jq -er --arg image "$PRIMARY_IMAGE" '
              .tags | map(select(startswith($image + ":"))) | first
            ' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          )"

          docker buildx imagetools inspect "$MANIFEST_TAG"
