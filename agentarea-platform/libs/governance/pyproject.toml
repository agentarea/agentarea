[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-governance"
version = "0.0.8"
description = "Unified interceptor framework for agent execution governance and security"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
temporal = [
    "temporalio>=1.12.0",
    "agentarea-execution",
]

[tool.hatch.build.targets.wheel]
packages = ["agentarea_governance"]
