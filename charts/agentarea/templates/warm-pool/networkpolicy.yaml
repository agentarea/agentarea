{{- $provider := .Values.sandboxRuntime.provider | default "kubernetes" -}}
{{- if and .Values.mcpManager.enabled .Values.mcpManager.warmPool.enabled (has "warm_pool" .Values.mcpManager.features.enabled) (or (eq $provider "kubernetes") (eq $provider "agentarea")) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentarea.fullname" . }}-sandbox-task-isolation
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-task-isolation
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - warm-pool
          - workflow-sandbox
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: sandbox-runner
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-manager
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.mcpManager.gateway.namespace | quote }}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.mcpManager.instanceNetworkPolicy.dnsNamespace | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: rustfs
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentarea.fullname" . }}-sandbox-public-egress
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-public-egress
spec:
  podSelector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - warm-pool
          - workflow-sandbox
  policyTypes:
    - Egress
  {{- if .Values.sandboxRuntime.allowInternet }}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.mcpManager.instanceNetworkPolicy.blockedEgressCIDRs }}
              - {{ . | quote }}
              {{- end }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
