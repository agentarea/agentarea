---
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - iptables
    update_cache: true
    state: present

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker apt GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
    update_cache: true
    state: present

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Must precede the Docker restart that picks up daemon.json, or containers start
# pointed at a resolver that is not listening yet.
# Before Docker starts pulling: without egress the first pull fails and the
# failure looks like a broken registry rather than a missing route.
- name: Give the private-only host an IPv4 default route
  ansible.builtin.copy:
    dest: /etc/netplan/99-vpc-default-route.yaml
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by the sandbox_host role.
      network:
        version: 2
        ethernets:
          {{ sandbox_vpc_interface }}:
            routes:
              - to: default
                via: {{ sandbox_vpc_default_gateway }}
  when: sandbox_vpc_default_gateway | length > 0
  notify: Apply netplan

- name: Apply routing before anything needs the network
  ansible.builtin.meta: flush_handlers

- name: Publish the resolver stub on the Docker bridge
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/docker-bridge-stub.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the sandbox_host role.
      [Resolve]
      DNSStubListenerExtra={{ sandbox_container_dns_stub_address }}
  when: sandbox_container_dns | length > 0
  notify: Restart systemd-resolved

- name: Apply the resolver change before Docker reads its configuration
  ansible.builtin.meta: flush_handlers
