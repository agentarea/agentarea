[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-payment"
version = "0.0.10"
description = "Payment protocol clients (x402 + MPP) for AgentArea"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "pydantic>=2.4.2",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
x402 = ["x402[httpx,evm]"]
mpp = ["pympp"]
all = ["x402[httpx,evm]", "pympp"]

[tool.uv.sources]
agentarea-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["agentarea_payment"]
