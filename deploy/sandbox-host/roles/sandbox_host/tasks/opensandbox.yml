---
- name: Require the sources allowed past the input firewall
  ansible.builtin.assert:
    that:
      - opensandbox_control_plane_cidrs | length > 0
    fail_msg: >-
      opensandbox_control_plane_cidrs is empty, so the input firewall would drop
      the control plane along with everyone else. Name the networks the control
      plane reaches this host from -- with a private data plane those are the
      cluster's addresses, not its public egress IP.

- name: Ensure OpenSandbox directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/opensandbox, owner: root, group: "10001", mode: "0750" }
    - { path: /var/lib/opensandbox, owner: "10001", group: "10001", mode: "0750" }
    - { path: /var/lib/opensandbox/caddy-data, owner: root, group: root, mode: "0750" }
    - { path: /var/lib/opensandbox/caddy-config, owner: root, group: root, mode: "0750" }

- name: Read Docker socket group
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: _docker_socket

- name: Refuse to deploy without the Docker control socket
  ansible.builtin.assert:
    that:
      - _docker_socket.stat.exists
      - _docker_socket.stat.gid is defined
    fail_msg: OpenSandbox requires the local Docker socket.

- name: Write OpenSandbox server configuration
  ansible.builtin.template:
    src: opensandbox.toml.j2
    dest: /etc/opensandbox/config.toml
    owner: root
    group: "10001"
    mode: "0640"
  notify: Restart opensandbox

- name: Write OpenSandbox API key environment
  ansible.builtin.template:
    src: opensandbox.env.j2
    dest: /etc/opensandbox/opensandbox.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart opensandbox

- name: Write OpenSandbox Compose environment
  ansible.builtin.copy:
    dest: /etc/opensandbox/compose.env
    owner: root
    group: root
    mode: "0600"
    content: |
      DOCKER_GID={{ _docker_socket.stat.gid }}
  notify: Restart opensandbox

- name: Write OpenSandbox Compose stack
  ansible.builtin.template:
    src: opensandbox-compose.yaml.j2
    dest: /etc/opensandbox/compose.yaml
    owner: root
    group: root
    mode: "0640"
  notify: Restart opensandbox

- name: Write OpenSandbox TLS proxy configuration
  ansible.builtin.template:
    src: opensandbox-Caddyfile.j2
    dest: /etc/opensandbox/Caddyfile
    owner: root
    group: root
    mode: "0640"
  notify: Restart opensandbox
  when: sandbox_tls_proxy_enabled | bool

- name: Install OpenSandbox inbound firewall script
  ansible.builtin.template:
    src: opensandbox-input-firewall.sh.j2
    dest: /usr/local/sbin/opensandbox-input-firewall.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart opensandbox-input-firewall

- name: Install OpenSandbox inbound firewall unit
  ansible.builtin.template:
    src: opensandbox-input-firewall.service.j2
    dest: /etc/systemd/system/opensandbox-input-firewall.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart opensandbox-input-firewall

- name: Enable OpenSandbox inbound firewall
  ansible.builtin.systemd:
    name: opensandbox-input-firewall
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Install OpenSandbox systemd unit
  ansible.builtin.template:
    src: opensandbox.service.j2
    dest: /etc/systemd/system/opensandbox.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart opensandbox

- name: Enable and start OpenSandbox
  ansible.builtin.systemd:
    name: opensandbox
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Wait for authenticated OpenSandbox health
  ansible.builtin.uri:
    url: "http://{{ opensandbox_bind_address }}:{{ opensandbox_server_port }}/health"
    headers:
      OPEN-SANDBOX-API-KEY: "{{ opensandbox_api_key }}"
    status_code: 200
  no_log: true
  register: _opensandbox_health
  retries: 30
  delay: 4
  until: _opensandbox_health.status == 200
  when: not ansible_check_mode

- name: Verify TLS certificate through the local proxy
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --noproxy
      - "*"
      - --resolve
      - "{{ opensandbox_public_hostname }}:443:127.0.0.1"
      - --header
      - "OPEN-SANDBOX-API-KEY: {{ opensandbox_api_key }}"
      - "https://{{ opensandbox_public_hostname }}/health"
  no_log: true
  register: _opensandbox_tls
  changed_when: false
  failed_when: _opensandbox_tls.rc != 0
  when:
    - sandbox_tls_proxy_enabled | bool
    - not ansible_check_mode
