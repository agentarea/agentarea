---
# Run the MCP data plane on this host: the manager binary in dataplane mode,
# behind the TLS proxy this host already runs.
#
# Deliberately separate from the executor and from OpenSandbox. Those serve agent
# sandboxes; this serves MCP servers. They share a machine and its gVisor runtime
# and nothing else.

- name: Require data-plane security inputs
  ansible.builtin.assert:
    that:
      - sandbox_mcp_dataplane_auth_token | length >= 32
      - sandbox_mcp_dataplane_id | length > 0
      - not (sandbox_tls_proxy_enabled | bool) or sandbox_mcp_dataplane_public_hostname | length > 0
      - sandbox_mcp_dataplane_binary_src | length > 0
      - sandbox_runtime == "runsc"
    fail_msg: >-
      The MCP data plane requires a 32+ character shared token (the same value
      the control plane sends), an id that marks this data plane's instances as
      its own, a binary to install, and the runsc runtime -- plus a TLS hostname
      when it is published through the proxy. A data plane reachable without a
      token hands container creation on a gVisor host to whoever finds the port.

- name: Create data-plane configuration directory
  ansible.builtin.file:
    path: /etc/mcp-dataplane
    state: directory
    owner: root
    group: root
    mode: "0750"

# Instances land on this network and the data plane reaches them across it. A
# dedicated network rather than the default one keeps MCP containers off the
# bridge everything else on the host shares.
- name: Create the MCP instance network
  ansible.builtin.command: docker network create {{ sandbox_mcp_dataplane_network }}
  register: _mcp_network
  changed_when: _mcp_network.rc == 0
  failed_when:
    - _mcp_network.rc != 0
    - "'already exists' not in _mcp_network.stderr"

- name: Install the data-plane binary
  ansible.builtin.copy:
    src: "{{ sandbox_mcp_dataplane_binary_src }}"
    dest: "{{ sandbox_mcp_dataplane_binary_dest }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart mcp-dataplane

- name: Render data-plane environment
  ansible.builtin.template:
    src: mcp-dataplane.env.j2
    dest: /etc/mcp-dataplane/dataplane.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart mcp-dataplane

- name: Install data-plane service unit
  ansible.builtin.template:
    src: mcp-dataplane.service.j2
    dest: /etc/systemd/system/mcp-dataplane.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart mcp-dataplane

- name: Enable and start the data plane
  ansible.builtin.systemd:
    name: mcp-dataplane
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending data-plane restarts before verifying
  ansible.builtin.meta: flush_handlers

# Publishes the data plane on its own hostname through the TLS proxy this host
# already runs. Written even when OpenSandbox is disabled: the template's other
# site block is driven by defaults, so the file is complete either way.
- name: Write TLS proxy configuration
  ansible.builtin.template:
    src: opensandbox-Caddyfile.j2
    dest: /etc/opensandbox/Caddyfile
    owner: root
    group: root
    mode: "0640"
  when: sandbox_tls_proxy_enabled | bool
  notify: Restart caddy

- name: Apply the proxy configuration
  ansible.builtin.meta: flush_handlers
  when: sandbox_tls_proxy_enabled | bool

# A green play that never reached the process would only prove the files were
# written.
- name: Wait for the data plane to answer
  ansible.builtin.uri:
    url: "http://{{ sandbox_mcp_dataplane_bind_address }}:{{ sandbox_mcp_dataplane_port }}/healthz"
    status_code: 200
  register: _mcp_dp_health
  retries: 20
  delay: 3
  until: _mcp_dp_health is succeeded

- name: Verify the data plane refuses unauthenticated calls
  ansible.builtin.uri:
    url: "http://{{ sandbox_mcp_dataplane_bind_address }}:{{ sandbox_mcp_dataplane_port }}/dataplane/v1/instances"
    status_code: 401
  changed_when: false

# Resolved to loopback on purpose. The host's inbound firewall admits only the
# control plane, so reaching the public address from here — or from the host
# itself, which would have to hairpin — proves nothing about the proxy. This
# exercises the same TLS listener and virtual host without depending on who is
# allowed to reach it.
- name: Verify the data plane answers over TLS
  ansible.builtin.command: >-
    curl -sf --max-time 15
    --resolve {{ sandbox_mcp_dataplane_public_hostname }}:443:127.0.0.1
    https://{{ sandbox_mcp_dataplane_public_hostname }}/healthz
  register: _mcp_dp_tls
  retries: 10
  delay: 6
  until: _mcp_dp_tls.rc == 0
  when: sandbox_tls_proxy_enabled | bool
  changed_when: false
