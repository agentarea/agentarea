name: Release CLI

# Publishes @agentarea/cli to npm.
#
# Versioned INDEPENDENTLY from the platform (VERSION / docker images / helm).
# A release is a version bump of agentarea-cli/package.json merged to main:
# when that version is not on npm yet, it is published and tagged cli-vX.Y.Z.
# A push that leaves the version alone publishes nothing.
#
# Publishes through npm Trusted Publishing (OIDC): the package trusts this
# workflow on npmjs.com, no npm token is stored in the repository.

on:
  push:
    branches: [main]
    paths:
      - 'agentarea-cli/package.json'
  workflow_dispatch:

permissions:
  contents: write # the cli-vX.Y.Z tag
  id-token: write # npm provenance

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentarea-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-cli/pnpm-lock.yaml'

      - name: Is this version new
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@agentarea/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@agentarea/cli@$VERSION is already on npm; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: pnpm run test

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: pnpm run build

      - name: Publish to npm
        if: steps.version.outputs.release == 'true'
        run: |
          npm install -g npm@^11.5.1
          npm publish --provenance --access public

      - name: Tag the release
        if: steps.version.outputs.release == 'true'
        run: |
          TAG="cli-v${{ steps.version.outputs.version }}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
