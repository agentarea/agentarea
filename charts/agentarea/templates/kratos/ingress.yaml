{{- if and .Values.ingress.enabled .Values.kratos.enabled .Values.ingress.hosts.kratos.host }}
{{- $fullName := include "agentarea.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-kratos
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: kratos
    {{- with .Values.global.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
  {{- $ingressClass := .Values.ingress.className | default (get $annotations "kubernetes.io/ingress.class") -}}
  {{- $rateLimit := .Values.ingress.kratosRateLimit -}}
  {{- if and (eq $ingressClass "nginx") $rateLimit.enabled }}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-rps" (printf "%v" $rateLimit.requestsPerSecond) -}}
  {{- $_ := set $annotations "nginx.ingress.kubernetes.io/limit-burst-multiplier" (printf "%v" $rateLimit.burstMultiplier) -}}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts.kratos.host }}
    - host: {{ .Values.ingress.hosts.kratos.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.hosts.kratos.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-kratos-public
                port:
                  name: http
          {{- end }}
    {{- else }}
    - http:
        paths:
          {{- range .Values.ingress.hosts.kratos.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}-kratos-public
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
