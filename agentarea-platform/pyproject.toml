[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-workspace"
version = "0.0.13"
authors = [
    { name="Artem Astapenko", email="artem.astapenko@agentarea.ai" },
    { name="Julia Astapenko", email="julia.astapenko@agentarea.ai" },
]
description = "AgentArea workspace with API, Worker and shared libraries"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=0.2.8",
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.2",
    "watchfiles>=1.1.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "libs/common",
    "libs/agents",
    "libs/agentarea-agents-sdk",
    "libs/llm",
    "libs/mcp",
    "libs/tasks",
    "libs/secrets",
    "libs/wallet",
    "libs/payment",
    "libs/execution",
    "libs/triggers",
    "libs/governance",
    "libs/openapi",
    "libs/projects",
    "libs/registry",
    "libs/bundles"
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "idna>=3.15",
    "joserfc>=1.6.8",
    "litellm>=1.83.11",
    "mako>=1.3.12",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.30",
    "starlette>=1.3.1",
    "torch>=2.12.0",
    "urllib3>=2.7.0",
    "web3>=7.15.0",
]

[tool.uv.sources]
agentarea-common = { workspace = true }
agentarea-agents = { workspace = true }
agentarea-agents-sdk = { workspace = true }
agentarea-llm = { workspace = true }
agentarea-mcp = { workspace = true }
agentarea-tasks = { workspace = true }
agentarea-secrets = { workspace = true }
agentarea-wallet = { workspace = true }
agentarea-payment = { workspace = true }
agentarea-execution = { workspace = true }
agentarea-triggers = { workspace = true }
agentarea-governance = { workspace = true }
agentarea-openapi = { workspace = true }
agentarea-projects = { workspace = true }
agentarea-registry = { workspace = true }
agentarea-bundles = { workspace = true }
agentarea-api = { workspace = true }
agentarea-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.11.4",
    "aiosqlite>=0.21.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "coverage[toml]>=7.6.0",
    "agentarea-common",
    "agentarea-agents",
    "agentarea-agents-sdk",
    "agentarea-llm",
    "agentarea-mcp",
    "agentarea-tasks",
    "agentarea-secrets",
    "agentarea-wallet",
    "agentarea-payment",
    "agentarea-execution",
    "agentarea-triggers",
    "agentarea-api",
    "agentarea-worker",
    "pytest-env>=1.1.5",
    "schemathesis>=3.39",
]

test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "coverage[toml]>=7.6.0",
]

lint = [
    "ruff>=0.11.4",
    "pyright>=1.1.400",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests", "scripts", "test_tools_display.py", "libs/triggers/examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings 
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "D102",
    "D103",
    "D107",
    "D101",
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # One blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "D205",    # Blank line required between summary line and description
    "D415",    # First line should end with punctuation
    "E501",    # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]
"apps/*/tests/*" = ["D", "S101"]
"libs/*/tests/*" = ["D", "S101"]
"apps/api/agentarea_api/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Body",
    "fastapi.params.Body",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.Header",
    "fastapi.params.Header",
    "fastapi.Path",
    "fastapi.params.Path",
    "fastapi.Cookie",
    "fastapi.params.Cookie",
    "fastapi.Security",
    "fastapi.params.Security"
]



[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=agentarea_common",
    "--cov=agentarea_agents", 
    "--cov=agentarea_llm",
    "--cov=agentarea_mcp",
    "--cov=agentarea_tasks",
    "--cov=agentarea_secrets",
    "--cov=agentarea_wallet",
    "--cov=agentarea_payment",
    "--cov=agentarea_triggers",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "flow: canonical main-flow test (see agentarea_common.testing.flows); run with -m flow",
]
asyncio_mode = "auto"

# Test environment isolation - override env vars for docker-compose services
env = [
    # Database (docker-compose postgres service mapped to localhost:5432)
    "POSTGRES_HOST=localhost",
    "POSTGRES_PORT=5432", 
    "POSTGRES_USER=postgres",
    "POSTGRES_PASSWORD=postgres",
    "POSTGRES_DB=agentarea",
    
    # Redis (docker-compose redis service mapped to localhost:6379) 
    "REDIS_URL=redis://localhost:6379",
    
    # Temporal (docker-compose temporal service mapped to localhost:7233)
    "TEMPORAL_SERVER_URL=localhost:7233",
    "TEMPORAL_NAMESPACE=default",
    
    # Test-specific settings to prevent production interference
    "APP_ENV=test",
    "DEBUG=false",
    "SECRET_MANAGER_TYPE=local",
]

[tool.coverage.run]
source = [
    "libs/common/agentarea_common",
    "libs/agents/agentarea_agents",
    "libs/llm/agentarea_llm",
    "libs/mcp/agentarea_mcp",
    "libs/tasks/agentarea_tasks",
    "libs/secrets/agentarea_secrets",
    "libs/wallet/agentarea_wallet",
    "libs/payment/agentarea_payment",
    "libs/execution/agentarea_execution",
    "libs/triggers/agentarea_triggers",
    "apps/api/agentarea_api",
    "apps/worker/agentarea_worker",
]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.pyright]
include = [
    "libs/*/agentarea_*/**/*.py",
    "apps/*/agentarea_*/**/*.py",
    # Exclude tests from type checking to avoid noisy fixture/type issues
    # Unit tests are covered by pytest; keeping pyright focused on app/libs code
    # (CI runs ruff + pytest for tests)
]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/dist",
    "**/build",
    "tests"
]
typeCheckingMode = "standard"
defineConstant = { DEBUG = true }
pythonVersion = "3.12"
pythonPlatform = "All"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
# Ratchet policy: diagnostics that catch real bugs (None access, undefined
# names, bad awaits, type mismatches) stay "error" and are currently at zero, so
# CI blocks any NEW real bug from landing. Annotation-completeness and style
# diagnostics are "warning" — a visible, non-blocking backlog we burn down over
# time without gating the branch. Do not silence a bug-catcher to pass CI; fix
# it or narrow the type. See the pyright ratchet discussion in the PR.
#
# Bug-catchers (keep "error"):
reportDuplicateImport = "error"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportTypedDictNotRequiredAccess = "error"
reportAttributeAccessIssue = "error"
reportTypeCommentUsage = "error"
reportInconsistentConstructor = "error"
reportPossiblyUnboundVariable = "error"
reportUnusedExpression = "error"
reportMatchNotExhaustive = "error"
reportMissingSuperCall = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportCallInDefaultInitializer = false
reportUnusedCallResult = false
# Annotation/style noise (non-blocking "warning" backlog):
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportPrivateUsage = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportUninitializedInstanceVariable = "warning"
reportUnknownParameterType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportFunctionMemberAccess = "warning"
reportImplicitStringConcatenation = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnsupportedDunderAll = "warning"

# Hatch build configuration for workspace root
[tool.hatch.build.targets.wheel]
packages = ["cli.py", "main.py"]
include = [
    "cli.py",
    "main.py", 
    "alembic.ini"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = ["README.md"]
