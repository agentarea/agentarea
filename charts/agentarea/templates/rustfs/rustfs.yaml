{{- if .Values.rustfs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      containers:
        - name: rustfs
          image: "{{ default "rustfs/rustfs" .Values.rustfs.image.repository }}:{{ default "latest" .Values.rustfs.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["/data", "--console-enable"]
          ports:
            - name: rustfs
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-user
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-password
          {{- with .Values.rustfs.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.rustfs.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.rustfs.resources .Values.global.workloads.resources.mainContainer }}
          resources:
            {{- if .Values.rustfs.resources }}
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
            {{- else }}
            limits:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.limit }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.limit }}
            requests:
              cpu: {{ .Values.global.workloads.resources.mainContainer.cpu.request }}
              memory: {{ .Values.global.workloads.resources.mainContainer.memory.request }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        {{- if .Values.rustfs.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-rustfs-pvc
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: rustfs
      protocol: TCP
      name: rustfs
    - port: 9001
      targetPort: console
      protocol: TCP
      name: console
  selector:
    {{- include "agentarea.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
---
{{- if .Values.rustfs.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-rustfs-pvc
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rustfs.persistence.size }}
{{- end }}
---
{{- if .Values.rustfs.defaultBuckets }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentarea.fullname" . }}-rustfs-bucket-init
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs-bucket-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs-bucket-init
    spec:
      restartPolicy: Never
      containers:
        - name: mc
          image: "minio/mc:latest"
          command:
            - sh
            - -c
            - |
              mc alias set local http://{{ .Release.Name }}-rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY"
              mc mb -p local/{{ .Values.rustfs.defaultBuckets }} || true
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-user
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.rustfs }}
                  key: root-password
{{- end }}
{{- end }}
