[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-api"
version = "0.0.10"
description = "AgentArea API application"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "agentarea-agents",
    "agentarea-execution",
    "agentarea-llm",
    "agentarea-mcp",
    "agentarea-registry",
    "agentarea-tasks",
    "agentarea-secrets",
    "agentarea-triggers",
    "agentarea-openapi",
    "agentarea-projects",
    "agentarea-wallet",
    "alembic>=1.15.2",
    "uvicorn>=0.34.0",
    "fastapi>=0.104.0",
    "mcp[cli]>=1.9.2",
    "python-multipart>=0.0.26",
    "click>=8.1.8",
    "pyjwt[crypto]>=2.12.0",
    "fastmcp>=3.2.0",
    "croniter>=6.2.2",
]

[tool.uv.sources]
agentarea-common = { workspace = true }
agentarea-agents = { workspace = true }
agentarea-execution = { workspace = true }
agentarea-llm = { workspace = true }
agentarea-mcp = { workspace = true }
agentarea-registry = { workspace = true }
agentarea-tasks = { workspace = true }
agentarea-secrets = { workspace = true }
agentarea-triggers = { workspace = true }
agentarea-openapi = { workspace = true }
agentarea-projects = { workspace = true }
agentarea-wallet = { workspace = true }

[project.scripts]
agentarea-api = "agentarea_api.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["agentarea_api"]
