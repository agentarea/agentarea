name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install bumpversion
        run: pip install bumpversion

      - name: Verify version sync before bump
        shell: bash
        run: |
          bash scripts/verify-version-sync.sh

      - name: Bump version
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          type="${{ github.event.inputs.release_type }}"

          # Handle pre-release types (alpha, beta, rc)
          if [[ "$type" == "alpha" || "$type" == "beta" || "$type" == "rc" ]]; then
            current_version=$(cat VERSION | tr -d '\n')

            # Check if already a pre-release
            if [[ "$current_version" =~ -([a-z]+)\.([0-9]+)$ ]]; then
              current_release="${BASH_REMATCH[1]}"
              current_build="${BASH_REMATCH[2]}"
              base_version="${current_version%-*}"

              # If same release type, bump build number
              if [[ "$current_release" == "$type" ]]; then
                bumpversion build --allow-dirty
              else
                # Different release type, bump to new release type
                bumpversion release --allow-dirty --new-version="${base_version}-${type}.1"
              fi
            else
              # Not a pre-release, bump patch and add pre-release suffix
              bumpversion patch --allow-dirty
              new_base=$(cat VERSION | tr -d '\n')
              bumpversion --new-version="${new_base}-${type}.1" --allow-dirty patch
            fi
          else
            # Standard release (patch, minor, major)
            bumpversion $type --allow-dirty
          fi

          new_version=$(cat VERSION | tr -d '\n')
          echo "VERSION=v${new_version}" >> $GITHUB_OUTPUT
          echo "Bumped version to v${new_version}"

      - name: Update Helm chart appVersion
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/update-appversion.py

      - name: Verify version sync after bump
        shell: bash
        run: |
          bash scripts/verify-version-sync.sh

      - name: Create release branch and PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Release ${{ steps.get-version.outputs.VERSION }}"
          branch: "release/${{ steps.get-version.outputs.VERSION }}"
          body: |
            ## Release ${{ steps.get-version.outputs.VERSION }}

            This PR contains version bumps for release ${{ steps.get-version.outputs.VERSION }}.

            ### Changes
            - Bumped application version across all packages to ${{ steps.get-version.outputs.VERSION }}
            - Updated Helm chart `appVersion` to ${{ steps.get-version.outputs.VERSION }}
            - Chart `version` remains independent (managed separately in Chart.yaml)

            ### Version Synchronization
            All versions verified and synchronized:
            - ✅ VERSION file: ${{ steps.get-version.outputs.VERSION }}
            - ✅ All pyproject.toml files
            - ✅ package.json
            - ✅ Chart.yaml appVersion
            - ✅ .bumpversion.cfg

            **Note:** Helm chart version is managed independently. If chart configuration
            changes were made, bump the chart version in `charts/agentarea/Chart.yaml` separately.

            ### Checklist
            - [ ] Review version changes
            - [ ] Verify all package versions are updated correctly
            - [ ] Add release notes to CHANGELOG (if applicable)
            - [ ] If chart configs changed, bump chart version independently
            - [ ] Merge this PR to trigger automated build and publish

            **Note:** Merging this PR will automatically trigger the release pipeline to build Docker images, publish Helm charts, and create a Git tag.
          labels: release
          commit-message: "chore(release): bump versions to ${{ steps.get-version.outputs.VERSION }}"
