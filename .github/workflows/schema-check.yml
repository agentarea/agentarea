name: OpenAPI Drift Check

# Guards that the committed agentarea-webapp/src/api/openapi.json (the source of
# truth for the frontend's generated hey-api client) stays in sync with what the
# FastAPI backend actually produces. Triggers on backend changes so a backend
# edit that forgets to refresh the committed spec fails here.
#
# The complementary check — that the GENERATED client matches this openapi.json —
# lives in frontend-integration.yml (cheap, frontend-only, no backend needed).

on:
  pull_request:
    branches: [main]
    paths:
      - 'agentarea-platform/apps/api/**'
      - 'agentarea-platform/libs/**'
      - 'agentarea-webapp/src/api/openapi.json'
      - 'docs/api-reference/openapi.json'
      - 'scripts/check-openapi-drift.sh'
      - 'scripts/export-openapi.py'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          # Pinned: an unpinned setup-uv resolves to whatever uv shipped that day, which
          # is how uv.lock kept getting rewritten. Bump with pyproject required-version.
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: agentarea-platform
        run: uv sync --all-extras

      # Export from FastAPI, then diff against the committed spec and its
      # docs/ copy.
      - name: Check for spec drift
        run: make -C agentarea-platform openapi-drift
