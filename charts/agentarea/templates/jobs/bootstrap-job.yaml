{{- if .Values.jobs.bootstrap.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentarea.fullname" . }}-bootstrap
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # This job is a standard resource that runs after installation/upgrade.
    # We remove Helm hooks to avoid dependency deadlocks and allow ArgoCD to manage it.
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: {{ include "agentarea.fullname" . }}-bootstrap
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bootstrap
      {{- if .Values.jobs.bootstrap.seedData }}
      annotations:
        # Force job re-run when seed data changes
        checksum/seed-data: {{ include (print $.Template.BasePath "/configmaps/bootstrap-seed-data.yaml") . | sha256sum }}
      {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      initContainers:
        # Wait for PostgreSQL to be ready
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "agentarea.database.host" . }} -p {{ .Values.global.database.port }} -U postgres; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.postgresql }}
                  key: password
        # Wait for MinIO to be ready
        {{- if .Values.minio.enabled }}
        - name: wait-for-minio
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -f http://{{ include "agentarea.minio.host" . }}:9000/minio/health/live; do
                echo "Waiting for MinIO to be ready..."
                sleep 2
              done
              echo "MinIO is ready!"
        {{- end }}
      containers:
        - name: bootstrap
          image: "{{ .Values.global.image.registry }}{{ if .Values.global.image.registry }}/{{ end }}{{ .Values.jobs.bootstrap.image.repository | default "agentarea/agentarea-bootstrap" }}:{{ .Values.jobs.bootstrap.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          env:
            {{- include "agentarea.databaseJobs.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.databaseJobs.envs" . | nindent 12 }}
            {{- if .Values.minio.enabled }}
            # MinIO configuration
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.minio }}
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.minio }}
                  key: root-password
            - name: MINIO_ENDPOINT
              value: "http://{{ include "agentarea.minio.host" . }}:9000"
            {{- end }}

            # Admin user configuration
            - name: ADMIN_EMAIL
              value: {{ .Values.jobs.bootstrap.adminEmail | default "admin@example.com" | quote }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.jobs.bootstrap.adminPassword | default "changeme" | quote }}
            - name: ORGANIZATION_NAME
              value: {{ .Values.jobs.bootstrap.organizationName | default "AgentArea" | quote }}

            # Seed data paths — mounted from ConfigMap when seedData is provided,
            # otherwise falls back to files baked into the Docker image
            - name: LLM_PROVIDERS_YAML
              value: {{ if .Values.jobs.bootstrap.seedData }}"/seed-data/providers.yaml"{{ else }}"/app/llm/providers.yaml"{{ end }}
            - name: MCP_PROVIDERS_YAML
              value: {{ if .Values.jobs.bootstrap.seedData }}"/seed-data/mcp_providers.yaml"{{ else }}"/app/llm/mcp_providers.yaml"{{ end }}
            - name: SKILLS_YAML
              value: {{ if .Values.jobs.bootstrap.seedData }}"/seed-data/skills.yaml"{{ else }}"/app/llm/skills.yaml"{{ end }}
            - name: AGENTS_YAML
              value: {{ if .Values.jobs.bootstrap.seedData }}"/seed-data/agents.yaml"{{ else }}"/app/llm/agents.yaml"{{ end }}
            {{- if .Values.jobs.bootstrap.registries }}
            - name: REGISTRIES_CONFIG
              value: {{ .Values.jobs.bootstrap.registries | toJson | quote }}
            {{- end }}
            {{- if .Values.jobs.bootstrap.providerConfigs }}
            - name: PROVIDER_CONFIGS
              value: {{ .Values.jobs.bootstrap.providerConfigs | toJson | quote }}
            {{- end }}
            {{- range .Values.jobs.bootstrap.providerSecrets }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          {{- if .Values.jobs.bootstrap.seedData }}
          volumeMounts:
            - name: seed-data
              mountPath: /seed-data
              readOnly: true
          {{- end }}
      {{- if .Values.jobs.bootstrap.seedData }}
      volumes:
        - name: seed-data
          configMap:
            name: {{ include "agentarea.fullname" . }}-bootstrap-seed
      {{- end }}
{{- end }}
