{{- if and .Values.kratos.enabled .Values.postgresql.enabled .Values.kratos.database.createJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "agentarea.fullname" . }}-create-kratos-db
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: create-kratos-db
  annotations:
    # This job is a standard resource that waits for the database to be ready.
    # We use internal retry logic instead of Helm hooks to avoid dependency deadlocks.
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: create-kratos-db
    spec:
      restartPolicy: Never
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: "postgres:alpine"
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until pg_isready -h {{ include "agentarea.database.host" . }} -U $POSTGRES_USER; do echo waiting for database; sleep 2; done;']
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secrets.postgresql }}"
                  key: username
      containers:
        - name: create-db
          image: "postgres:alpine"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              echo "Checking/Creating kratos database..."
              export PGPASSWORD=$POSTGRES_PASSWORD
              psql -h {{ include "agentarea.database.host" . }} -U $POSTGRES_USER -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '{{ .Values.kratos.database.name | default "kratos" }}'" | grep -q 1 || \
              psql -h {{ include "agentarea.database.host" . }} -U $POSTGRES_USER -d postgres -c "CREATE DATABASE {{ .Values.kratos.database.name | default "kratos" }};"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secrets.postgresql }}"
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.global.secrets.postgresql }}"
                  key: password
{{- end }}
