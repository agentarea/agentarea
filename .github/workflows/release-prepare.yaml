name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  # Step 1: Validate current state BEFORE making any changes
  validate-current-state:
    uses: ./.github/workflows/ci.yml
    with:
      skip-docker: true
    secrets: inherit

  # Step 2: Bump version and create release branch (only after validation passes)
  prepare-and-bump:
    needs: validate-current-state
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
      branch: ${{ steps.get-version.outputs.BRANCH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Verify version sync before bump
        shell: bash
        run: |
          bash scripts/verify-version-sync.sh

      - name: Bump version
        id: get-version
        shell: bash
        run: |
          set -euo pipefail
          type="${{ github.event.inputs.release_type }}"

          # Use our custom bump script
          python3 scripts/bump-version.py "$type"

          # Read the new version
          new_version=$(cat VERSION | tr -d '\n')
          echo "VERSION=v${new_version}" >> $GITHUB_OUTPUT
          echo "BRANCH=release/v${new_version}" >> $GITHUB_OUTPUT

      - name: Verify version sync after bump
        shell: bash
        run: |
          bash scripts/verify-version-sync.sh

      - name: Commit and push release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.get-version.outputs.BRANCH }}"
          git add -A
          git commit -m "chore(release): bump versions to ${{ steps.get-version.outputs.VERSION }}"
          git push origin "${{ steps.get-version.outputs.BRANCH }}"

  # Step 3: Create PR (only after validation passes and branch is created)
  create-pr:
    needs: prepare-and-bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-and-bump.outputs.branch }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release ${{ needs.prepare-and-bump.outputs.version }}" \
            --base main \
            --head "${{ needs.prepare-and-bump.outputs.branch }}" \
            --label release \
            --body "$(cat <<'EOF'
          ## Release ${{ needs.prepare-and-bump.outputs.version }}

          This PR contains version bumps for release ${{ needs.prepare-and-bump.outputs.version }}.

          **✅ All CI checks passed before release branch creation**
          - Current state validated before version bump
          - Linting: Platform, Webapp, MCP Manager
          - Tests: Platform, MCP Manager
          - Builds: API, Worker, Webapp

          ### Changes
          - Bumped application version across all packages to ${{ needs.prepare-and-bump.outputs.version }}
          - Updated Helm chart \`appVersion\` to ${{ needs.prepare-and-bump.outputs.version }}
          - Chart \`version\` remains independent (managed separately in Chart.yaml)

          ### Version Synchronization
          All versions verified and synchronized:
          - ✅ VERSION file: ${{ needs.prepare-and-bump.outputs.version }}
          - ✅ All pyproject.toml files
          - ✅ package.json
          - ✅ Chart.yaml appVersion
          - ✅ .bumpversion.cfg

          **Note:** Helm chart version is managed independently. If chart configuration
          changes were made, bump the chart version in \`charts/agentarea/Chart.yaml\` separately.

          ### Checklist
          - [ ] Review version changes
          - [ ] Verify all package versions are updated correctly
          - [ ] Add release notes to CHANGELOG (if applicable)
          - [ ] If chart configs changed, bump chart version independently
          - [ ] Merge this PR to trigger automated build and publish

          **Note:** Merging this PR will automatically trigger the release pipeline to build Docker images, publish Helm charts, and create a Git tag.
          EOF
          )"
