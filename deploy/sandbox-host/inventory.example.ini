# Copy to inventory.ini and edit. One entry per dedicated sandbox host.
[sandbox_hosts]
sandbox-eu-1 ansible_host=203.0.113.10 ansible_user=root

[sandbox_hosts:vars]
# Free-form region label for this host (consumed later by control-plane
# placement; the host itself ignores it).
sandbox_region=eu-central

# Publish the executor only on a private interface if you have one; otherwise
# lock the port down with your cloud firewall / security group to the
# mcp-manager source IP(s). The HMAC secret gates every /execute regardless.
sandbox_executor_bind_addr=0.0.0.0
sandbox_executor_host_port=8080

# Provide the shared HMAC secret out-of-band, never in this file:
#   export SANDBOX_ACTIVATION_AUTH_SECRET=...   # same value mcp-manager uses
#   ansible-playbook -i inventory.ini site.yml \
#     -e sandbox_activation_auth_secret="$SANDBOX_ACTIVATION_AUTH_SECRET"
