[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

# Migration filenames: <UTC-date>_<UTC-time>_<slug>.py — chronological in `ls`,
# no merge collisions between parallel PRs. See agentarea-platform/AGENTS.md.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
# Revision ids are capped to 32 chars in env.py (alembic_version VARCHAR(32));
# keep the filename slug in step so file name and revision id stay aligned.
truncate_slug_length = 18

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S 