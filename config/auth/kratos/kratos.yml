# Ory Kratos Configuration for AgentArea

version: v1.3.1

# DSN is overridden via docker-compose environment variable via -c flag
# The docker-compose passes DSN through the environment variable
dsn: ${DSN}

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls:
    - http://localhost:3000

  flows:
    error:
      ui_url: http://localhost:3000/auth/error

    settings:
      ui_url: http://localhost:3000/auth/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://localhost:3000/auth/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:3000/auth/verification
      use: code
      after:
        default_browser_return_url: http://localhost:3000/workplace

    logout:
      after:
        default_browser_return_url: http://localhost:3000/auth/login

    login:
      ui_url: http://localhost:3000/auth/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:3000/workplace

    registration:
      lifespan: 10m
      ui_url: http://localhost:3000/auth/registration
      after:
        default_browser_return_url: http://localhost:3000/workplace
        oidc:
          hooks:
            - hook: session

  methods:
    password:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            # Client ID is overridden via docker-compose environment variable via -c flag
            # The docker-compose passes OIDC_GOOGLE_CLIENT_ID through the environment variable
            client_id: ${SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID}
            client_secret: ${SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
              - openid
          - id: github
            provider: github
            # Client ID is overridden via docker-compose environment variable via -c flag
            # The docker-compose passes OIDC_GITHUB_CLIENT_ID through the environment variable
            client_id: ${SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID}
            client_secret: ${SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.github.jsonnet
            scope:
              - user:email
              - read:user

log:
  level: debug
  format: text
  leak_sensitive_values: true

# Secrets are intentionally NOT defined here. Kratos reads them from the
# environment (SECRETS_COOKIE / SECRETS_CIPHER), which the compose files supply
# from KRATOS_SECRETS_COOKIE / KRATOS_SECRETS_CIPHER. Leaving them unset here
# means a deployment that forgets to provide them fails to start instead of
# silently running on a published value. The cipher secret must be exactly
# 32 characters (xchacha20-poly1305).

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://user:pass@host.docker.internal:1025/?skip_ssl_verify=true
    from_address: noreply@agentarea.local
    from_name: AgentArea

session:
  cookie:
    same_site: Lax
    domain: localhost
    path: /
  whoami:
    tokenizer:
      templates:
        agentarea_jwt:
          # Private signing key, generated per-install by scripts/install.sh and
          # mounted from ./config/auth/kratos. Never commit this file.
          jwks_url: file:///etc/config/kratos/jwks.json
          claims_mapper_url: base64:
          ttl: 30m
