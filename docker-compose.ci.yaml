# CI overlay for docker-compose.yaml — used by the OpenAPI fuzz job.
#
# Three things differ from local dev:
#   1. The API image is BUILT from the PR source in the job and tagged
#      `agentarea/agentarea-api:latest`, so we must NOT re-pull it from the
#      registry (the base file sets `pull_policy: always`).
#   2. The fuzz harness mints ephemeral Kratos identities from the GitHub
#      runner host, which needs the Kratos ADMIN API (4434) published — the
#      base file only exposes the public API (4433).
#   3. rustfs uses a named volume instead of the base bind mount. The base
#      file mounts `./data/rustfs:/data`; on the Linux runner that fresh host
#      dir is root-owned, so rustfs (non-root in-container) hits `Permission
#      denied (os error 13)` and exits(1) at boot — crashing `app`'s
#      service_healthy dependency. A named volume is initialized by Docker
#      with ownership matching the image's user (this is what dev already
#      does), so rustfs can write. Bind mounts happen to work locally only
#      because Docker Desktop's VM is permissive about mount ownership.
#
# Usage: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml up -d app kratos temporal
services:
  app:
    pull_policy: never
  app_migrations:
    pull_policy: never
  rustfs:
    volumes:
      - rustfs_ci_data:/data
  kratos:
    ports:
      - "4434:4434" # admin API — additive to the base 4433 (public)

volumes:
  rustfs_ci_data:
