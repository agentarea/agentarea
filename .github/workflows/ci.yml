  docker-api:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.platform_libs == 'true')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, platform-lint, platform-test, platform-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: api
      context: agentarea-platform
      dockerfile: agentarea-platform/apps/api/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  performance:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.platform == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          # Pinned: an unpinned setup-uv resolves to whatever uv shipped that day, which
          # is how uv.lock kept getting rewritten. Bump with pyproject required-version.
          version: "0.8.22"

      # Runs unconditionally, so on real GitHub Actions it reinstalls uv over the
      # version setup-uv just pinned. Pinned to the same version so both paths agree
      # rather than this one silently winning with whatever is latest.
      - name: Install uv (act fallback)
        run: |
          curl -Ls https://astral.sh/uv/0.8.22/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --group dev

      - name: Benchmark build performance
        run: make -s -C agentarea-platform bench-build >> "$GITHUB_STEP_SUMMARY"
  docker-worker:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && (needs.changes.outputs.worker == 'true' || needs.changes.outputs.platform_libs == 'true')) ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, platform-lint, platform-test, platform-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: worker
      context: agentarea-platform
      dockerfile: agentarea-platform/apps/worker/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-frontend:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.webapp == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, webapp-lint, webapp-build]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: frontend
      context: agentarea-webapp
      dockerfile: agentarea-webapp/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-operator:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.operator == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: operator
      context: agentarea-operator
      dockerfile: agentarea-operator/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}
  docker-agentarea-mcp-manager:
    # Always build to validate, but only push on main when not skipped
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_manager == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, mcp-manager-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-manager
      context: agentarea-mcp-manager
      dockerfile: agentarea-mcp-manager/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-runner:
    # Build the mutable runner used by package-install=allowed pools.
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_manager == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, mcp-manager-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-runner
      image-name: agentarea/agentarea-mcp-runner
      context: agentarea-mcp-manager
      dockerfile: agentarea-mcp-manager/Dockerfile.runner
      build-args: |
        MANAGED_ENVIRONMENT=mutable
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  docker-agentarea-mcp-runner-locked:
    # Build the immutable runner used by package-install=locked pools.
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.mcp_manager == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, mcp-manager-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: mcp-runner-locked
      image-name: agentarea/agentarea-mcp-runner-locked
      context: agentarea-mcp-manager
      dockerfile: agentarea-mcp-manager/Dockerfile.runner
      build-args: |
        MANAGED_ENVIRONMENT=immutable
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  webapp-lint:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm -C agentarea-webapp run lint

  webapp-build:
    runs-on: ubuntu-latest
    needs: [changes, webapp-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && needs.webapp-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm -C agentarea-webapp run check:build

  webapp-test:
    runs-on: ubuntu-latest
    needs: [changes, webapp-lint]
    # Always run when: called as reusable workflow, on main, on release PRs, or if webapp changes detected
    if: |
      always() && !cancelled() && needs.webapp-lint.result == 'success' && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.webapp == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      # jsdom (and its undici dependency) requires Node's worker_threads.markAsUncloneable,
      # which Node 20 (used by the other webapp jobs) does not have — the vitest workers
      # crash on import with "webidl.util.markAsUncloneable is not a function". jsdom's own
      # engines field wants ^22.22.2 || ^24.15.0 || >=26.0.0; 22 is the smallest bump that
      # satisfies it and stays closest to the Node 20 used elsewhere in this workflow.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-webapp/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-webapp
        run: pnpm install --frozen-lockfile

      # vitest.config.ts scopes `include` to src/**, which already excludes the
      # vendored packages/elements-react and packages/nextjs (upstream Ory code).
      - name: Run unit tests
        run: pnpm -C agentarea-webapp run test

  cli-test:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if cli changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.cli == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-cli/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: agentarea-cli
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm -C agentarea-cli run check

  mcp-manager-lint-test:
    runs-on: ubuntu-latest
    needs: changes
    # Always run when: called as reusable workflow, on main, on release PRs, or if mcp_manager changes detected
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.mcp_manager == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Must match GOLANGCI_LINT_VERSION in agentarea-mcp-manager/Makefile.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - name: Build, test, lint
        run: make -C agentarea-mcp-manager check

  events-lint-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.events == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Must match GOLANGCI_LINT_VERSION in agentarea-event-service/Makefile.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - name: Build, test, lint
        run: make -C agentarea-event-service check

  docker-events:
    if: |
      (github.ref == 'refs/heads/main' && needs.changes.outputs.events == 'true') ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
      inputs.skip-docker
    needs: [changes, version-check, events-lint-test]
    permissions:
      packages: write
      contents: read
    uses: ./.github/workflows/docker-build-push.yml
    with:
      component: events
      context: agentarea-event-service
      dockerfile: agentarea-event-service/Dockerfile
      use-private-registry: false
      push: ${{ !inputs.skip-docker && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      DOCKER_REGISTRY_MIRROR: ${{ secrets.DOCKER_REGISTRY_MIRROR }}
      DOCKER_REGISTRY_MIRROR_PATH: ${{ secrets.DOCKER_REGISTRY_MIRROR_PATH }}
      DOCKER_REGISTRY_MIRROR_USERNAME: ${{ secrets.DOCKER_REGISTRY_MIRROR_USERNAME }}
      DOCKER_REGISTRY_MIRROR_PASSWORD: ${{ secrets.DOCKER_REGISTRY_MIRROR_PASSWORD }}

  # Only the DB-gated tests/test_provider_config_sql_db.py runs today, inside
  # migrations-gate (it needs the real migrated schema). These are the other
  # two suites, which mock everything out and need no database.
  operator-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.operator == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          # Pinned: an unpinned setup-uv resolves to whatever uv shipped that day, which
          # is how uv.lock kept getting rewritten. Bump with pyproject required-version.
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "agentarea-operator/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-operator
        run: uv sync --group dev

      - name: Run tests
        run: make -C agentarea-operator check

  # Migration safety gate: a broken or conflicting migration is a top cause of
  # prod incidents. Prove migrations apply cleanly on a fresh DB, that there is
  # exactly one head (no unmerged branches), and that a downgrade roundtrips.
  migrations-gate:
    runs-on: ubuntu-latest
    needs: changes
    # Also runs on mcp_manager and operator changes: this job owns the only
    # database carrying the real migrated schema, and both write hand-written SQL
    # against it that is checked below. Either side can break the pairing — a
    # migration dropping a column, or the SQL starting to reference one — so all
    # of them must trigger the gate.
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_call' ||
        github.ref == 'refs/heads/main' ||
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'release/')) ||
        needs.changes.outputs.platform == 'true' ||
        needs.changes.outputs.mcp_manager == 'true' ||
        needs.changes.outputs.operator == 'true'
      )
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentarea_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agentarea_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          # Pinned: an unpinned setup-uv resolves to whatever uv shipped that day, which
          # is how uv.lock kept getting rewritten. Bump with pyproject required-version.
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: agentarea-platform
        run: uv sync --group dev

      # The MCP manager's Go SQL is checked against the migrated schema too.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Migrations heads/upgrade/roundtrip, then every schema-backed suite
      # (Python, MCP manager Go SQL, operator SQL). The list lives in
      # agentarea-platform/scripts/check-db.sh.
      - name: Migrations + schema-backed suites
        run: make -C agentarea-platform check-db

  # Single required status check for branch protection. Monorepo path filters
  # skip irrelevant jobs (they report "skipped", not "failure"), so a per-job
  # required check is unworkable; this aggregator is the one check to require.
  ci-required:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - version-check
      - platform-lint
      - platform-test
      - platform-build
      - migrations-gate
      - webapp-lint
      - webapp-build
      - webapp-test
      - cli-test
      - mcp-manager-lint-test
      - events-lint-test
      - operator-test
      - docker-api
      - docker-worker
      - docker-frontend
      - docker-operator
      - docker-agentarea-mcp-manager
      - docker-agentarea-mcp-runner
      - docker-agentarea-mcp-runner-locked
      - docker-events
    steps:
      - name: Verify no required job failed
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A required CI job did not pass (result: $r). See the job graph above."
              exit 1
            fi
          done
          echo "All required jobs passed or were legitimately skipped."
