name: Release CLI

# Publishes @agentarea/cli to npm.
#
# Versioned INDEPENDENTLY from the platform (VERSION / docker images / helm).
# A release is a version bump of agentarea-cli/package.json merged to main:
# when that version is not on npm yet, it is STAGED on npm. A maintainer then
# approves it with 2FA (npmjs.com, or `npm stage approve <stage-id>`); only
# then is it published. A push that leaves the version alone stages nothing.
#
# Authenticates through npm Trusted Publishing (OIDC), which for this package
# may only stage, not publish directly. No npm token is stored in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'agentarea-cli/package.json'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentarea-cli
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 9

      - name: Cache pnpm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'agentarea-cli/pnpm-lock.yaml'

      - name: Is this version new
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@agentarea/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@agentarea/cli@$VERSION is already on npm; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.version.outputs.release == 'true'
        run: pnpm run test

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: pnpm run build

      - name: Stage on npm
        if: steps.version.outputs.release == 'true'
        run: |
          set -o pipefail
          npm install -g npm@^12
          # npm exchanges the GitHub OIDC token itself only for `npm publish`;
          # for `npm stage publish` the exchange is done here.
          ID_TOKEN="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          NPM_TOKEN="$(curl -sS -X POST -H "Authorization: Bearer $ID_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%40agentarea%2Fcli" \
            | tee exchange.json | jq -r '.token // empty')"
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::npm refused the OIDC exchange: $(cat exchange.json)"
            exit 1
          fi
          echo "::add-mask::$NPM_TOKEN"
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" \
            npm stage publish --provenance --access public . | tee stage.log
          {
            echo "### @agentarea/cli@${{ steps.version.outputs.version }} staged"
            echo
            echo 'Approve it on npmjs.com or with `npm stage approve <stage-id>`:'
            echo
            echo '```'
            cat stage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
