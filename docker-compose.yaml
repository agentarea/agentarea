version: "3.8"
services:
  app:
    image: agentarea/agentarea-api:${VERSION:-latest}
    container_name: agentarea-backend
    ports:
      - "8000:8000"
    restart: always
    pull_policy: always
    environment:
      # S3 settings
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      # Database settings
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MCP settings
      - MCP_MANAGER_URL=http://agentarea-mcp-manager:80/api/mcp
      - REDIS_URL=redis://valkey:6379
      - MCP_CLIENT_TIMEOUT=30
      # Server settings
      - PORT=${PORT:-8000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RELOAD=${RELOAD:-false}
      - WORKERS=${WORKERS:-1}
      - WORKFLOW__TEMPORAL_SERVER_URL=${WORKFLOW__TEMPORAL_SERVER_URL:-temporal:7233}
      - WORKFLOW__TEMPORAL_NAMESPACE=default
      - WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
      - SECRET_MANAGER_ENCRYPTION_KEY=${SECRET_MANAGER_ENCRYPTION_KEY}
      - KRATOS_JWKS_B64=${KRATOS_JWKS_B64}
      - KRATOS_ISSUER=${KRATOS_ISSUER:-http://localhost:4433}
      - KRATOS_AUDIENCE=${KRATOS_AUDIENCE:-agentarea-api}
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      valkey:
        condition: service_started
      app_migrations:
        condition: service_completed_successfully
      # mcp-manager:
      #   condition: service_healthy
    # Probed with Python rather than curl, which the API image does not ship.
    # app_catalog waits on this, so without it compose refuses to start.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - mcp-network
      - temporal-network

  app_migrations:
    image: agentarea/agentarea-api:${VERSION:-latest}
    pull_policy: always
    environment:
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    command: ["agentarea-api", "migrate"]
    working_dir: /app/apps/api

  # Populates the built-in MCP catalog once the API answers. Idempotent, so it
  # re-runs harmlessly on every `up` and picks up catalog additions; run it on
  # demand with `docker compose run --rm app_catalog`. Registry data lives in
  # the database, not on disk, which is why a load step exists at all.
  app_catalog:
    image: agentarea/agentarea-api:${VERSION:-latest}
    pull_policy: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      app:
        condition: service_healthy
    command:
      [
        "agentarea-api",
        "reconcile",
        "--source",
        "${CATALOG_MCP_SOURCE:-https://agentarea-mcp-registry.s3.amazonaws.com/registry/mcp-servers.json}",
      ]
    working_dir: /app/apps/api
    restart: "no"

  # Create the main app database and auxiliary databases — idempotent.
  postgres_init:
    image: postgres:18
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for db in "${POSTGRES_DB:-agentarea}" "${TEMPORAL_DB:-temporal}" "${KRATOS_DB:-kratos}"; do
          exists=$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" != "1" ]; then
            echo "Creating database $$db"
            psql -c "CREATE DATABASE \"$$db\""
          else
            echo "Database $$db already exists"
          fi
        done
    depends_on:
      db:
        condition: service_healthy

  # Frontend service
  frontend:
    image: agentarea/agentarea-frontend:${VERSION:-latest}
    container_name: agentarea-frontend
    ports:
      - "3000:3000"
    restart: always
    pull_policy: always
    environment:
      # - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - API_URL=${API_URL:-http://app:8000}
      - ORY_ADMIN_URL=${ORY_ADMIN_URL:-http://kratos:4434}
      # ORY_SDK_URL: internal Docker URL for server-side API calls to Kratos
      - ORY_SDK_URL=${ORY_SDK_URL:-http://kratos:4433}
      - ORY_BROWSER_URL=${ORY_BROWSER_URL:-http://localhost:4433}
      - API_BROWSER_URL=${API_BROWSER_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ORY_SDK_URL=${NEXT_PUBLIC_ORY_SDK_URL:-http://localhost:4433}
    networks:
      - default
      - auth-network

  rustfs:
    image: rustfs/rustfs:latest
    volumes:
      - ./data/rustfs:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres  # Maintenance DB; postgres_init creates the main app DB plus aux DBs
    volumes:
      # postgres:18 stores data under /var/lib/postgresql/<ver>/docker, so the
      # mount must target the parent dir — mounting the legacy .../data path
      # makes the image refuse to start. Matches docker-compose.dev.yaml.
      - ./data/postgres:/var/lib/postgresql
    # Reap orphans with an init process instead of the postmaster. Without it
    # PID 1 is postgres itself, so a healthcheck killed on timeout leaves its
    # pg_isready reparented onto the postmaster, which reads any untracked
    # child exit as a backend crash and restarts the whole cluster. Recovery
    # over the bind mount then outlasts the next probe and the loop feeds
    # itself: the database spends its life rejecting connections.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      # Long enough to cover an fsync-bound start on a bind mount; a probe that
      # is killed for being slow is the input to the loop described above.
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - temporal-network
      - auth-network

  valkey:
    image: valkey/valkey:8
    container_name: agentarea-valkey
    restart: always
    volumes:
      - ./data/valkey:/data
    networks:
      - default
      - mcp-network

  agentarea-mcp-manager:
    image: agentarea/agentarea-mcp-manager:${VERSION:-latest}
    container_name: agentarea-mcp-manager
    restart: unless-stopped
    ports:
      - "7999:80" # Internal proxy (unified entry point)
    volumes:
      # Manager drives MCP containers through the host Docker socket (docker CLI
      # ships in the image). No podman, no privileged mode.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mcp-network
      - default
    environment:
      LOG_LEVEL: INFO
      # The rest of the stack addresses the manager as
      # http://agentarea-mcp-manager:80, and the published port maps to 80.
      # The binary otherwise listens on 8000, which leaves both dead.
      SERVER_PORT: "80"
      # Spawned MCP workloads join the segregated MCP network rather than the
      # project default, which also carries the database and Redis.
      MCP_NETWORK: agentarea_mcp-network
      REDIS_URL: redis://valkey:6379
      CORE_API_URL: http://app:8000
      # Demand gateway: MCP workloads start on the first call and are reclaimed
      # after MCP_IDLE_TIMEOUT (0 keeps them running once started). All four are
      # required — the gateway refuses to configure itself without them.
      MCP_REQUEST_LEASE_TTL: "90s"
      MCP_GATEWAY_STARTUP_TIMEOUT: "5m"
      MCP_IDLE_TIMEOUT: "10m"
      MCP_IDLE_SWEEP_INTERVAL: "60s"
      # Admission lists for MCP instances, mirroring the chart defaults in
      # charts/agentarea/values.yaml (mcpManager.admission). Both are required
      # and an absent list is refused: "not decided yet" must not read as
      # "allow everything". Declare one empty to disable that instance type.
      MCP_ALLOWED_IMAGE_REPOSITORIES: "ghcr.io/github/github-mcp-server,mcp/fetch"
      MCP_ALLOWED_COMMAND_PACKAGES: "npx -y @modelcontextprotocol/server-everything,npx -y @modelcontextprotocol/server-sequential-thinking,uvx mcp-server-fetch,uvx mcp-server-time"
      # Run the sandbox execution consumer in-process (no standalone runner in
      # compose) and route code-execution to the sandbox-executor container.
      SANDBOX_EMBEDDED_RUNNER: "true"
      SANDBOX_EXECUTOR_URL: http://sandbox-executor:8080
      # Explicit acknowledgement: the compose executor shares this host's
      # kernel and is not an isolation boundary for hostile multi-tenant code.
      # Kubernetes replaces it with per-task warm-pool pods under a sandboxed
      # runtime class; the manager refuses the shared path without this flag.
      SANDBOX_SHARED_EXECUTOR_ALLOW_WEAK_ISOLATION_FOR_DEVELOPMENT: "true"
      SANDBOX_ACTIVATION_AUTH_SECRET: ${SANDBOX_ACTIVATION_AUTH_SECRET:?SANDBOX_ACTIVATION_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}
      SANDBOX_CLEANUP_AUTH_SECRET: ${SANDBOX_CLEANUP_AUTH_SECRET:?SANDBOX_CLEANUP_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}
      SANDBOX_FILE_AUTH_SECRET: ${SANDBOX_FILE_AUTH_SECRET:?SANDBOX_FILE_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}
      SANDBOX_CONTROL_AUTH_SECRET: ${SANDBOX_CONTROL_AUTH_SECRET:?SANDBOX_CONTROL_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}
      MCP_GATEWAY_AUTH_SECRET: ${MCP_GATEWAY_AUTH_SECRET:?MCP_GATEWAY_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}
      # Lifecycle and admission policy. The manager refuses to start when any
      # value is absent or malformed rather than inventing retention behavior,
      # so these belong here in the deployment config — the binary holds no
      # defaults. Helm emits the same set from .Values.sandboxRuntime.
      SANDBOX_TASK_LEASE_TTL: "2h"
      SANDBOX_TASK_IDLE_TTL: "15m"
      SANDBOX_PROVIDER_PROVISIONING_TIMEOUT: "30s"
      SANDBOX_PROVIDER_SESSION_TTL: "24h"
      SANDBOX_EXECUTION_RECORD_TTL: "24h"
      SANDBOX_MAX_EXECUTION_TIMEOUT_SECONDS: "1800"
      SANDBOX_DEFAULT_EXECUTION_TIMEOUT_SECONDS: "120"
      SANDBOX_EXECUTION_QUEUE_TIMEOUT: "5m"
      SANDBOX_EXECUTION_COMPLETION_GRACE: "2m"
      SANDBOX_ALLOW_INTERNET: ${SANDBOX_ALLOW_INTERNET:-true}
      # The trusted control plane resolves immutable workspace refs in S3 and
      # gives the executor signed URLs. These credentials are not passed to the
      # executor or to task processes.
      SANDBOX_WORKSPACE_PROVIDER: s3
      SANDBOX_WORKSPACE_MAX_FILES: "10000"
      SANDBOX_WORKSPACE_MAX_FILE_BYTES: "268435456"
      SANDBOX_WORKSPACE_MAX_BYTES: "2147483648"
      SANDBOX_WORKSPACE_SIGNED_URL_TTL: "1h"
      SANDBOX_WORKSPACE_S3_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
      SANDBOX_WORKSPACE_S3_ENDPOINT: http://rustfs:9000
      SANDBOX_WORKSPACE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      SANDBOX_WORKSPACE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      # Secret manager configuration
      SECRET_MANAGER_TYPE: ${SECRET_MANAGER_TYPE:-database}
      # Database secret manager settings
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_MANAGER_ENCRYPTION_KEY: ${SECRET_MANAGER_ENCRYPTION_KEY}

  # Sandbox executor — isolated jail that actually runs agent code (data plane).
  # mcp-manager (control plane) delegates executions here so untrusted code
  # never runs inside the manager. In K8s this role is the warm-pool pods.
  sandbox-executor:
    image: agentarea/agentarea-mcp-runner:${VERSION:-latest}
    container_name: agentarea-sandbox-executor
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /workspace
    networks:
      - mcp-network
      - default
    environment:
      ACTIVATION_PORT: "8080"
      HOME: /home/sandbox
      # Activation policy. Same contract as the warm-pool pods in Helm
      # (charts/agentarea/templates/warm-pool/daemonset.yaml): the service
      # exits at boot when any of these is missing, so the deployment states
      # them and the binary keeps no defaults. 0 disables the idle watchdog —
      # a compose executor is not reclaimed the way a warm pod is.
      MAX_EXECUTION_TIMEOUT_SECONDS: "1800"
      IDLE_TIMEOUT_SECONDS: "0"
      SANDBOX_WORKSPACE_MAX_FILES: "10000"
      SANDBOX_WORKSPACE_MAX_FILE_BYTES: "268435456"
      SANDBOX_WORKSPACE_MAX_BYTES: "2147483648"
      SANDBOX_ACTIVATION_AUTH_SECRET: ${SANDBOX_ACTIVATION_AUTH_SECRET:?SANDBOX_ACTIVATION_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}

  # Temporal Infrastructure Services
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: agentarea-temporal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=db
      - DBNAME=${TEMPORAL_DB:-temporal}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - BIND_ON_IP=0.0.0.0
    networks:
      - temporal-network
      - default
    labels:
      kompose.volume.type: configMap
    volumes:
      - ./agentarea-platform/temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # AgentArea Worker Service
  agentarea-worker:
    pull_policy: always
    image: agentarea/agentarea-worker:${VERSION:-latest}
    container_name: agentarea-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
      temporal:
        condition: service_healthy
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - LLM_DOCKER_HOST=host.docker.internal
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
      - AWS_ENDPOINT_URL=http://rustfs:9000
      - S3_BUCKET_NAME=${DOCUMENTS_BUCKET}
      - ARTIFACTS_BUCKET_NAME=${ARTIFACTS_BUCKET:-artifacts}

      # Redis
      - REDIS_URL=redis://valkey:6379

      # Temporal
      - WORKFLOW__TEMPORAL_SERVER_URL=${WORKFLOW__TEMPORAL_SERVER_URL:-temporal:7233}
      - WORKFLOW__TEMPORAL_NAMESPACE=default
      - WORKFLOW__TEMPORAL_TASK_QUEUE=agent-tasks
      - WORKFLOW__TEMPORAL_MAX_CONCURRENT_ACTIVITIES=10
      - WORKFLOW__TEMPORAL_MAX_CONCURRENT_WORKFLOWS=5

      # Task execution
      - TASK__ENABLE_DYNAMIC_ACTIVITY_DISCOVERY=true
      - SECRET_MANAGER_ENCRYPTION_KEY=${SECRET_MANAGER_ENCRYPTION_KEY}
      - MCP_MANAGER_URL=http://agentarea-mcp-manager:80
      - SANDBOX_CLEANUP_AUTH_SECRET=${SANDBOX_CLEANUP_AUTH_SECRET:?SANDBOX_CLEANUP_AUTH_SECRET is required; run scripts/gen-dev-secrets.sh}

      # Development
      # - DEBUG=true
      - ENVIRONMENT=production
    networks:
      - temporal-network
      - default
    restart: unless-stopped

  # Rclone bucket initialization
  rclone-init:
    image: rclone/rclone:latest
    container_name: agentarea-rclone-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - RCLONE_CONFIG_RUSTFS_TYPE=s3
      - RCLONE_CONFIG_RUSTFS_PROVIDER=Rustfs
      - RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - RCLONE_CONFIG_RUSTFS_ENDPOINT=http://rustfs:9000
      - RCLONE_CONFIG_RUSTFS_ACL=private
    entrypoint: ["/bin/sh", "-c"]
    command: ["rclone mkdir rustfs:${DOCUMENTS_BUCKET:-documents} || true && rclone mkdir rustfs:${ARTIFACTS_BUCKET:-artifacts} || true && echo 'Buckets created successfully'"]
    networks:
      - default

  # AgentArea Event Service
  agentarea-events:
    image: agentarea/agentarea-events:${VERSION:-latest}
    container_name: agentarea-events
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - REDIS_URL=redis://valkey:6379
      - POLL_INTERVAL=30s
      - MAX_POLLERS=10
    networks:
      - default
    restart: unless-stopped

  # Ory Kratos Migration
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: ["migrate", "sql", "-c", "/etc/config/kratos/kratos.yml", "-e", "--yes"]
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # Ory Kratos Identity Server
  kratos:
    image: oryd/kratos:v1.3.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4433:4433" # public API
    environment:
      DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
      LOG_LEVEL: info
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?KRATOS_SECRETS_COOKIE is required; run scripts/gen-dev-secrets.sh}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?KRATOS_SECRETS_CIPHER is required and must be exactly 32 characters; run scripts/gen-dev-secrets.sh}
      # SMTP Configuration - Override courier settings via environment variables
      COURIER_SMTP_CONNECTION_URI: "${SMTP_PROTOCOL}://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}/?skip_ssl_verify=${SMTP_SKIP_SSL_VERIFY}"
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_FROM_EMAIL}
      COURIER_SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID: ${OIDC_GITHUB_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET: ${OIDC_GITHUB_CLIENT_SECRET:-}
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml"]
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge
  temporal-network:
    driver: bridge
  auth-network:
    driver: bridge
