{{- if .Values.mcpManager.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentarea.fullname" . }}-mcp-manager
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-manager
spec:
  replicas: {{ .Values.mcpManager.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-manager
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-manager
      annotations:
        # The manager reads its settings (AGENTAREA_MCP_BASE_IMAGE among them, which
        # Image Updater moves) from ConfigMaps at start only.
        checksum/config: {{ include (print $.Template.BasePath "/env-configmap.yaml") . | sha256sum }}
    spec:
      {{- $dockerBackend := eq (default "kubernetes" .Values.mcpManager.backend) "docker" }}
      serviceAccountName: {{ include "agentarea.mcpManagerServiceAccountName" . }}
      {{- if not $dockerBackend }}
      {{- with .Values.global.security.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- include "agentarea.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: mcp-manager
          image: {{ include "agentarea.image" . | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["agentarea", "mcp"]
          {{- if .Values.mcpManager.securityContext }}
          {{/* Explicit operator override -- e.g. the "docker" backend, which needs
               privileged access to the mounted Docker socket and cannot use the
               restricted default below. */}}
          securityContext:
            {{- toYaml .Values.mcpManager.securityContext | nindent 12 }}
          {{- else if not $dockerBackend }}
          {{/* The restricted default is only safe to apply automatically for the
               "kubernetes" backend (the production path). The "docker" backend
               shells out to the docker CLI against the mounted host socket and
               has always required an explicit mcpManager.securityContext of its
               own (see the value's own comment) -- auto-applying
               readOnlyRootFilesystem here for an operator who left it unset
               would be a new, unannounced behavior change for that opt-in,
               non-default mode. */}}
          {{- with .Values.global.security.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- include "agentarea.database.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.database.envs" . | nindent 12 }}
            {{- include "agentarea.redis.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.redis.envs" . | nindent 12 }}
            {{- include "agentarea.redis.urlEnv" . | nindent 12 }}
            {{- include "agentarea.storage.envs" . | nindent 12 }}
            {{- include "agentarea.storage.secrets.envs" . | nindent 12 }}
            {{- include "agentarea.application.envs" . | nindent 12 }}
            {{- include "agentarea.application.secrets.envs" . | nindent 12 }}
            - name: AGENTAREA_SANDBOX_ACTIVATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.application }}
                  key: sandbox-activation-secret
            - name: AGENTAREA_SANDBOX_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secrets.application }}
                  key: sandbox-control-secret
            - name: AGENTAREA_SANDBOX_CLEANUP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxCleanupSecretName" . }}
                  key: {{ include "agentarea.sandboxCleanupSecretKey" . }}
            - name: AGENTAREA_SANDBOX_INSPECT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxInspectionSecretName" . }}
                  key: {{ include "agentarea.sandboxInspectionSecretKey" . }}
            - name: AGENTAREA_SANDBOX_FILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.sandboxFileSecretName" . }}
                  key: {{ include "agentarea.sandboxFileSecretKey" . }}
            - name: AGENTAREA_MCP_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentarea.mcpGatewaySecretName" . }}
                  key: {{ include "agentarea.mcpGatewaySecretKey" . }}
            {{- include "agentarea.sandboxRuntime.envs" . | nindent 12 }}
            {{- include "agentarea.mcpManager.envs" . | nindent 12 }}
            {{- include "agentarea.mcpRuntime.podEnvs" . | nindent 12 }}
            {{- include "agentarea.telemetry.envs" (dict "root" . "image" .Values.global.image) | nindent 12 }}
            {{- if or .Values.mcpManager.envVars .Values.global.envVars }}
            {{- $mcpEnv := default dict .Values.mcpManager.envVars -}}
            {{- $globalEnv := default dict .Values.global.envVars -}}
            {{- range $k, $v := mergeOverwrite $mcpEnv $globalEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.mcpManager.secrets }}
            {{- $secretName := ( .Values.mcpManager.secretsName | default (printf "%s-mcp-manager-secrets" .Release.Name) ) }}
            {{- range $k, $v := .Values.mcpManager.secrets }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $k }}
            {{- end }}
            {{- end }}
            {{- if .Values.mcpManager.extraEnv }}
            {{- toYaml .Values.mcpManager.extraEnv | nindent 12 }}
            {{- end }}
          {{- with .Values.mcpManager.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # Scratch spool for artifact and upload staging under
            # readOnlyRootFilesystem: os.CreateTemp resolves to /tmp.
            - name: tmp
              mountPath: /tmp
            {{- include "agentarea.mcpRuntime.volumeMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.mcpManager.tmpVolume.sizeLimit | quote }}
        {{- include "agentarea.mcpRuntime.volumes" . | nindent 8 }}
{{- end }}
