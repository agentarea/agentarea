version: "3.8"
services:
  app:
    image: agentarea/agentarea-api:${VERSION:-latest}
    container_name: agentarea-backend
    ports:
      - "8000:8000"
    restart: always
    pull_policy: always
    environment:
      # S3 settings
      - AGENTAREA_S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - AGENTAREA_S3_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - AGENTAREA_S3_REGION=${RUSTFS_REGION:-us-east-1}
      - AGENTAREA_S3_BUCKET=${DOCUMENTS_BUCKET}
      - AGENTAREA_S3_ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET:-artifacts}
      - AGENTAREA_S3_ENDPOINT=http://rustfs:9000
      # Database settings
      - AGENTAREA_DB_HOST=db
      - AGENTAREA_DB_PORT=5432
      - AGENTAREA_DB_USER=${AGENTAREA_DB_USER}
      - AGENTAREA_DB_PASSWORD=${AGENTAREA_DB_PASSWORD}
      - AGENTAREA_DB_NAME=${AGENTAREA_DB_NAME}
      # MCP settings
      - AGENTAREA_MCP_MANAGER_URL=http://agentarea-mcp-manager:80/api/mcp
      - AGENTAREA_REDIS_URL=redis://valkey:6379
      - AGENTAREA_MCP_TIMEOUT=30
      # Server settings
      - PORT=${PORT:-8000}
      - AGENTAREA_LOG_LEVEL=${AGENTAREA_LOG_LEVEL:-info}
      - AGENTAREA_API_WORKERS=${AGENTAREA_API_WORKERS:-1}
      - AGENTAREA_WF_TEMPORAL_URL=${AGENTAREA_WF_TEMPORAL_URL:-temporal:7233}
      - AGENTAREA_WF_NAMESPACE=default
      - AGENTAREA_WF_QUEUE=agent-tasks
      - AGENTAREA_SECRET_ENCRYPTION_KEY=${AGENTAREA_SECRET_ENCRYPTION_KEY}
      - AGENTAREA_AUTH_JWKS_B64=${AGENTAREA_AUTH_JWKS_B64}
      - AGENTAREA_AUTH_ISSUER=${AGENTAREA_AUTH_ISSUER:-http://localhost:4433}
      - AGENTAREA_AUTH_AUDIENCE=${AGENTAREA_AUTH_AUDIENCE:-agentarea-api}
      - AGENTAREA_AUTH_KRATOS_ADMIN_URL=${AGENTAREA_AUTH_KRATOS_ADMIN_URL:-http://kratos:4434}
      # Transactional mail (workspace invitations). Same server Kratos' courier
      # uses, so one SMTP setup covers both senders.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PROTOCOL=${SMTP_PROTOCOL:-smtp}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-AgentArea}
      - SMTP_SKIP_SSL_VERIFY=${SMTP_SKIP_SSL_VERIFY:-true}
      - SMTP_DISABLE_STARTTLS=${SMTP_DISABLE_STARTTLS:-true}
      - AGENTAREA_APP_URL=${AGENTAREA_APP_URL:-http://localhost:3000}
      # Access control: the authorization graph lives in OpenFGA. Bootstrap
      # finds or creates the store and applies the bundled model on start, so
      # a fresh install needs no ids up front.
      - AGENTAREA_AUTHZ_BACKEND=${AGENTAREA_AUTHZ_BACKEND:-openfga}
      - AGENTAREA_AUTHZ_FGA_URL=${AGENTAREA_AUTHZ_FGA_URL:-http://openfga:8080}
      - AGENTAREA_AUTHZ_FGA_STORE_ID=${AGENTAREA_AUTHZ_FGA_STORE_ID:-}
      - AGENTAREA_AUTHZ_FGA_MODEL_ID=${AGENTAREA_AUTHZ_FGA_MODEL_ID:-}
      - AGENTAREA_AUTHZ_FGA_BOOTSTRAP=${AGENTAREA_AUTHZ_FGA_BOOTSTRAP:-true}
      - AGENTAREA_AUTHZ_FGA_APPLY_MODEL=${AGENTAREA_AUTHZ_FGA_APPLY_MODEL:-true}
      - AGENTAREA_AUTHZ_FGA_STORE_NAME=${AGENTAREA_AUTHZ_FGA_STORE_NAME:-agentarea}
      - AGENTAREA_AUTHZ_FGA_MODEL_PATH=${AGENTAREA_AUTHZ_FGA_MODEL_PATH:-/app/config/auth/openfga/authorization-model.json}
    volumes:
      - ./config/auth/openfga:/app/config/auth/openfga:ro
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      valkey:
        condition: service_started
      app_migrations:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
      # mcp-manager:
      #   condition: service_healthy
    # Probed with Python rather than curl, which the API image does not ship.
    # app_catalog waits on this, so without it compose refuses to start.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - default
      - mcp-network
      - temporal-network

  app_migrations:
    image: agentarea/agentarea-api:${VERSION:-latest}
    pull_policy: always
    environment:
      - AGENTAREA_S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - AGENTAREA_S3_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - AGENTAREA_S3_REGION=${RUSTFS_REGION:-us-east-1}
      - AGENTAREA_S3_BUCKET=${DOCUMENTS_BUCKET}
      - AGENTAREA_S3_ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET:-artifacts}
      - AGENTAREA_S3_ENDPOINT=http://rustfs:9000
      - AGENTAREA_DB_USER=${AGENTAREA_DB_USER}
      - AGENTAREA_DB_PASSWORD=${AGENTAREA_DB_PASSWORD}
      - AGENTAREA_DB_NAME=${AGENTAREA_DB_NAME}
      - AGENTAREA_DB_HOST=db
      - AGENTAREA_DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    command: ["agentarea-api", "migrate"]
    working_dir: /app/apps/api

  # Populates the built-in MCP catalog once the API answers. Idempotent, so it
  # re-runs harmlessly on every `up` and picks up catalog additions; run it on
  # demand with `docker compose run --rm app_catalog`. Registry data lives in
  # the database, not on disk, which is why a load step exists at all.
  app_catalog:
    image: agentarea/agentarea-api:${VERSION:-latest}
    pull_policy: always
    environment:
      - AGENTAREA_DB_USER=${AGENTAREA_DB_USER}
      - AGENTAREA_DB_PASSWORD=${AGENTAREA_DB_PASSWORD}
      - AGENTAREA_DB_NAME=${AGENTAREA_DB_NAME}
      - AGENTAREA_DB_HOST=db
      - AGENTAREA_DB_PORT=5432
    depends_on:
      app:
        condition: service_healthy
    command:
      [
        "agentarea-api",
        "reconcile",
        "--source",
        "${CATALOG_MCP_SOURCE:-https://agentarea-mcp-registry.s3.amazonaws.com/registry/mcp-servers.json}",
      ]
    working_dir: /app/apps/api
    restart: "no"

  # Create the main app database and auxiliary databases — idempotent.
  postgres_init:
    image: postgres:18
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${AGENTAREA_DB_USER}
      - PGPASSWORD=${AGENTAREA_DB_PASSWORD}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        for db in "${AGENTAREA_DB_NAME:-agentarea}" "${TEMPORAL_DB:-temporal}" "${KRATOS_DB:-kratos}" "${OPENFGA_DB:-openfga}"; do
          exists=$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'")
          if [ "$$exists" != "1" ]; then
            echo "Creating database $$db"
            psql -c "CREATE DATABASE \"$$db\""
          else
            echo "Database $$db already exists"
          fi
        done
    depends_on:
      db:
        condition: service_healthy

  # Frontend service
  frontend:
    image: agentarea/agentarea-frontend:${VERSION:-latest}
    container_name: agentarea-frontend
    ports:
      - "3000:3000"
    restart: always
    pull_policy: always
    environment:
      # - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - AGENTAREA_API_URL=${AGENTAREA_API_URL:-http://app:8000}
      - AGENTAREA_AUTH_KRATOS_ADMIN_URL=${AGENTAREA_AUTH_KRATOS_ADMIN_URL:-http://kratos:4434}
      # ORY_SDK_URL: internal Docker URL for server-side API calls to Kratos
      - ORY_SDK_URL=${ORY_SDK_URL:-http://kratos:4433}
      - NEXT_PUBLIC_ORY_SDK_URL=${NEXT_PUBLIC_ORY_SDK_URL:-http://localhost:4433}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    networks:
      - default
      - auth-network

  rustfs:
    image: rustfs/rustfs:latest
    volumes:
      - ./data/rustfs:/data
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    command: /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${AGENTAREA_DB_USER}
      - POSTGRES_PASSWORD=${AGENTAREA_DB_PASSWORD}
      - POSTGRES_DB=postgres  # Maintenance DB; postgres_init creates the main app DB plus aux DBs
    volumes:
      # postgres:18 stores data under /var/lib/postgresql/<ver>/docker, so the
      # mount must target the parent dir — mounting the legacy .../data path
      # makes the image refuse to start. Matches docker-compose.dev.yaml.
      - ./data/postgres:/var/lib/postgresql
    # Reap orphans with an init process instead of the postmaster. Without it
    # PID 1 is postgres itself, so a healthcheck killed on timeout leaves its
    # pg_isready reparented onto the postmaster, which reads any untracked
    # child exit as a backend crash and restarts the whole cluster. Recovery
    # over the bind mount then outlasts the next probe and the loop feeds
    # itself: the database spends its life rejecting connections.
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AGENTAREA_DB_USER}"]
      interval: 10s
      # Long enough to cover an fsync-bound start on a bind mount; a probe that
      # is killed for being slow is the input to the loop described above.
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - default
      - temporal-network
      - auth-network

  valkey:
    image: valkey/valkey:8
    container_name: agentarea-valkey
    restart: always
    volumes:
      - ./data/valkey:/data
    networks:
      - default
      - mcp-network

  agentarea-mcp-manager:
    image: agentarea/agentarea-mcp-manager:${VERSION:-latest}
    container_name: agentarea-mcp-manager
    restart: unless-stopped
    ports:
      - "7999:80" # Internal proxy (unified entry point)
    volumes:
      # Manager drives MCP containers through the host Docker socket (docker CLI
      # ships in the image). No podman, no privileged mode.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mcp-network
      - default
    environment:
      AGENTAREA_LOG_LEVEL: INFO
      # The rest of the stack addresses the manager as
      # http://agentarea-mcp-manager:80, and the published port maps to 80.
      # The binary otherwise listens on 8000, which leaves both dead.
      PORT: "80"
      # Spawned MCP workloads join the segregated MCP network rather than the
      # project default, which also carries the database and Redis.
      AGENTAREA_MCP_NETWORK: agentarea_mcp-network
      AGENTAREA_REDIS_URL: redis://valkey:6379
      AGENTAREA_API_URL: http://app:8000
      # Demand gateway: MCP workloads start on the first call and are reclaimed
      # after MCP_IDLE_TIMEOUT (0 keeps them running once started). All four are
      # required — the gateway refuses to configure itself without them.
      AGENTAREA_MCP_LEASE_TTL: "90s"
      AGENTAREA_MCP_STARTUP_TIMEOUT: "5m"
      AGENTAREA_MCP_IDLE_TIMEOUT: "10m"
      AGENTAREA_MCP_SWEEP_INTERVAL: "60s"
      # Admission lists for MCP instances, mirroring the chart defaults in
      # charts/agentarea/values.yaml (mcpManager.admission). Both are required
      # and an absent list is refused: "not decided yet" must not read as
      # "allow everything". Declare one empty to disable that instance type.
      AGENTAREA_MCP_ALLOWED_IMAGES: "ghcr.io/github/github-mcp-server,mcp/fetch"
      AGENTAREA_MCP_ALLOWED_PACKAGES: "npx -y @modelcontextprotocol/server-everything,npx -y @modelcontextprotocol/server-sequential-thinking,uvx mcp-server-fetch,uvx mcp-server-time"
      # Run the sandbox execution consumer in-process (no standalone runner in
      # compose) and route code-execution to the sandbox-executor container.
      AGENTAREA_SBX_EMBEDDED_RUNNER: "true"
      AGENTAREA_SBX_EXECUTOR_URL: http://sandbox-executor:8080
      # Explicit acknowledgement: the compose executor shares this host's
      # kernel and is not an isolation boundary for hostile multi-tenant code.
      # Kubernetes replaces it with per-task warm-pool pods under a sandboxed
      # runtime class; the manager refuses the shared path without this flag.
      AGENTAREA_SBX_ALLOW_WEAK_ISOLATION: "true"
      AGENTAREA_SBX_ACTIVATION_SECRET: ${AGENTAREA_SBX_ACTIVATION_SECRET:?AGENTAREA_SBX_ACTIVATION_SECRET is required; run scripts/gen-dev-secrets.sh}
      AGENTAREA_SBX_CLEANUP_SECRET: ${AGENTAREA_SBX_CLEANUP_SECRET:?AGENTAREA_SBX_CLEANUP_SECRET is required; run scripts/gen-dev-secrets.sh}
      AGENTAREA_SBX_FILE_SECRET: ${AGENTAREA_SBX_FILE_SECRET:?AGENTAREA_SBX_FILE_SECRET is required; run scripts/gen-dev-secrets.sh}
      AGENTAREA_SBX_CONTROL_SECRET: ${AGENTAREA_SBX_CONTROL_SECRET:?AGENTAREA_SBX_CONTROL_SECRET is required; run scripts/gen-dev-secrets.sh}
      AGENTAREA_MCP_GATEWAY_SECRET: ${AGENTAREA_MCP_GATEWAY_SECRET:?AGENTAREA_MCP_GATEWAY_SECRET is required; run scripts/gen-dev-secrets.sh}
      # Lifecycle and admission policy. The manager refuses to start when any
      # value is absent or malformed rather than inventing retention behavior,
      # so these belong here in the deployment config — the binary holds no
      # defaults. Helm emits the same set from .Values.sandboxRuntime.
      AGENTAREA_SBX_LEASE_TTL: "2h"
      AGENTAREA_SBX_IDLE_TTL: "15m"
      AGENTAREA_SBX_PROVISION_TIMEOUT: "30s"
      AGENTAREA_SBX_SESSION_TTL: "24h"
      AGENTAREA_SBX_RECORD_TTL: "24h"
      AGENTAREA_SBX_MAX_EXEC_SECONDS: "1800"
      AGENTAREA_SBX_EXEC_SECONDS: "120"
      AGENTAREA_SBX_QUEUE_TIMEOUT: "5m"
      AGENTAREA_SBX_COMPLETION_GRACE: "2m"
      AGENTAREA_SBX_ALLOW_INTERNET: ${AGENTAREA_SBX_ALLOW_INTERNET:-true}
      # The trusted control plane resolves immutable workspace refs in S3 and
      # gives the executor signed URLs. These credentials are not passed to the
      # executor or to task processes.
      AGENTAREA_SBX_STORAGE: s3
      AGENTAREA_SBX_MAX_FILES: "10000"
      AGENTAREA_SBX_MAX_FILE_SIZE: "268435456"
      AGENTAREA_SBX_MAX_TOTAL_SIZE: "2147483648"
      AGENTAREA_SBX_S3_URL_TTL: "1h"
      AGENTAREA_SBX_S3_BUCKET: ${ARTIFACTS_BUCKET:-artifacts}
      AGENTAREA_SBX_S3_ENDPOINT: http://rustfs:9000
      AGENTAREA_SBX_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      AGENTAREA_SBX_S3_PATH_STYLE: "true"
      AGENTAREA_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      AGENTAREA_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      # Secret manager configuration
      AGENTAREA_SECRET_BACKEND: ${AGENTAREA_SECRET_BACKEND:-database}
      # Database secret manager settings
      AGENTAREA_DB_HOST: db
      AGENTAREA_DB_PORT: 5432
      AGENTAREA_DB_USER: ${AGENTAREA_DB_USER}
      AGENTAREA_DB_PASSWORD: ${AGENTAREA_DB_PASSWORD}
      AGENTAREA_DB_NAME: ${AGENTAREA_DB_NAME}
      AGENTAREA_SECRET_ENCRYPTION_KEY: ${AGENTAREA_SECRET_ENCRYPTION_KEY}

  # Sandbox executor — isolated jail that actually runs agent code (data plane).
  # mcp-manager (control plane) delegates executions here so untrusted code
  # never runs inside the manager. In K8s this role is the warm-pool pods.
  sandbox-executor:
    image: agentarea/agentarea-mcp-runner:${VERSION:-latest}
    container_name: agentarea-sandbox-executor
    restart: unless-stopped
    tmpfs:
      - /tmp
      - /workspace
    networks:
      - mcp-network
      - default
    environment:
      PORT: "8080"
      HOME: /home/sandbox
      # Activation policy. Same contract as the warm-pool pods in Helm
      # (charts/agentarea/templates/warm-pool/daemonset.yaml): the service
      # exits at boot when any of these is missing, so the deployment states
      # them and the binary keeps no defaults. 0 disables the idle watchdog —
      # a compose executor is not reclaimed the way a warm pod is.
      AGENTAREA_SBX_MAX_EXEC_SECONDS: "1800"
      AGENTAREA_SBX_IDLE_SHUTDOWN: "0"
      AGENTAREA_SBX_MAX_FILES: "10000"
      AGENTAREA_SBX_MAX_FILE_SIZE: "268435456"
      AGENTAREA_SBX_MAX_TOTAL_SIZE: "2147483648"
      AGENTAREA_SBX_ACTIVATION_SECRET: ${AGENTAREA_SBX_ACTIVATION_SECRET:?AGENTAREA_SBX_ACTIVATION_SECRET is required; run scripts/gen-dev-secrets.sh}

  # Temporal Infrastructure Services
  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: agentarea-temporal
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${AGENTAREA_DB_USER}
      - POSTGRES_PWD=${AGENTAREA_DB_PASSWORD}
      - POSTGRES_SEEDS=db
      - DBNAME=${TEMPORAL_DB:-temporal}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - BIND_ON_IP=0.0.0.0
    networks:
      - temporal-network
      - default
    labels:
      kompose.volume.type: configMap
    volumes:
      - ./agentarea-platform/temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # AgentArea Worker Service
  agentarea-worker:
    pull_policy: always
    image: agentarea/agentarea-worker:${VERSION:-latest}
    container_name: agentarea-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
      temporal:
        condition: service_healthy
      openfga:
        condition: service_healthy
    volumes:
      - ./config/auth/openfga:/app/config/auth/openfga:ro
    environment:
      # Database
      - AGENTAREA_DB_URL=postgresql://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${AGENTAREA_DB_NAME}
      - AGENTAREA_DB_HOST=db
      - AGENTAREA_DB_PORT=5432
      - AGENTAREA_DB_USER=${AGENTAREA_DB_USER}
      - AGENTAREA_DB_PASSWORD=${AGENTAREA_DB_PASSWORD}
      - AGENTAREA_DB_NAME=${AGENTAREA_DB_NAME}
      - LLM_DOCKER_HOST=host.docker.internal
      - AGENTAREA_S3_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - AGENTAREA_S3_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - AGENTAREA_S3_REGION=${RUSTFS_REGION:-us-east-1}
      - AGENTAREA_S3_ENDPOINT=http://rustfs:9000
      - AGENTAREA_S3_BUCKET=${DOCUMENTS_BUCKET}
      - AGENTAREA_S3_ARTIFACTS_BUCKET=${ARTIFACTS_BUCKET:-artifacts}

      # Redis
      - AGENTAREA_REDIS_URL=redis://valkey:6379

      # Temporal
      - AGENTAREA_WF_TEMPORAL_URL=${AGENTAREA_WF_TEMPORAL_URL:-temporal:7233}
      - AGENTAREA_WF_NAMESPACE=default
      - AGENTAREA_WF_QUEUE=agent-tasks
      - AGENTAREA_WF_MAX_ACTIVITIES=10
      - AGENTAREA_WF_MAX_WORKFLOWS=5

      # Task execution
      - AGENTAREA_TASK_DISCOVERY_ENABLED=true
      - AGENTAREA_SECRET_ENCRYPTION_KEY=${AGENTAREA_SECRET_ENCRYPTION_KEY}
      - AGENTAREA_MCP_MANAGER_URL=http://agentarea-mcp-manager:80
      - AGENTAREA_SBX_CLEANUP_SECRET=${AGENTAREA_SBX_CLEANUP_SECRET:?AGENTAREA_SBX_CLEANUP_SECRET is required; run scripts/gen-dev-secrets.sh}

      # Access control: the authorization graph lives in OpenFGA. Bootstrap
      # finds or creates the store and applies the bundled model on start, so
      # a fresh install needs no ids up front.
      - AGENTAREA_AUTHZ_BACKEND=${AGENTAREA_AUTHZ_BACKEND:-openfga}
      - AGENTAREA_AUTHZ_FGA_URL=${AGENTAREA_AUTHZ_FGA_URL:-http://openfga:8080}
      - AGENTAREA_AUTHZ_FGA_STORE_ID=${AGENTAREA_AUTHZ_FGA_STORE_ID:-}
      - AGENTAREA_AUTHZ_FGA_MODEL_ID=${AGENTAREA_AUTHZ_FGA_MODEL_ID:-}
      - AGENTAREA_AUTHZ_FGA_BOOTSTRAP=${AGENTAREA_AUTHZ_FGA_BOOTSTRAP:-true}
      - AGENTAREA_AUTHZ_FGA_APPLY_MODEL=${AGENTAREA_AUTHZ_FGA_APPLY_MODEL:-true}
      - AGENTAREA_AUTHZ_FGA_STORE_NAME=${AGENTAREA_AUTHZ_FGA_STORE_NAME:-agentarea}
      - AGENTAREA_AUTHZ_FGA_MODEL_PATH=${AGENTAREA_AUTHZ_FGA_MODEL_PATH:-/app/config/auth/openfga/authorization-model.json}

      # Development
      # - DEBUG=true
      - AGENTAREA_ENV=production
    # /readyz is 200 once the worker reached its dependencies and every Temporal
    # worker is polling. Probed with Python: the worker image ships no curl.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8081/readyz', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - temporal-network
      - default
    restart: unless-stopped

  # Rclone bucket initialization
  rclone-init:
    image: rclone/rclone:latest
    container_name: agentarea-rclone-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - RCLONE_CONFIG_RUSTFS_TYPE=s3
      - RCLONE_CONFIG_RUSTFS_PROVIDER=Rustfs
      - RCLONE_CONFIG_RUSTFS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - RCLONE_CONFIG_RUSTFS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
      - RCLONE_CONFIG_RUSTFS_ENDPOINT=http://rustfs:9000
      - RCLONE_CONFIG_RUSTFS_ACL=private
    entrypoint: ["/bin/sh", "-c"]
    command: ["rclone mkdir rustfs:${DOCUMENTS_BUCKET:-documents} || true && rclone mkdir rustfs:${ARTIFACTS_BUCKET:-artifacts} || true && echo 'Buckets created successfully'"]
    networks:
      - default

  # AgentArea Event Service
  agentarea-events:
    image: agentarea/agentarea-events:${VERSION:-latest}
    container_name: agentarea-events
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
    environment:
      - AGENTAREA_DB_URL=postgresql://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${AGENTAREA_DB_NAME}?sslmode=disable
      - AGENTAREA_REDIS_URL=redis://valkey:6379
      - AGENTAREA_EVT_POLL_INTERVAL=30s
      - AGENTAREA_EVT_MAX_POLLERS=10
    networks:
      - default
    restart: unless-stopped

  # Ory Kratos Migration
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    environment:
      DSN: postgres://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
    command: ["migrate", "sql", "-c", "/etc/config/kratos/kratos.yml", "-e", "--yes"]
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # Ory Kratos Identity Server
  kratos:
    image: oryd/kratos:v1.3.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4433:4433" # public API
    environment:
      DSN: postgres://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${KRATOS_DB:-kratos}?sslmode=disable&max_conns=20&max_idle_conns=4
      LOG_LEVEL: info
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?KRATOS_SECRETS_COOKIE is required; run scripts/gen-dev-secrets.sh}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?KRATOS_SECRETS_CIPHER is required and must be exactly 32 characters; run scripts/gen-dev-secrets.sh}
      # SMTP Configuration - Override courier settings via environment variables
      COURIER_SMTP_CONNECTION_URI: "${SMTP_PROTOCOL}://${SMTP_USERNAME}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}/?skip_ssl_verify=${SMTP_SKIP_SSL_VERIFY}"
      COURIER_SMTP_FROM_ADDRESS: ${SMTP_FROM_EMAIL}
      COURIER_SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID: ${OIDC_GOOGLE_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET: ${OIDC_GOOGLE_CLIENT_SECRET:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_ID: ${OIDC_GITHUB_CLIENT_ID:-}
      SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_1_CLIENT_SECRET: ${OIDC_GITHUB_CLIENT_SECRET:-}
    command: ["serve", "-c", "/etc/config/kratos/kratos.yml"]
    volumes:
      - ./config/auth/kratos:/etc/config/kratos
    networks:
      - auth-network
    depends_on:
      db:
        condition: service_healthy
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # OpenFGA schema migration. Tag matches the Helm chart's openfga.image.tag.
  openfga-migrate:
    image: ${OPENFGA_IMAGE:-openfga/openfga:v1.18.0}
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${OPENFGA_DB:-openfga}?sslmode=disable
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      postgres_init:
        condition: service_completed_successfully

  # OpenFGA authorization server (the ReBAC graph behind every permission check)
  openfga:
    image: ${OPENFGA_IMAGE:-openfga/openfga:v1.18.0}
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${AGENTAREA_DB_USER}:${AGENTAREA_DB_PASSWORD}@db:5432/${OPENFGA_DB:-openfga}?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  mcp-network:
    driver: bridge
  temporal-network:
    driver: bridge
  auth-network:
    driver: bridge
