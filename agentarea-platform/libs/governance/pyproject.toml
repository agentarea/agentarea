[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentarea-governance"
version = "0.0.11"
description = "Unified interceptor framework for agent execution governance and security"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "agentarea-common",
    "pydantic>=2.4.2",
    "sqlalchemy>=2.0.0",
]

[tool.uv.sources]
agentarea-common = { workspace = true }

[project.optional-dependencies]
temporal = [
    "temporalio>=1.12.0",
    "agentarea-execution",
]

[tool.hatch.build.targets.wheel]
packages = ["agentarea_governance"]
