{{- if and .Values.kratos.enabled (not .Values.kratos.runtimeSecretName) }}
{{- $secretName := printf "%s-kratos-runtime" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = default dict $existing.data -}}
{{- end -}}
{{- $existingCookie := get $existingData "secrets-cookie" -}}
{{- $existingCipher := get $existingData "secrets-cipher" -}}
{{- $cipher := randAlphaNum 32 | b64enc -}}
{{- if and $existingCipher (ge (len ($existingCipher | b64dec)) 32) -}}
{{- $cipher = $existingCipher -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: kratos
  annotations:
    "helm.sh/resource-policy": "keep"
type: Opaque
data:
  secrets-cookie: {{ default (randAlphaNum 64 | b64enc) $existingCookie }}
  secrets-cipher: {{ $cipher }}
{{- end }}
