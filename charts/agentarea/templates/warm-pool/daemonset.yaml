{{- if and .Values.mcpManager.enabled .Values.mcpManager.warmPool.enabled }}
{{- if has "warm_pool" .Values.mcpManager.features.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "agentarea.fullname" . }}-warm-pool
  labels:
    {{- include "agentarea.labels" . | nindent 4 }}
    app.kubernetes.io/component: warm-pool
spec:
  selector:
    matchLabels:
      {{- include "agentarea.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: warm-pool
  template:
    metadata:
      labels:
        {{- include "agentarea.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: warm-pool
        mcp.agentarea.io/status: "waiting"
    spec:
      {{- if has "kata_runtime" .Values.mcpManager.features.enabled }}
      runtimeClassName: kata-qemu
      {{- end }}
      serviceAccountName: {{ include "agentarea.serviceAccountName" . }}
      containers:
        - name: warm-pod
          image: "{{ .Values.mcpManager.warmPool.image.repository }}:{{ .Values.mcpManager.warmPool.image.tag }}"
          imagePullPolicy: {{ .Values.mcpManager.warmPool.image.pullPolicy }}
          ports:
            - name: activation
              containerPort: 8080
              protocol: TCP
            - name: mcp
              containerPort: 3000
              protocol: TCP
          env:
            - name: ACTIVATION_PORT
              value: "8080"
            - name: MCP_PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "{{ .Values.mcpManager.warmPool.logLevel }}"
          resources:
            {{- toYaml .Values.mcpManager.warmPool.resources | nindent 12 }}
          securityContext:
            privileged: true  # Required for overlay mount in minikube
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN  # Required for overlay mount
                - NET_ADMIN  # Required for networking
          volumeMounts:
            - name: image-cache
              mountPath: /var/cache/mcp-images
            - name: overlay-work
              mountPath: /tmp/overlay-work
            - name: dev-fuse
              mountPath: /dev/fuse
          livenessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: activation
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: image-cache
          hostPath:
            path: /var/lib/mcp-image-cache
            type: DirectoryOrCreate
        - name: overlay-work
          emptyDir: {}
        - name: dev-fuse
          hostPath:
            path: /dev/fuse
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - warm-pool
                topologyKey: kubernetes.io/hostname
{{- end }}
{{- end }}
