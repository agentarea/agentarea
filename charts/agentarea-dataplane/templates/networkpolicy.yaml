{{- if .Values.workloads.networkPolicy.enabled }}
{{- $np := .Values.workloads.networkPolicy }}
# Nothing reaches an MCP server except the data plane. Pod-to-pod stays closed,
# which is what keeps one tenant's server from calling another's.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-dataplane-only
  namespace: {{ .Values.workloads.namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if not .Values.exposure.hostNetwork.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "dataplane.selectorLabels" . | nindent 14 }}
        {{- end }}
        {{- range $np.ingressFromCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
---
# Out: cluster DNS, and the public internet minus denyCIDRs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-dns-and-public-only
  namespace: {{ .Values.workloads.namespace }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.dns.podLabels | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            {{- with $np.denyCIDRs }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
