---
# Pull here, loudly, rather than relying on the unit's best-effort ExecStartPre.
# That pull ignores failures on purpose so a transient registry outage cannot
# stop a restart — but it also means a wrong or unpublished image name never
# surfaces, and the host keeps running a stale executor indefinitely. Deploy is
# the right place for that to be an error.
- name: Pull the sandbox executor image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - "{{ sandbox_executor_image }}"
  register: _executor_pull
  changed_when: "'Downloaded newer image' in _executor_pull.stdout"
  when: sandbox_executor_enabled | bool
  notify: Restart sandbox-executor

- name: Ensure agentarea config directory
  ansible.builtin.file:
    path: /etc/agentarea
    state: directory
    mode: "0750"

- name: Write executor environment file (holds the HMAC secret)
  ansible.builtin.template:
    src: sandbox-executor.env.j2
    dest: /etc/agentarea/sandbox-executor.env
    mode: "0600"
  notify: Restart sandbox-executor

- name: Install the sandbox-executor systemd unit
  ansible.builtin.template:
    src: sandbox-executor.service.j2
    dest: "/etc/systemd/system/{{ sandbox_executor_name }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart sandbox-executor

- name: Enable and start the sandbox executor
  ansible.builtin.systemd:
    name: "{{ sandbox_executor_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the executor /health to answer (proves it runs under gVisor)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sandbox_executor_host_port }}/health"
    status_code: 200
  register: _executor_health
  retries: 15
  delay: 4
  until: _executor_health.status == 200
