name: OpenAPI Drift Check

# Guards that the committed agentarea-webapp/src/api/openapi.json (the source of
# truth for the frontend's generated hey-api client) stays in sync with what the
# FastAPI backend actually produces. Triggers on backend changes so a backend
# edit that forgets to refresh the committed spec fails here.
#
# The complementary check — that the GENERATED client matches this openapi.json —
# lives in frontend-integration.yml (cheap, frontend-only, no backend needed).

on:
  pull_request:
    branches: [main]
    paths:
      - 'agentarea-platform/apps/api/**'
      - 'agentarea-platform/libs/**'
      - 'agentarea-webapp/src/api/openapi.json'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true
          cache-dependency-glob: "agentarea-platform/**/pyproject.toml"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: agentarea-platform
        run: uv sync --all-extras

      - name: Export OpenAPI spec from FastAPI
        working-directory: agentarea-platform
        run: uv run python ../scripts/export-openapi.py -o /tmp/openapi.json
        env:
          WORKFLOW__TEMPORAL_SERVER_URL: http://localhost:7233
          WORKFLOW__TEMPORAL_NAMESPACE: default
          WORKFLOW__TEMPORAL_TASK_QUEUE: agent-tasks

      - name: Check for spec drift
        run: |
          # Normalize key ordering on both sides so the diff only reflects real
          # schema changes, not serialization noise.
          jq -S . agentarea-webapp/src/api/openapi.json > /tmp/committed.json
          jq -S . /tmp/openapi.json > /tmp/exported.json
          if ! diff -q /tmp/committed.json /tmp/exported.json > /dev/null 2>&1; then
            echo "::error::agentarea-webapp/src/api/openapi.json is out of date with the backend API."
            echo ""
            echo "The committed OpenAPI spec does not match what the backend produces."
            echo "Run this locally with the backend on :8000 to fix:"
            echo ""
            echo "  cd agentarea-webapp && pnpm generate:api"
            echo ""
            echo "Diff (committed vs backend):"
            diff --unified=3 /tmp/committed.json /tmp/exported.json | head -100
            exit 1
          fi
          echo "openapi.json is up to date with the backend"
